<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P06 · 三件事</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 22px; }
</style>
</head>
<body>
  <p class="assertion">三件事</p>

  <svg class="figure" width="1660" height="540" viewBox="0 0 1660 540" fill="none">
    <!-- 件1 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">01 · 看不完的看完</text>
    <text x="0" y="100" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">每年 <tspan fill="#1F4E79">PB 级</tspan>原始观测数据</text>
    <text x="0" y="152" font-family="Noto Sans SC" font-size="24" fill="#55534E">人工分析要耗时数年，来不及出结论</text>
    <text x="0" y="196" font-family="Noto Sans SC" font-size="24" fill="#55534E">机器可以<tspan font-weight="500" fill="#141414">实时处理</tspan></text>

    <line x1="560" y1="30" x2="560" y2="260" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 件2 -->
    <text x="630" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">02 · 看不清的算出来</text>
    <text x="630" y="100" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">预报推理：<tspan fill="#1F4E79">天级 → 分钟级</tspan></text>
    <text x="630" y="152" font-family="Noto Sans SC" font-size="24" fill="#55534E">深圳海洋智能预报大模型（盘古框架·3D-EST）</text>
    <text x="630" y="196" font-family="Noto Sans SC" font-size="24" fill="#55534E">台风高频滚新，赤潮边漂边追</text>

    <line x1="1120" y1="30" x2="1120" y2="260" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 件3 -->
    <text x="1190" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">03 · 分散的连起来</text>
    <text x="1190" y="100" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">青岛「1+N+X」</text>
    <text x="1190" y="152" font-family="Noto Sans SC" font-size="24" fill="#55534E">渔书 · 琅琊 · 问海 · 羲和</text>
    <text x="1190" y="196" font-family="Noto Sans SC" font-size="24" fill="#55534E">数据交易平台汇聚超 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">50PB</tspan></text>

    <!-- 底部：从天级到分钟级 -->
    <line x1="0" y1="330" x2="1660" y2="330" stroke="#E8E6E1" stroke-width="1"/>
    <text x="0" y="395" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">ORDER OF MAGNITUDE</text>
    <text x="0" y="465" font-family="Noto Serif SC" font-weight="600" font-size="36" fill="#141414">从天级到分钟级，不是快一点，是<tspan fill="#1F4E79">量级的变化</tspan></text>
    <text x="0" y="522" font-family="Noto Sans SC" font-size="24" fill="#55534E">量级一变，过去做不了的事就成立了</text>
  </svg>

  <p class="foot">AI 在网里干三件事：<b>看完、算出、连起来</b>。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
