<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P08 · 看与干</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 22px; }
</style>
</head>
<body>
  <p class="assertion">看与干</p>

  <svg class="figure" width="1660" height="540" viewBox="0 0 1660 540" fill="none">
    <!-- 左：它解决的是哪一层 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">THIRD CONSTRAINT · 认知</text>
    <rect x="0" y="70" width="700" height="230" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="46" y="130" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">动的是「认知约束」</text>
    <text x="46" y="180" font-family="Noto Sans SC" font-size="24" fill="#55534E">看不见，就管不了</text>
    <text x="46" y="222" font-family="Noto Sans SC" font-size="24" fill="#55534E">「透明海洋」在把黑箱打开</text>
    <line x1="46" y1="248" x2="654" y2="248" stroke="#E8E6E1" stroke-width="1"/>
    <text x="46" y="280" font-family="Noto Sans SC" font-size="22" fill="#9B998F">但数据孤岛、标准不统一依然是瓶颈：从「有没有」迁到了「能不能通」</text>

    <!-- 右：边界 -->
    <text x="820" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE BOUNDARY · 留一个口子</text>
    <rect x="820" y="70" width="700" height="230" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="866" y="130" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">看清楚，不等于把活干了</text>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <text x="866" y="185">它能告诉你台风往哪走、赤潮漂到哪</text>
      <text x="866" y="227">但台风来了谁去躲？网衣破了谁去补？</text>
      <text x="866" y="270"><tspan font-weight="500" fill="#1F4E79">判断有了，动作还得有人做</tspan></text>
    </g>

    <!-- 下一讲连接 -->
    <line x1="0" y1="360" x2="1660" y2="360" stroke="#E8E6E1" stroke-width="1"/>
    <text x="0" y="440" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">下一讲：具身智能 —— <tspan fill="#1F4E79">把活接过去</tspan></text>
    <text x="0" y="500" font-family="Noto Sans SC" font-size="25" fill="#55534E">第一条线把海看清，第二条线把身体造出来。</text>
  </svg>

  <p class="foot">人工智能动的是认知层；<b>真正把手脚伸进海里的，是下一讲的具身智能</b>。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
