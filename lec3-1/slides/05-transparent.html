<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P05 · 透明海洋</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 64px 130px 0; }
  .foot { margin: 36px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
</head>
<body>
  <p class="assertion">透明海洋</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">CT SCAN OF THE OCEAN · 吴立新院士</text>

    <!-- 层级：空天地海 -->
    <g font-family="Noto Sans SC" font-size="24">
      <line x1="0" y1="90" x2="700" y2="90" stroke="#D8D6D0" stroke-width="2"/>
      <circle cx="60" cy="90" r="10" fill="#1F4E79"/>
      <text x="90" y="99" fill="#141414">卫星在天上看</text>

      <line x1="0" y1="180" x2="700" y2="180" stroke="#D8D6D0" stroke-width="2"/>
      <circle cx="60" cy="180" r="10" fill="#1F4E79"/>
      <text x="90" y="189" fill="#141414">无人机在低空看</text>

      <line x1="0" y1="270" x2="700" y2="270" stroke="#D8D6D0" stroke-width="2"/>
      <circle cx="60" cy="270" r="10" fill="#1F4E79"/>
      <text x="90" y="279" fill="#141414">浮标潜标在水面水下待着</text>

      <line x1="0" y1="360" x2="700" y2="360" stroke="#D8D6D0" stroke-width="2"/>
      <circle cx="60" cy="360" r="10" fill="#1F4E79"/>
      <text x="90" y="369" fill="#141414">潜器在深处跑</text>

      <text x="0" y="430" font-size="25" fill="#55534E">数据汇到一张网上——像给海洋做 <tspan font-weight="500" fill="#1F4E79">CT 扫描</tspan></text>
    </g>

    <line x1="790" y1="30" x2="790" y2="480" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 右：南海数字 -->
    <text x="860" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">南海 · 569 DAYS</text>
    <text x="860" y="140" font-family="JetBrains Mono" font-size="88" font-weight="500" fill="#1F4E79">569<tspan font-size="32" fill="#9B998F"> 天</tspan></text>
    <text x="860" y="195" font-family="Noto Sans SC" font-size="24" fill="#55534E">2024—2025 连续观测，南海北部协同观测</text>
    <text x="860" y="270" font-family="JetBrains Mono" font-size="46" font-weight="500" fill="#141414">17<tspan font-size="24" fill="#9B998F"> 潜标</tspan> + 17<tspan font-size="24" fill="#9B998F"> 滑翔机</tspan></text>
    <text x="860" y="325" font-family="Noto Sans SC" font-size="24" fill="#55534E">同步作业最高规模</text>
    <text x="860" y="400" font-family="JetBrains Mono" font-size="46" font-weight="500" fill="#141414">1.97<tspan font-size="24" fill="#9B998F"> 亿元</tspan></text>
    <text x="860" y="455" font-family="Noto Sans SC" font-size="24" fill="#55534E">岸基保障基地批复：新增 117 套潜标、60 台滑翔机</text>
  </svg>

  <p class="foot">不是把海变浅了，是<b>铺一张足够密的网</b>，让测不到的地方有数据。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
