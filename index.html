<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工智能和具身智能交叉融合海洋产业发展 · 主页</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #141414; --gray: #55534E; --faint: #9B998F;
    --line: #E8E6E1; --accent: #1F4E79; --accent-dk: #173d5f;
  }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans SC", sans-serif; color: var(--ink);
    background: #FFFFFF; min-height: 100vh;
    display: flex; flex-direction: column; position: relative; overflow-x: hidden;
  }

  /* top bar: course badge right */
  .topbar {
    display: flex; justify-content: flex-end; align-items: center;
    padding: 40px 72px 0;
  }
  .course-badge { display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text {
    font-size: 22px; font-weight: 500; color: var(--faint);
    letter-spacing: 0.06em; white-space: nowrap;
  }

  /* center block */
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center;
    padding: 24px 40px 90px; position: relative; z-index: 2;
  }
  .emblem { margin-bottom: 46px; opacity: 0; animation: fadeUp .9s .05s ease-out forwards; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace; font-size: 21px;
    letter-spacing: 0.34em; color: var(--accent); margin-bottom: 30px;
    opacity: 0; animation: fadeUp .9s .15s ease-out forwards;
  }
  h1 {
    font-family: "Noto Serif SC", serif; font-weight: 700;
    font-size: clamp(44px, 5.4vw, 96px); line-height: 1.22;
    letter-spacing: 0.02em; color: var(--ink);
    opacity: 0; animation: fadeUp .9s .25s ease-out forwards;
  }
  .rule {
    margin-top: 40px; width: 132px; height: 3px; background: var(--accent);
    opacity: 0; animation: fadeUp .9s .4s ease-out forwards;
  }
  .speaker {
    margin-top: 34px; font-size: 30px; font-weight: 300; color: var(--gray);
    letter-spacing: 0.04em;
    opacity: 0; animation: fadeUp .9s .5s ease-out forwards;
  }
  .speaker b { font-weight: 500; color: var(--ink); }
  .cta {
    margin-top: 56px; display: inline-flex; align-items: center; gap: 14px;
    background: var(--accent); color: #fff; text-decoration: none;
    padding: 17px 40px; font-size: 23px; font-weight: 500; letter-spacing: 0.05em;
    border: 2px solid var(--accent); transition: background .18s, color .18s;
    opacity: 0; animation: fadeUp .9s .6s ease-out forwards;
  }
  .cta .arr { font-family: "JetBrains Mono", monospace; transition: transform .18s; }
  .cta:hover { background: #fff; color: var(--accent); }
  .cta:hover .arr { transform: translateX(5px); }

  .wave { position: absolute; left: 0; bottom: 26px; z-index: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; opacity: 1 !important; }
  }
  @media (max-width: 720px) {
    .topbar { padding: 26px 26px 0; }
    .course-badge .cb-text { font-size: 17px; }
    .speaker { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="course-badge">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg>
      <span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span>
    </div>
  </div>

  <main>
    <div class="emblem">
      <svg width="128" height="128" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
        <line x1="10" y1="16" x2="22" y2="9" stroke="#1F4E79" stroke-width="1.7"/>
        <line x1="22" y1="9" x2="34" y2="15" stroke="#1F4E79" stroke-width="1.7"/>
        <line x1="10" y1="16" x2="34" y2="15" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2.4 2.8"/>
        <line x1="22" y1="9" x2="22" y2="23" stroke="#1F4E79" stroke-width="1.7"/>
        <circle cx="10" cy="16" r="3.1" fill="#1F4E79"/>
        <circle cx="22" cy="9" r="3.1" fill="#1F4E79"/>
        <circle cx="34" cy="15" r="3.1" fill="#1F4E79"/>
        <circle cx="22" cy="23" r="3.1" fill="#1F4E79"/>
        <path d="M4 33 Q11 29 18 33 T32 33 T40 33" stroke="#1F4E79" stroke-width="1.9" fill="none" stroke-linecap="round"/>
        <path d="M4 39 Q11 35 18 39 T32 39 T40 39" stroke="#9B998F" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
      </svg>
    </div>

    <div class="eyebrow">TRAINING · 海洋产业 × 人工智能</div>
    <h1>人工智能和具身智能<br>交叉融合海洋产业发展</h1>
    <div class="rule"></div>
    <p class="speaker">主讲人　<b>王益国</b></p>
    <a class="cta" href="catalog.html">浏览课程目录 <span class="arr">→</span></a>
  </main>

  <svg class="wave" width="100%" height="40" viewBox="0 0 1920 40" preserveAspectRatio="none" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>

</body>
</html>
