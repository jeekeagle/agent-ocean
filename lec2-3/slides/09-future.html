<p class="title">未来三句话</p>
<svg class="figure" width="1660" height="590" viewBox="0 0 1660 590" fill="none">
<text x="0" y="26" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">FUTURE · THREE MIGRATIONS</text>
<g font-family="Noto Sans SC">
<rect x="0" y="70" width="500" height="300" stroke="#141414" stroke-width="2" fill="none"/>
<text x="36" y="140" font-family="JetBrains Mono" font-size="21" fill="#9B998F">01</text>
<text x="36" y="196" font-size="29" font-weight="500" fill="#141414">看天 → 看数据</text>
<text x="36" y="248" font-size="23" fill="#55534E">作业窗口</text>
<text x="36" y="292" font-size="23" fill="#9B998F">预报天级压到分钟级</text>
<text x="36" y="330" font-size="23" fill="#9B998F">经验靠老师傅 → 数说了算</text>
<rect x="580" y="70" width="500" height="300" stroke="#141414" stroke-width="2" fill="none"/>
<text x="616" y="140" font-family="JetBrains Mono" font-size="21" fill="#9B998F">02</text>
<text x="616" y="196" font-size="29" font-weight="500" fill="#141414">靠经验 → 靠模型</text>
<text x="616" y="248" font-size="23" fill="#55534E">判断依据</text>
<text x="616" y="292" font-size="23" fill="#9B998F">8 年培养 → 1.5 分钟方案</text>
<text x="616" y="330" font-size="23" fill="#9B998F">模型学的正是老师傅的经验</text>
<rect x="1160" y="70" width="500" height="300" stroke="#1F4E79" stroke-width="3" fill="none"/>
<text x="1196" y="140" font-family="JetBrains Mono" font-size="21" fill="#1F4E79">03</text>
<text x="1196" y="196" font-size="29" font-weight="500" fill="#1F4E79">不可复制 → 可复制</text>
<text x="1196" y="248" font-size="23" fill="#141414">资源形态</text>
<text x="1196" y="292" font-size="23" fill="#141414">退休带不走 · 谁都能调用</text>
<text x="1196" y="330" font-size="23" fill="#1F4E79">最根本的一条</text>
</g>
<line x1="0" y1="420" x2="1660" y2="420" stroke="#E8E6E1" stroke-width="1"/>
<text x="0" y="486" font-family="Noto Serif SC" font-weight="600" font-size="31" fill="#141414">比的不是谁跑得快，是谁把<tspan fill="#1F4E79">约束迁移得更远</tspan></text>
</svg>
<p class="foot">迁移得越远，<b>护城河越深</b>。</p>
