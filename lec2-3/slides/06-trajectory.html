<body>
<div class="page">
<p class="title">三步迁移轨迹</p>
<svg class="figure" width="1660" height="585" viewBox="0 0 1660 585" fill="none">
<text x="0" y="26" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">OBJECT → SPACE → JUDGMENT</text>
<g font-family="Noto Sans SC">
<rect x="0" y="70" width="470" height="330" stroke="#141414" stroke-width="2" fill="none"/>
<text x="40" y="140" font-family="JetBrains Mono" font-size="21" fill="#9B998F">STEP 1</text>
<text x="40" y="196" font-size="30" font-weight="500" fill="#141414">物的约束</text>
<text x="40" y="248" font-size="23" fill="#55534E">能不能造出来 · 能不能用</text>
<text x="40" y="300" font-size="23" fill="#9B998F">清洗机器人 · 工船 · 水下机器人</text>
<text x="40" y="352" font-size="23" fill="#9B998F">硬门槛：造不出来就卡死</text>
<rect x="595" y="70" width="470" height="330" stroke="#141414" stroke-width="2" fill="none"/>
<text x="635" y="140" font-family="JetBrains Mono" font-size="21" fill="#9B998F">STEP 2</text>
<text x="635" y="196" font-size="30" font-weight="500" fill="#141414">空间的约束</text>
<text x="635" y="248" font-size="23" fill="#55534E">能不能到更远 · 更深 · 更大</text>
<text x="635" y="300" font-size="23" fill="#9B998F">深远海养殖 · 海上风电 · 深海探测</text>
<text x="635" y="352" font-size="23" fill="#9B998F">到了之后，新问题才冒出来</text>
<rect x="1190" y="70" width="470" height="330" stroke="#1F4E79" stroke-width="3" fill="none"/>
<text x="1230" y="140" font-family="JetBrains Mono" font-size="21" fill="#1F4E79">STEP 3</text>
<text x="1230" y="196" font-size="30" font-weight="500" fill="#1F4E79">判断的约束</text>
<text x="1230" y="248" font-size="23" fill="#141414">怎么决策 · 怎么协同 · 怎么反应</text>
<text x="1230" y="300" font-size="23" fill="#1F4E79">AI 与具身智能的落点</text>
<text x="1230" y="352" font-size="23" fill="#9B998F">依次浮现，不是并列</text>
</g>
<line x1="470" y1="235" x2="595" y2="235" stroke="#B9B7AF" stroke-width="2.5"/><path d="M595 235 L 579 225 L 579 245 Z" fill="#B9B7AF"/>
<line x1="1065" y1="235" x2="1190" y2="235" stroke="#1F4E79" stroke-width="3"/><path d="M1190 235 L 1172 225 L 1172 245 Z" fill="#1F4E79"/>
<line x1="0" y1="445" x2="1660" y2="445" stroke="#E8E6E1" stroke-width="1"/>
<text x="0" y="508" font-family="Noto Serif SC" font-weight="600" font-size="31" fill="#141414">解决完前一层，后一层才冒出来</text>
<text x="0" y="552" font-family="Noto Sans SC" font-size="24" fill="#9B998F">森科特五年啃下清洗机器人，是第一步的缩影；风电 900 万千瓦装机之后，运维成了第二步的新题。</text>
</svg>
<p class="foot">判断这一层，正是 <b>AI 落子的地方</b>。</p>
</div>
