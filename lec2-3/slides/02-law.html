<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 约束换位规律</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:56px}
.foot{margin-top:30px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="page">
<p class="title">约束换位规律</p>
<svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
<text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">RELOCATION · NOT ELIMINATION</text>
<g font-family="Noto Sans SC">
<rect x="0" y="90" width="520" height="230" stroke="#141414" stroke-width="2" fill="none"/>
<text x="40" y="160" font-size="30" font-weight="500" fill="#141414">旧位置</text>
<text x="40" y="212" font-size="24" fill="#55534E">人躲台风</text>
<text x="40" y="258" font-family="JetBrains Mono" font-size="22" fill="#9B998F">696 人上岸 · 停产</text>
<line x1="560" y1="205" x2="700" y2="205" stroke="#1F4E79" stroke-width="3"/>
<path d="M712 205 L 692 193 L 692 217 Z" fill="#1F4E79"/>
<text x="578" y="175" text-anchor="middle" font-family="JetBrains Mono" font-size="19" fill="#1F4E79">迁移</text>
<rect x="740" y="90" width="520" height="230" stroke="#1F4E79" stroke-width="3" fill="none"/>
<text x="780" y="160" font-size="30" font-weight="500" fill="#1F4E79">新位置</text>
<text x="780" y="212" font-size="24" fill="#141414">船躲台风</text>
<text x="780" y="258" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">自航 · 追水温</text>
<rect x="1300" y="90" width="360" height="230" stroke="#E8E6E1" stroke-width="2" fill="none"/>
<text x="1340" y="160" font-size="30" font-weight="500" fill="#55534E">台风本身</text>
<text x="1340" y="212" font-size="24" fill="#9B998F">还在 · 海况依旧</text>
<text x="1340" y="258" font-family="JetBrains Mono" font-size="22" fill="#9B998F">unchanged</text>
</g>
<line x1="0" y1="390" x2="1660" y2="390" stroke="#E8E6E1" stroke-width="1"/>
<text x="0" y="460" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">约束从来没有被消除过，它只是<tspan fill="#1F4E79">换了一个位置</tspan></text>
<text x="0" y="512" font-family="Noto Sans SC" font-size="24" fill="#9B998F">这不是漂亮话，是一条能验证的规律。</text>
</svg>
<p class="foot">往下三页，每一页都是一次<b>换位现场</b>。</p>
</div>
<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
</body>
</html>
