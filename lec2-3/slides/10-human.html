<g font-family="Noto Sans SC">
<rect x="0" y="70" width="740" height="180" stroke="#141414" stroke-width="2" fill="none"/>

<text x="960" y="228" font-size="23" fill="#1F4E79">约束在机器身上，人守最后一道</text>

<g font-family="Noto Sans SC">
<text x="110" y="380" font-size="28" fill="#141414">「装备越智能，越需要人的经验与判断。」</text>
<text x="110" y="428" font-size="24" fill="#9B998F">—— 大连海事大学 许民强 · 世界航海装备大会</text>
<line x1="60" y1="330" x2="60" y2="440" stroke="#1F4E79" stroke-width="4"/>

<p class="foot">终点不是没人了，是人<b>换了个位置</b>。</p>
