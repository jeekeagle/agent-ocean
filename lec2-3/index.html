<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>2.3 约束的迁移与未来路径 · 课件</title>
<script>
window.DECK_MANIFEST = [
{ file: "slides/01-cover.html", label: "封面" },
{ file: "slides/02-law.html", label: "约束换位规律" },
{ file: "slides/03-guoxin.html", label: "国信一号工船" },
{ file: "slides/04-fleet.html", label: "三船联动" },
{ file: "slides/05-cage.html", label: "两人与百万尾" },
{ file: "slides/06-trajectory.html", label: "三步迁移轨迹" },
{ file: "slides/07-wind.html", label: "风电无人巡视" },
{ file: "slides/08-berth.html", label: "排泊智能体" },
{ file: "slides/09-future.html", label: "未来三句话" },
{ file: "slides/10-human.html", label: "人的新位置" },
{ file: "slides/11-close.html", label: "收口一句话" }
];
window.DECK_WIDTH = 1920;
window.DECK_HEIGHT = 1080;
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0a0a;overflow:hidden;font-family:-apple-system,"PingFang SC",sans-serif}
#stage{position:fixed;top:0;left:0;transform-origin:top left;background:#fff;box-shadow:0 10px 60px rgba(0,0,0,.4)}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.counter{position:fixed;bottom:20px;right:20px;background:rgba(0,0,0,.65);color:#fff;padding:6px 14px;border-radius:999px;font-size:13px;z-index:100;user-select:none;opacity:.7}
.counter .label{color:rgba(255,255,255,.7);margin-left:8px}
.nav-zone{position:fixed;top:0;bottom:0;width:15%;cursor:pointer;z-index:50}
.nav-zone.left{left:0}.nav-zone.right{right:0}
.nav-hint{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:999px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:opacity .2s}
.nav-zone.left .nav-hint{left:20px}.nav-zone.right .nav-hint{right:20px}
.nav-zone:hover .nav-hint{opacity:1}
@media print{@page{size:1920px 1080px;margin:0}html,body{background:#fff;overflow:visible;height:auto}#stage{position:static;transform:none!important;box-shadow:none}.counter,.nav-zone{display:none!important}.print-stack{display:block}.print-stack iframe{width:1920px;height:1080px;page-break-after:always;display:block}}
</style>
</head>
<body>
<div id="stage"><iframe id="frame" src="about:blank"></iframe></div>
<div class="nav-zone left" id="navL"><div class="nav-hint">‹</div></div>
<div class="nav-zone right" id="navR"><div class="nav-hint">›</div></div>
<div class="counter" id="counter">1 / 1</div>
<div class="print-stack" id="printStack" style="display:none"></div>
<script>
(function(){const W=window.DECK_WIDTH||1920,H=window.DECK_HEIGHT||1080,deck=window.DECK_MANIFEST||[],stage=document.getElementById('stage'),frame=document.getElementById('frame'),counter=document.getElementById('counter'),printStack=document.getElementById('printStack'),storageKey='deck-23-'+location.pathname;let current=0;stage.style.width=W+'px';stage.style.height=H+'px';function fit(){const s=Math.min(window.innerWidth/W,window.innerHeight/H),x=(window.innerWidth-W*s)/2,y=(window.innerHeight-H*s)/2;stage.style.transform=`translate(${x}px, ${y}px) scale(${s})`}function show(idx){if(idx<0||idx>=deck.length)return;current=idx;frame.src=deck[idx].file;counter.innerHTML=`${idx+1} / ${deck.length} <span class="label">${deck[idx].label||''}</span>`;try{localStorage.setItem(storageKey,String(idx))}catch(_){}if(location.hash!=='#'+(idx+1))history.replaceState(null,'','#'+(idx+1))}function next(){show(Math.min(current+1,deck.length-1))}function prev(){show(Math.max(current-1,0))}document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;switch(e.key){case'ArrowRight':case' ':case'PageDown':e.preventDefault();next();break;case'ArrowLeft':case'PageUp':e.preventDefault();prev();break;case'Home':e.preventDefault();show(0);break;case'End':e.preventDefault();show(deck.length-1);break;case'p':case'P':window.print();break;default:if(e.key>='1'&&e.key<='9'){const i=parseInt(e.key,10)-1;if(i<deck.length){e.preventDefault();show(i)}}}});document.getElementById('navL').addEventListener('click',prev);document.getElementById('navR').addEventListener('click',next);window.addEventListener('resize',fit);window.addEventListener('hashchange',()=>{const m=location.hash.match(/^#(\d+)$/);if(m)show(parseInt(m[1],10)-1)});const hm=location.hash.match(/^#(\d+)$/);if(hm)current=Math.min(parseInt(hm[1],10)-1,deck.length-1);else try{const v=parseInt(localStorage.getItem(storageKey),10);if(!isNaN(v)&&v>=0&&v<deck.length)current=v}catch(_){}fit();show(current);window.addEventListener('beforeprint',()=>{printStack.innerHTML='';deck.forEach(it=>{const f=document.createElement('iframe');f.src=it.file;printStack.appendChild(f)});printStack.style.display='block';stage.style.display='none'});window.addEventListener('afterprint',()=>{printStack.innerHTML='';printStack.style.display='none';stage.style.display=''})})();
</script>
</body>
</html>
