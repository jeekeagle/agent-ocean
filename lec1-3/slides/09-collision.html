<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>政策与技术条件</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">政策与技术条件</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">POLICY GIVES REASON · TECH GIVES TOOL</text>

    <!-- 左：政策 -->
    <rect x="20" y="90" width="560" height="300" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="60" y="152" font-family="Noto Serif SC" font-weight="700" font-size="36" fill="#141414">政策</text>
    <text x="60" y="204" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#9B998F">THE REASON</text>
    <line x1="60" y1="228" x2="540" y2="228" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="60" y="280">出台<tspan font-weight="500" fill="#141414">指导意见</tspan></text>
      <text x="60" y="328">遴选<tspan font-weight="500" fill="#141414">推广名单</tspan></text>
      <text x="310" y="280">给方向、给理由</text>
      <text x="310" y="328">推着落地</text>
    </g>

    <!-- 右：技术 -->
    <rect x="1080" y="90" width="560" height="300" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="1120" y="152" font-family="Noto Serif SC" font-weight="700" font-size="36" fill="#141414">技术</text>
    <text x="1120" y="204" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#9B998F">THE TOOL</text>
    <line x1="1120" y1="228" x2="1600" y2="228" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="1120" y="280">能力<tspan font-weight="500" fill="#1F4E79">能搬家</tspan></text>
      <text x="1120" y="328">装备<tspan font-weight="500" fill="#1F4E79">能下水</tspan></text>
      <text x="1370" y="280">给工具、给身板</text>
      <text x="1370" y="328">接得住推力</text>
    </g>

    <!-- 对撞箭头 -->
    <line x1="600" y1="240" x2="740" y2="240" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M756 240 L 734 229 L 734 251 Z" fill="#1F4E79"/>
    <line x1="1060" y1="240" x2="920" y2="240" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M904 240 L 926 229 L 926 251 Z" fill="#1F4E79"/>

    <!-- 撞击点 -->
    <rect x="770" y="180" width="120" height="120" rx="4" stroke="#1F4E79" stroke-width="3" fill="#FFFFFF"/>
    <text x="830" y="250" text-anchor="middle" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">落地</text>

    <!-- 反事实 -->
    <text x="20" y="470" font-family="Noto Sans SC" font-size="26" fill="#55534E">技术不到能搬的份上，政策<tspan font-weight="500" fill="#141414">想推也推不动</tspan>——推了没有东西可落地。</text>
    <text x="20" y="524" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">现在，两头撞上了。</text>
  </svg>

  <p class="foot">政策给的是<b>理由</b>，技术给的是<b>工具</b>——两者同时成熟，时机才成立。</p>
</body>
</html>
