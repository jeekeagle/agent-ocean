<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>政策与市场</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">政策与市场</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SHANDONG · POLICY-DRIVEN ROLLOUT</text>

    <!-- 左：名单 -->
    <rect x="0" y="70" width="470" height="330" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="130" font-family="Noto Sans SC" font-size="25" fill="#55534E">遴选公布重点推广的</text>
    <text x="40" y="230" font-family="JetBrains Mono" font-size="86" font-weight="500" fill="#1F4E79">100</text>
    <text x="240" y="230" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">个行业大模型</text>
    <text x="40" y="300" font-family="Noto Sans SC" font-size="25" fill="#55534E">覆盖 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">13</tspan> 个领域</text>
    <text x="40" y="356" font-family="Noto Sans SC" font-size="25" fill="#55534E">垂直领域大模型 = <tspan font-weight="500" fill="#1F4E79">突破口</tspan></text>

    <!-- 中：收入柱 -->
    <text x="560" y="70" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">MODEL BUSINESS REVENUE · 亿元</text>

    <!-- 柱1：2025 全年 63.75 -->
    <rect x="580" y="140" width="240" height="260" fill="#D8D6D0"/>
    <text x="700" y="120" text-anchor="middle" font-family="JetBrains Mono" font-size="42" font-weight="500" fill="#141414">63.75</text>
    <text x="700" y="436" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">2025 全年</text>

    <!-- 柱2：2026 上半年 59.6（接近全年高度） -->
    <rect x="900" y="161" width="240" height="239" fill="#1F4E79"/>
    <text x="1020" y="141" text-anchor="middle" font-family="JetBrains Mono" font-size="42" font-weight="500" fill="#1F4E79">59.6</text>
    <text x="1020" y="436" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">2026 上半年</text>

    <!-- 同比 -->
    <rect x="1200" y="140" width="420" height="260" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1240" y="210" font-family="Noto Sans SC" font-size="25" fill="#55534E">2025 年同比</text>
    <text x="1240" y="320" font-family="JetBrains Mono" font-size="76" font-weight="500" fill="#1F4E79">+104.5%</text>
    <text x="1240" y="372" font-family="Noto Sans SC" font-size="24" fill="#55534E">一年翻了一倍</text>

    <!-- 底部 -->
    <line x1="0" y1="480" x2="1660" y2="480" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="536" font-family="Noto Sans SC" font-size="27" fill="#55534E">今年上半年 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">59.6</tspan> 亿——<tspan font-weight="500" fill="#141414">半年就逼近去年全年</tspan>。</text>
    <text x="0" y="590" font-family="Noto Sans SC" font-size="27" fill="#55534E">不是企业闷头干出来的，是省里出台意见、遴选名单、一路推出来的。</text>
  </svg>

  <p class="foot">这不是自发的热潮，是<b>政策一路推出来</b>的答卷。</p>
</body>
</html>
