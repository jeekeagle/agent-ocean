<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水下机器人应用</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">水下机器人应用</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">160,000 m³ · DIVERS VS ROBOT</text>

    <!-- 左：人下水 -->
    <rect x="0" y="70" width="760" height="380" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">过去 · 人下水</text>
    <line x1="40" y1="158" x2="720" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>

    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="214">深水高压</text>
      <text x="40" y="262">急流裹挟 · 水下杂物缠绕</text>
      <text x="40" y="310">作业窗口短，风浪稍大就停工</text>
    </g>

    <text x="40" y="400" font-family="JetBrains Mono" font-size="54" font-weight="500" fill="#9B998F">好几天</text>
    <text x="340" y="400" font-family="Noto Sans SC" font-size="25" fill="#9B998F">潜水员干完 16 万立方米</text>

    <!-- 箭头 -->
    <line x1="800" y1="260" x2="860" y2="260" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M874 260 L 852 249 L 852 271 Z" fill="#1F4E79"/>

    <!-- 右：机下水 -->
    <rect x="900" y="70" width="760" height="380" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="940" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">现在 · 机下水</text>
    <line x1="940" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>

    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="940" y="214">水下机器人<tspan font-weight="500" fill="#141414">顶着高压、顺着急流</tspan></text>
      <text x="940" y="262">跨海大桥桩基 · 海洋牧场网箱</text>
      <text x="940" y="310">风浪大，改天再下——不占人</text>
    </g>

    <text x="940" y="400" font-family="JetBrains Mono" font-size="54" font-weight="500" fill="#1F4E79">8 小时</text>
    <text x="1180" y="400" font-family="Noto Sans SC" font-size="25" fill="#55534E">完成全覆盖巡检</text>

    <!-- 底部 -->
    <line x1="0" y1="500" x2="1660" y2="500" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="27" fill="#55534E">同样 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">16 万立方米</tspan>养殖水体：潜水员<tspan font-weight="500" fill="#9B998F">好几天</tspan>，机器人<tspan font-weight="500" fill="#1F4E79">8 小时</tspan>。</text>
    <text x="0" y="606" font-family="Noto Sans SC" font-size="27" fill="#55534E">从「人下水」到「机下水」——<tspan font-weight="500" fill="#141414">已经在海上干着了</tspan>。</text>
  </svg>

  <p class="foot">这不是远景，是<b>已经落地</b>的事。</p>
</body>
</html>
