<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本轮技术特征</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">本轮技术特征</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">FROM HOW FAST TO WHO DOES IT</text>

    <!-- 上：这一次 -->
    <rect x="20" y="70" width="1620" height="140" rx="4" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="60" y="130" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">这一次</text>
    <text x="60" y="182" font-family="Noto Sans SC" font-size="26" fill="#55534E">解决<tspan font-weight="500" fill="#141414">做不做、怎么做</tspan>——是「<tspan font-weight="500" fill="#1F4E79">谁来干</tspan>」的问题</text>
    <text x="1580" y="130" text-anchor="end" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">NOW</text>

    <!-- 下：前几次 -->
    <rect x="20" y="250" width="1620" height="110" rx="4" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <text x="60" y="310" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">前几次技术变革</text>
    <text x="60" y="348" font-family="Noto Sans SC" font-size="24" fill="#9B998F">解决算得快、传得远——是「怎么算」的问题</text>
    <text x="1580" y="310" text-anchor="end" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">BEFORE</text>

    <!-- 场景条：横跨所有场景 -->
    <text x="20" y="420" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">EVERY SCENE, ONE ABILITY</text>
    <rect x="20" y="440" width="1620" height="60" fill="#1F4E79"/>
    <text x="830" y="480" text-anchor="middle" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#FFFFFF">本事第一次不在某个场景里，而在所有场景之上</text>

    <g font-family="Noto Sans SC" font-size="22" fill="#9B998F">
      <text x="40" y="545">港口</text>
      <text x="180" y="545">牧场</text>
      <text x="320" y="545">工船</text>
      <text x="460" y="545">制造</text>
      <text x="600" y="545">金融</text>
      <text x="740" y="545">医疗</text>
      <text x="880" y="545">政务</text>
      <text x="1020" y="545">能源</text>
      <text x="1160" y="545">农业</text>
      <text x="1300" y="545">物流</text>
      <text x="1440" y="545">渔事</text>
      <text x="1560" y="545">……</text>
    </g>
  </svg>

  <p class="foot">各行业最终要的，就是<b>有人把活接过去</b>。</p>
</body>
</html>
