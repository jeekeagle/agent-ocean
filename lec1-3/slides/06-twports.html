<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>两港案例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">两港案例</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <!-- 左：日照港 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">RIZHAO · FULLY AUTOMATED TERMINAL</text>
    <text x="0" y="90" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">日照港 · 全自动化集装箱码头</text>

    <g>
      <rect x="0" y="140" width="240" height="220" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="120" y="260" text-anchor="middle" font-family="JetBrains Mono" font-size="56" font-weight="500" fill="#1F4E79">+50%</text>
      <text x="120" y="316" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">单机效率</text>

      <rect x="270" y="140" width="240" height="220" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="390" y="260" text-anchor="middle" font-family="JetBrains Mono" font-size="56" font-weight="500" fill="#1F4E79">−70%</text>
      <text x="390" y="316" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">综合成本</text>

      <rect x="540" y="140" width="240" height="220" rx="4" stroke="#101010" stroke-width="2.5" fill="none"/>
      <text x="660" y="260" text-anchor="middle" font-family="JetBrains Mono" font-size="56" font-weight="500" fill="#141414">−80%</text>
      <text x="660" y="316" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">人力成本</text>
    </g>

    <text x="0" y="420" font-family="Noto Sans SC" font-size="25" fill="#55534E">投产以来，三个数一起往下走——</text>
    <text x="0" y="466" font-family="Noto Sans SC" font-size="25" fill="#55534E">效率在涨，<tspan font-weight="500" fill="#1F4E79">人和成本在退</tspan>。</text>

    <text x="0" y="570" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#9B998F">CASE 01</text>

    <!-- 分隔 -->
    <line x1="860" y1="30" x2="860" y2="560" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 右：厦门港海天码头 -->
    <text x="930" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">XIAMEN · HAITIAN TERMINAL</text>
    <text x="930" y="90" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">厦门港海天码头 · 龙门吊司机</text>

    <!-- 过去 -->
    <rect x="930" y="140" width="330" height="220" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="970" y="196" font-family="Noto Serif SC" font-weight="600" font-size="26" fill="#55534E">过去</text>
    <text x="970" y="248" font-family="Noto Sans SC" font-size="24" fill="#55534E">不足 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">3㎡</tspan> 高空驾驶室</text>
    <text x="970" y="292" font-family="Noto Sans SC" font-size="24" fill="#55534E">爬 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">20</tspan> 米高，肉眼对位</text>
    <text x="970" y="336" font-family="Noto Sans SC" font-size="24" fill="#55534E">锁孔只有<tspan font-weight="500" fill="#141414">拳头大</tspan></text>

    <!-- 箭头 -->
    <line x1="1275" y1="250" x2="1325" y2="250" stroke="#1F4E79" stroke-width="3"/>
    <path d="M1338 250 L 1318 240 L 1318 260 Z" fill="#1F4E79"/>

    <!-- 现在 -->
    <rect x="1360" y="140" width="300" height="220" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1400" y="196" font-family="Noto Serif SC" font-weight="600" font-size="26" fill="#1F4E79">现在</text>
    <text x="1400" y="248" font-family="Noto Sans SC" font-size="24" fill="#55534E">搬进<tspan font-weight="500" fill="#141414">远程控制中心</tspan></text>
    <text x="1400" y="292" font-family="Noto Sans SC" font-size="24" fill="#55534E">一人远程同时操作</text>
    <text x="1400" y="336" font-family="JetBrains Mono" font-size="28" font-weight="500" fill="#1F4E79">3–6 台</text>

    <text x="930" y="420" font-family="Noto Sans SC" font-size="25" fill="#55534E">从爬高空、盯锁孔，到坐在中心里，</text>
    <text x="930" y="466" font-family="Noto Sans SC" font-size="25" fill="#55534E"><tspan font-weight="500" fill="#1F4E79">一名司机顶过去三到六个岗位</tspan>。</text>

    <text x="930" y="570" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#9B998F">CASE 02</text>
  </svg>

  <p class="foot">两组数听清楚：一边是<b>能力在涨</b>，一边是<b>人在退</b>。</p>
</body>
</html>
