<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>青岛港案例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">青岛港案例</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <!-- 左：模型档案 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">XINGANG LLM · QINGDAO PORT</text>
    <rect x="0" y="70" width="470" height="330" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="130" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">星港大模型</text>
    <line x1="40" y1="156" x2="430" y2="156" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="222" font-family="JetBrains Mono" font-size="46" font-weight="500" fill="#1F4E79">350亿</text>
    <text x="210" y="222" font-family="Noto Sans SC" font-size="25" fill="#55534E">参数</text>
    <text x="40" y="286" font-family="Noto Sans SC" font-size="25" fill="#55534E">全国港口行业<tspan font-weight="500" fill="#141414">第一个</tspan>垂直大模型</text>
    <text x="40" y="334" font-family="Noto Sans SC" font-size="25" fill="#55534E">交通运输部<tspan font-weight="500" fill="#141414">全国典型案例</tspan></text>
    <text x="40" y="378" font-family="JetBrains Mono" font-size="19" fill="#9B998F">RELEASED · 去年 10.31</text>

    <!-- 中：箭头 -->
    <line x1="510" y1="235" x2="580" y2="235" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M592 235 L 574 225 L 574 245 Z" fill="#B9B7AF"/>

    <!-- 右：人 vs 智能体 -->
    <text x="630" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">MASTER VS AGENT</text>

    <!-- 人 -->
    <rect x="630" y="70" width="470" height="330" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="670" y="128" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">靠人</text>
    <text x="670" y="212" font-family="JetBrains Mono" font-size="64" font-weight="500" fill="#55534E">8–10<tspan font-size="30">年</tspan></text>
    <text x="670" y="262" font-family="Noto Sans SC" font-size="24" fill="#9B998F">培养一名合格计划员</text>
    <text x="670" y="316" font-family="Noto Sans SC" font-size="24" fill="#55534E"><tspan font-family="JetBrains Mono" fill="#141414">130+</tspan> 个要素 · 一轮 3–4 小时</text>
    <text x="670" y="362" font-family="Noto Sans SC" font-size="24" fill="#55534E">船晚到，一天重画<tspan font-weight="500" fill="#141414">十几次</tspan></text>

    <!-- 智能体 -->
    <rect x="1150" y="70" width="510" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1190" y="128" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">排泊智能体</text>
    <text x="1190" y="212" font-family="JetBrains Mono" font-size="64" font-weight="500" fill="#1F4E79">1.5<tspan font-size="30">分钟</tspan></text>
    <text x="1190" y="262" font-family="Noto Sans SC" font-size="24" fill="#55534E">出一套完整方案</text>
    <text x="1190" y="316" font-family="Noto Sans SC" font-size="24" fill="#55534E">系统推优采纳率 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">≥90%</tspan></text>
    <text x="1190" y="362" font-family="Noto Sans SC" font-size="24" fill="#55534E">把老师傅经验变成<tspan font-weight="500" fill="#141414">可复制</tspan>的</text>

    <path d="M1110 235 L 1140 235" stroke="#1F4E79" stroke-width="3"/>
    <path d="M1148 235 L 1130 225 L 1130 245 Z" fill="#1F4E79"/>

    <!-- 底部换算 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">8 到 10 年</text>
    <text x="270" y="520" font-family="JetBrains Mono" font-size="34" fill="#9B998F">→</text>
    <text x="340" y="520" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">1.5 分钟</text>
    <text x="0" y="580" font-family="Noto Sans SC" font-size="26" fill="#55534E">同一件事，两种算法——<tspan font-weight="500" fill="#141414">经验第一次变成可复制、可调用的资产</tspan>。</text>
  </svg>

  <p class="foot">这不是快慢的差别，是<b>两种东西</b>的差别。</p>
</body>
</html>
