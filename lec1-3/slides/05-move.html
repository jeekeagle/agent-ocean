<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>技术迁移性</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">技术迁移性</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THEN · ABILITY NAILED TO ONE SCENE</text>

    <!-- 左：钉死 -->
    <rect x="0" y="70" width="480" height="60" fill="#E8E6E1"/>
    <text x="30" y="110" font-family="Noto Sans SC" font-size="25" fill="#55534E">岸上声呐算法</text>
    <rect x="0" y="150" width="480" height="60" fill="#E8E6E1"/>
    <text x="30" y="190" font-family="Noto Sans SC" font-size="25" fill="#55534E">港口调度系统</text>
    <!-- 钉子 -->
    <g stroke="#1F4E79" stroke-width="3">
      <line x1="430" y1="70" x2="430" y2="130"/>
      <line x1="415" y1="85" x2="445" y2="115"/>
      <line x1="445" y1="85" x2="415" y2="115"/>
      <line x1="430" y1="150" x2="430" y2="210"/>
      <line x1="415" y1="165" x2="445" y2="195"/>
      <line x1="445" y1="165" x2="415" y2="195"/>
    </g>
    <text x="0" y="270" font-family="Noto Sans SC" font-size="25" fill="#55534E">搬去渔场？<tspan font-weight="500" fill="#141414">没用</tspan>。搬上岸？<tspan font-weight="500" fill="#141414">也没用</tspan>。</text>

    <rect x="0" y="320" width="480" height="170" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="36" y="376" font-family="Noto Sans SC" font-size="25" fill="#55534E">每上一个新场景：</text>
    <text x="36" y="424" font-family="Noto Sans SC" font-size="25" fill="#55534E">重新<tspan font-weight="500" fill="#141414">招人</tspan> · 重新<tspan font-weight="500" fill="#141414">标数据</tspan></text>
    <text x="36" y="468" font-family="Noto Sans SC" font-size="25" fill="#55534E">重新<tspan font-weight="500" fill="#141414">训一个模型</tspan>——再造一个轮子</text>

    <text x="240" y="570" text-anchor="middle" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#9B998F">PAST</text>

    <!-- 中：分隔 + 箭头 -->
    <line x1="540" y1="60" x2="540" y2="560" stroke="#E8E6E1" stroke-width="1.5"/>
    <line x1="580" y1="300" x2="650" y2="300" stroke="#1F4E79" stroke-width="3"/>
    <path d="M664 300 L 644 290 L 644 310 Z" fill="#1F4E79"/>

    <!-- 右：能搬 -->
    <text x="710" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">NOW · ABILITY THAT MOVES</text>
    <rect x="710" y="70" width="950" height="90" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="750" y="126" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">大模型学的是规律本身</text>
    <text x="1140" y="126" font-family="Noto Sans SC" font-size="24" fill="#55534E">——哪个行当都成立的东西</text>

    <!-- 搬家路径 -->
    <g font-family="Noto Sans SC" font-size="24">
      <rect x="710" y="230" width="200" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="810" y="273" text-anchor="middle" fill="#141414">制造业</text>
      <rect x="960" y="230" width="180" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="1050" y="273" text-anchor="middle" fill="#141414">金融</text>
      <rect x="1190" y="230" width="180" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="1280" y="273" text-anchor="middle" fill="#141414">医疗</text>
      <rect x="1420" y="230" width="200" height="70" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="1520" y="273" text-anchor="middle" fill="#1F4E79">海洋</text>
    </g>
    <path d="M910 265 C 930 245, 940 245, 958 262" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M966 268 L 948 268 L 956 252 Z" fill="#B9B7AF"/>
    <path d="M1140 265 C 1160 245, 1170 245, 1188 262" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M1196 268 L 1178 268 L 1186 252 Z" fill="#B9B7AF"/>
    <path d="M1370 265 C 1390 245, 1400 245, 1418 262" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <path d="M1426 268 L 1408 268 L 1416 252 Z" fill="#1F4E79"/>

    <text x="710" y="380" font-family="Noto Sans SC" font-size="26" fill="#55534E">同一份能力，从制造业搬到金融、医疗，<tspan font-weight="500" fill="#1F4E79">再搬到海洋</tspan>。</text>
    <text x="710" y="430" font-family="Noto Sans SC" font-size="26" fill="#55534E">能搬，你就<tspan font-weight="500" fill="#141414">不必自己造那个轮子</tspan>。</text>

    <rect x="710" y="480" width="950" height="110" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="750" y="532" font-family="Noto Sans SC" font-size="26" fill="#55534E">门槛从<tspan font-weight="500" fill="#141414">「建一个团队」</tspan>，变成<tspan font-weight="500" fill="#1F4E79">「会用浏览器」</tspan></text>
    <text x="750" y="574" font-family="Noto Sans SC" font-size="23" fill="#9B998F">打开网页、注册账号，会打字就能用</text>
  </svg>

  <p class="foot">过去的能力钉在场景上，这一轮的能力——<b>能搬家</b>。</p>
</body>
</html>
