<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>成武县案例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">成武县案例</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">5 PEOPLE × 729 ENTERPRISES</text>

    <!-- 左：巨大的 5 -->
    <text x="20" y="300" font-family="JetBrains Mono" font-size="260" font-weight="500" fill="#1F4E79">5</text>
    <text x="240" y="200" font-family="Noto Serif SC" font-weight="600" font-size="36" fill="#141414">个人</text>
    <text x="240" y="256" font-family="Noto Sans SC" font-size="25" fill="#55534E">日常运营团队</text>
    <text x="240" y="300" font-family="Noto Sans SC" font-size="25" fill="#55534E">成武县 · 输变电产业大模型</text>
    <text x="20" y="400" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">A COUNTY-LEVEL TEAM</text>

    <!-- 中：箭头 -->
    <line x1="470" y1="220" x2="540" y2="220" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M552 220 L 534 210 L 534 230 Z" fill="#B9B7AF"/>
    <text x="466" y="270" font-family="Noto Sans SC" font-size="23" fill="#9B998F">撑起</text>

    <!-- 右：平台规模 -->
    <text x="610" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE PLATFORM</text>
    <g>
      <rect x="610" y="70" width="330" height="130" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="650" y="140" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#141414">729</text>
      <text x="650" y="180" font-family="Noto Sans SC" font-size="24" fill="#55534E">家入驻企业</text>

      <rect x="980" y="70" width="330" height="130" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="1020" y="140" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#141414">20+</text>
      <text x="1020" y="180" font-family="Noto Sans SC" font-size="24" fill="#55534E">家本地企业服务中</text>

      <rect x="610" y="240" width="700" height="160" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="650" y="300" font-family="Noto Sans SC" font-size="26" fill="#55534E">几年前，做一个覆盖 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">700+</tspan> 家企业的</text>
      <text x="650" y="348" font-family="Noto Sans SC" font-size="26" fill="#55534E">数字化平台——得是<tspan font-weight="500" fill="#1F4E79">一支队伍</tspan>的规模</text>
    </g>

    <!-- 右侧结论 -->
    <line x1="1400" y1="70" x2="1400" y2="400" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="1450" y="180" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">养队伍</text>
    <text x="1450" y="230" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#9B998F">烧几年钱</text>
    <text x="1450" y="300" font-family="JetBrains Mono" font-size="26" fill="#1F4E79">↓</text>
    <text x="1450" y="356" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">几个人</text>
    <text x="1450" y="406" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">一个小公司</text>

    <!-- 底部 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Sans SC" font-size="27" fill="#55534E">一个省里的县城、一家小公司，都能干<tspan font-weight="500" fill="#141414">过去要大团队才敢想</tspan>的事。</text>
    <text x="0" y="576" font-family="Noto Sans SC" font-size="27" fill="#55534E">做这件事的门槛，塌了。</text>
  </svg>

  <p class="foot">过去要养一支队伍、烧几年钱——现在，<b>5 个人</b>就够了。</p>
</body>
</html>
