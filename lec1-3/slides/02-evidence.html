<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三个事实</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">三个事实</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THREE PIECES OF EVIDENCE</text>

    <line x1="540" y1="70" x2="540" y2="440" stroke="#E8E6E1" stroke-width="1.5"/>
    <line x1="1100" y1="70" x2="1100" y2="440" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 一 门槛 -->
    <g>
      <text x="40" y="110" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">I</text>
      <text x="40" y="180" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">门槛塌了</text>
      <text x="40" y="260" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#1F4E79">8–10年 → 1.5分钟</text>
      <text x="40" y="320" font-family="Noto Sans SC" font-size="25" fill="#55534E">青岛港排泊智能体</text>
      <text x="40" y="364" font-family="Noto Sans SC" font-size="25" fill="#55534E">能力第一次能搬家</text>
    </g>

    <!-- 二 差距 -->
    <g>
      <text x="600" y="110" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">II</text>
      <text x="600" y="180" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">缝在变宽</text>
      <text x="600" y="260" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#1F4E79">−80%</text>
      <text x="600" y="320" font-family="Noto Sans SC" font-size="25" fill="#55534E">日照港人力成本压降</text>
      <text x="600" y="364" font-family="Noto Sans SC" font-size="25" fill="#55534E">别人变了，你没变</text>
    </g>

    <!-- 三 时机 -->
    <g>
      <text x="1160" y="110" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">III</text>
      <text x="1160" y="180" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">时机成熟</text>
      <text x="1160" y="260" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#1F4E79">100 + 装备下水</text>
      <text x="1160" y="320" font-family="Noto Sans SC" font-size="25" fill="#55534E">山东遴选 100 个行业大模型</text>
      <text x="1160" y="364" font-family="Noto Sans SC" font-size="25" fill="#55534E">政策与装备两头撞上</text>
    </g>

    <line x1="0" y1="470" x2="1660" y2="470" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="525" font-family="Noto Sans SC" font-size="27" fill="#55534E">三组事实，回答同一个问题——<tspan font-weight="500" fill="#1F4E79">「凭什么偏偏是现在」</tspan>。</text>
  </svg>

  <p class="foot">上一块的问题是「凭什么偏偏是现在」——答案就藏在这<b>三个事实</b>里。</p>
</body>
</html>
