<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P11 · 人的退场</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">人的退场</p>

  <svg class="figure" width="1660" height="580" viewBox="0 0 1660 580" fill="none">
    <!-- 三步后退 -->
    <!-- 步1：人在现场 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">STEP 01 · 信息化</text>
    <rect x="20" y="70" width="460" height="180" rx="4" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <circle cx="130" cy="160" r="30" stroke="#101010" stroke-width="2.5" fill="none"/>
    <line x1="130" y1="190" x2="130" y2="230" stroke="#101010" stroke-width="2.5"/>
    <text x="200" y="150" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">人还在现场</text>
    <text x="200" y="192" font-family="Noto Sans SC" font-size="22" fill="#55534E">只是记录方式变了：</text>
    <text x="200" y="226" font-family="Noto Sans SC" font-size="22" fill="#9B998F">纸上 → 系统里</text>

    <line x1="520" y1="160" x2="580" y2="160" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M592 160 L 574 150 L 574 170 Z" fill="#B9B7AF"/>

    <!-- 步2：人看着系统判断 -->
    <text x="640" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">STEP 02 · 数字化</text>
    <rect x="620" y="70" width="460" height="180" rx="4" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <circle cx="700" cy="160" r="26" stroke="#101010" stroke-width="2.5" fill="none"/>
    <text x="762" y="150" font-family="Noto Sans SC" font-size="21" fill="#9B998F">人</text>
    <rect x="810" y="120" width="210" height="80" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="915" y="170" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="26" fill="#141414">系统</text>
    <text x="700" y="232" font-family="Noto Sans SC" font-size="22" fill="#9B998F">从「自己判断」到「看系统判断」</text>

    <line x1="1120" y1="160" x2="1180" y2="160" stroke="#1F4E79" stroke-width="3"/>
    <path d="M1192 160 L 1172 150 L 1172 170 Z" fill="#1F4E79"/>

    <!-- 步3：人退出现场 -->
    <text x="1240" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">STEP 03 · 智能化</text>
    <rect x="1220" y="70" width="400" height="180" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <circle cx="1300" cy="160" r="26" stroke="#C9C7C0" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
    <line x1="1252" y1="112" x2="1348" y2="208" stroke="#C9C7C0" stroke-width="2.5"/>
    <text x="1360" y="145" font-family="Noto Sans SC" font-size="22" fill="#9B998F">人</text>
    <text x="1260" y="232" font-family="Noto Sans SC" font-size="22" fill="#55534E">码头堆场空了，网箱上没人了</text>

    <!-- 总结线 -->
    <line x1="0" y1="330" x2="1660" y2="330" stroke="#E8E6E1" stroke-width="1"/>

    <text x="0" y="420" font-family="Noto Serif SC" font-weight="600" font-size="38" fill="#141414">每跨一步，<tspan fill="#1F4E79">人的位置就往后退一步</tspan></text>

    <!-- 悬置的问题 -->
    <rect x="0" y="470" width="1660" height="100" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="50" y="535" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">人从现场退出去之后，他的位置，退到哪一步算到头？</text>
  </svg>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
