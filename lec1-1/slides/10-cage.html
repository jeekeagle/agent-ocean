<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P10 · 智能网箱</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 66px 130px 0; }
  .foot { margin: 34px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">智能网箱</p>

  <svg class="figure" width="1660" height="520" viewBox="0 0 1660 520" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">经海系列 · 深远海智能网箱</text>

    <!-- 网箱俯视示意 -->
    <rect x="60" y="90" width="330" height="330" stroke="#101010" stroke-width="2.5" fill="none"/>
    <g stroke="#E8E6E1" stroke-width="1.5">
      <line x1="60" y1="172" x2="390" y2="172"/><line x1="60" y1="255" x2="390" y2="255"/><line x1="60" y1="337" x2="390" y2="337"/>
      <line x1="142" y1="90" x2="142" y2="420"/><line x1="225" y1="90" x2="225" y2="420"/><line x1="307" y1="90" x2="307" y2="420"/>
    </g>
    <!-- 鱼点 -->
    <g fill="#1F4E79">
      <circle cx="100" cy="130" r="6"/><circle cx="260" cy="150" r="6"/><circle cx="180" cy="215" r="6"/>
      <circle cx="330" cy="290" r="6"/><circle cx="120" cy="310" r="6"/><circle cx="230" cy="370" r="6"/>
    </g>
    <text x="225" y="470" text-anchor="middle" font-family="JetBrains Mono" font-size="20" fill="#9B998F">68 m × 68 m</text>

    <!-- 三个数字 -->
    <g>
      <text x="520" y="140" font-family="JetBrains Mono" font-size="88" font-weight="500" fill="#141414">9.4<tspan font-size="34" fill="#9B998F"> 万 m³</tspan></text>
      <text x="920" y="140" font-family="Noto Sans SC" font-size="24" fill="#55534E">水体</text>
      <text x="520" y="290" font-family="JetBrains Mono" font-size="88" font-weight="500" fill="#141414">100<tspan font-size="34" fill="#9B998F"> 万尾</tspan></text>
      <text x="880" y="290" font-family="Noto Sans SC" font-size="24" fill="#55534E">黑鱼</text>
      <text x="520" y="440" font-family="JetBrains Mono" font-size="88" font-weight="500" fill="#1F4E79">2<tspan font-size="34" fill="#9B998F"> 人</tspan></text>
      <text x="640" y="440" font-family="Noto Sans SC" font-size="24" fill="#1F4E79">日常管理</text>
    </g>
    <line x1="1080" y1="80" x2="1080" y2="470" stroke="#E8E6E1" stroke-width="1"/>
    <text x="1150" y="200" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">一百多万尾鱼，</text>
    <text x="1150" y="256" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">九万多方水体，</text>
    <text x="1150" y="312" font-family="Noto Serif SC" font-weight="700" font-size="40" fill="#1F4E79">两个人。</text>
  </svg>

  <p class="foot">养殖场还是那个养殖场——<b>看养殖场的人，从两百个变成了两个</b>。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
