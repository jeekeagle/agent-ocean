<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P04 · 信息化</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 36px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">信息化</p>

  <svg class="figure" width="1660" height="540" viewBox="0 0 1660 540" fill="none">
    <!-- 左：解放信息 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">FROM PAPER TO DATA</text>
    <!-- 纸质货单：三部门 -->
    <rect x="20" y="80" width="200" height="120" rx="2" stroke="#B9B7AF" stroke-width="2" fill="none" transform="rotate(-3 120 140)"/>
    <text x="120" y="130" text-anchor="middle" font-family="Noto Sans SC" font-size="22" fill="#9B998F">货单</text>
    <text x="120" y="166" text-anchor="middle" font-family="Noto Sans SC" font-size="19" fill="#C9C7C0">跑三个部门盖章</text>
    <line x1="60" y1="105" x2="180" y2="175" stroke="#B9B7AF" stroke-width="2"/>

    <line x1="260" y1="140" x2="350" y2="140" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M362 140 L 344 130 L 344 150 Z" fill="#B9B7AF"/>

    <!-- 系统 -->
    <rect x="400" y="70" width="320" height="140" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="560" y="130" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">系统里点一下</text>
    <text x="560" y="174" text-anchor="middle" font-family="JetBrains Mono" font-size="20" fill="#1F4E79">→ 到达</text>

    <!-- AIS -->
    <text x="0" y="320" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">AIS ON SCREEN</text>
    <rect x="20" y="360" width="700" height="130" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <!-- 小船 -->
    <path d="M80 440 L 150 440 L 135 465 L 95 465 Z" fill="#1F4E79"/>
    <line x1="115" y1="440" x2="115" y2="410" stroke="#1F4E79" stroke-width="3"/>
    <g font-family="JetBrains Mono" font-size="21" fill="#55534E">
      <text x="200" y="405">位置 · 经纬度</text>
      <text x="200" y="450">航向 · 速度</text>
      <text x="460" y="428" fill="#9B998F">—— 船老大的经验，搬上了屏幕</text>
    </g>

    <!-- 右：边界 -->
    <line x1="810" y1="60" x2="810" y2="500" stroke="#E8E6E1" stroke-width="1"/>
    <text x="880" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE BOUNDARY</text>
    <text x="880" y="120" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">只负责让信息流动，</text>
    <text x="880" y="176" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">不负责替你判断。</text>
    <rect x="880" y="240" width="700" height="180" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="920" y="310" font-family="Noto Sans SC" font-size="25" fill="#55534E">屏幕上有一条船的位置，</text>
    <text x="920" y="356" font-family="Noto Sans SC" font-size="25" fill="#55534E">该不该靠这个泊位、什么时候靠，</text>
    <text x="920" y="402" font-family="Noto Sans SC" font-size="25" fill="#55534E"><tspan font-weight="500" fill="#141414">还是得人来定。</tspan></text>
  </svg>

  <p class="foot">一句话：<b>存得住，传得远</b>——把「信息」从纸里和脑子里解放出来。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
