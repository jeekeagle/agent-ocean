<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P08 · 海洋三阶段</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">海洋三阶段</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <!-- 阶段一：点状 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">STAGE 01 · 信息化 = 点状建设</text>
    <g>
      <circle cx="90" cy="120" r="12" fill="#B9B7AF"/>
      <circle cx="290" cy="90" r="12" fill="#B9B7AF"/>
      <circle cx="480" cy="140" r="12" fill="#B9B7AF"/>
      <circle cx="180" cy="210" r="12" fill="#B9B7AF"/>
      <circle cx="390" cy="230" r="12" fill="#B9B7AF"/>
      <text x="90" y="165" text-anchor="middle" font-family="Noto Sans SC" font-size="20" fill="#9B998F">AIS</text>
      <text x="290" y="65" text-anchor="middle" font-family="Noto Sans SC" font-size="20" fill="#9B998F">观测站</text>
      <text x="480" y="185" text-anchor="middle" font-family="Noto Sans SC" font-size="20" fill="#9B998F">监控</text>
      <text x="0" y="290" font-family="Noto Sans SC" font-size="23" fill="#55534E">各家搭各自的系统——<tspan font-weight="500" fill="#141414">数据躺在自己系统里</tspan></text>
      <text x="0" y="330" font-family="Noto Sans SC" font-size="23" fill="#9B998F">要一份跨部门海况数据：打电话、发函、等三天</text>
    </g>

    <line x1="600" y1="60" x2="600" y2="520" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 阶段二：从点到网 -->
    <text x="670" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">STAGE 02 · 数字化 = 从点到网</text>
    <g>
      <!-- 网 -->
      <g stroke="#1F4E79" stroke-width="2">
        <line x1="710" y1="110" x2="850" y2="80"/>
        <line x1="850" y1="80" x2="990" y2="130"/>
        <line x1="710" y1="110" x2="770" y2="210"/>
        <line x1="990" y1="130" x2="1050" y2="220"/>
        <line x1="770" y1="210" x2="910" y2="240"/>
        <line x1="910" y1="240" x2="1050" y2="220"/>
        <line x1="850" y1="80" x2="910" y2="240"/>
      </g>
      <g fill="#1F4E79">
        <circle cx="710" cy="110" r="10"/><circle cx="850" cy="80" r="10"/><circle cx="990" cy="130" r="10"/>
        <circle cx="770" cy="210" r="10"/><circle cx="910" cy="240" r="10"/><circle cx="1050" cy="220" r="10"/>
      </g>
      <text x="670" y="290" font-family="Noto Sans SC" font-size="23" fill="#55534E">智慧海洋牧场物联网平台（5G+物联网），</text>
      <text x="670" y="330" font-family="Noto Sans SC" font-size="23" fill="#55534E"><tspan font-weight="500" fill="#141414">九仙云</tspan>管住鱼苗到起捕全链条；</text>
      <text x="670" y="370" font-family="Noto Sans SC" font-size="23" fill="#55534E">浮标集感知传输分析预警于一身，抗 <tspan font-weight="500" fill="#1F4E79">12 级</tspan>风浪</text>
    </g>

    <line x1="1170" y1="60" x2="1170" y2="520" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 阶段三：两类进场 -->
    <text x="1240" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">STAGE 03 · 智能化 = 两类进场</text>
    <g>
      <!-- 脑 -->
      <rect x="1240" y="70" width="180" height="130" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="1330" y="130" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">脑子</text>
      <text x="1330" y="172" text-anchor="middle" font-family="Noto Sans SC" font-size="20" fill="#9B998F">垂类大模型</text>
      <!-- 身体 -->
      <rect x="1450" y="70" width="180" height="130" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="1540" y="130" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">身体</text>
      <text x="1540" y="172" text-anchor="middle" font-family="Noto Sans SC" font-size="20" fill="#9B998F">具身智能装备</text>
      <text x="1240" y="290" font-family="Noto Sans SC" font-size="23" fill="#55534E"><tspan font-weight="500" fill="#141414">脑子和身体</tspan>，</text>
      <text x="1240" y="330" font-family="Noto Sans SC" font-size="23" fill="#55534E">第一次同时出现在海上</text>
      <text x="1240" y="390" font-family="Noto Sans SC" font-size="22" fill="#9B998F">—— 下两页看两个例子</text>
    </g>

    <!-- 底部横线总结 -->
    <line x1="0" y1="450" x2="1660" y2="450" stroke="#E8E6E1" stroke-width="1"/>
    <text x="0" y="515" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">点 → 网 → 脑 + 身：这不是升级，是<tspan fill="#1F4E79">换物种</tspan></text>
  </svg>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
