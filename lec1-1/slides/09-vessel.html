<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P09 · 养殖工船</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 66px 130px 0; }
  .foot { margin: 36px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">养殖工船</p>

  <svg class="figure" width="1660" height="520" viewBox="0 0 1660 520" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">国信 1 号 · 全首艘深海封闭式养殖工船</text>

    <!-- 船体示意 -->
    <path d="M60 200 L 900 200 L 830 300 L 130 300 Z" stroke="#101010" stroke-width="2.5" fill="none"/>
    <rect x="330" y="140" width="180" height="60" stroke="#101010" stroke-width="2" fill="none"/>
    <line x1="150" y1="330" x2="810" y2="330" stroke="#D8D6D0" stroke-width="2.5"/>
    <path d="M150 345 Q 200 333 250 345 T 350 345 T 450 345 T 550 345 T 650 345 T 750 345" stroke="#D8D6D0" stroke-width="2" fill="none"/>

    <!-- 参数 -->
    <g>
      <text x="1000" y="120" font-family="JetBrains Mono" font-size="72" font-weight="500" fill="#141414">244.9<tspan font-size="30" fill="#9B998F"> m</tspan></text>
      <text x="1330" y="120" font-family="Noto Sans SC" font-size="24" fill="#55534E">全长</text>
      <text x="1000" y="230" font-family="JetBrains Mono" font-size="72" font-weight="500" fill="#141414">15<tspan font-size="30" fill="#9B998F"> 万吨</tspan></text>
      <text x="1230" y="230" font-family="Noto Sans SC" font-size="24" fill="#55534E">排水量</text>
      <text x="1000" y="340" font-family="JetBrains Mono" font-size="72" font-weight="500" fill="#1F4E79">10<tspan font-size="30" fill="#9B998F"> 万 m³</tspan></text>
      <text x="1250" y="340" font-family="Noto Sans SC" font-size="24" fill="#55534E">养殖水体</text>
    </g>

    <!-- 关键差异 -->
    <line x1="0" y1="400" x2="1660" y2="400" stroke="#E8E6E1" stroke-width="1"/>
    <text x="0" y="462" font-family="Noto Sans SC" font-size="26" fill="#55534E">它最厉害的不是大，是<tspan font-weight="500" fill="#141414">长了腿</tspan>——看着水温和环境变化，<tspan font-weight="500" fill="#1F4E79">自己从一个锚地开到另一个锚地</tspan></text>
    <text x="0" y="510" font-family="Noto Sans SC" font-size="24" fill="#9B998F">过去：鱼在哪，你奔哪去。现在：哪适合鱼，船自己开过去。</text>
  </svg>

  <p class="foot">装备不再是「被部署在海上」，而是<b>自己决定在海上的哪里</b>。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
