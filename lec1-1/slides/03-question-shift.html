  <div class="cols">

      <p class="q">怎么把货<em>装得更快</em>、<br>摆得更齐、不出差错？</p>
      <p class="note">一道确定性的工程题——答案写在流程和人的手艺里。</p>

      <p class="q">怎么让这套系统<em>自己判断</em>、<br>自己调度、自己不出错？</p>
      <p class="note">一道不确定性的决策题——答案只能交给智能。</p>
    </div>
  </div>
