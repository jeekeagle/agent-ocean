<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 青岛港之问</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 76px 130px 0; }
  .foot { margin: 44px 130px 0; font-size: 26px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 22px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">青岛港之问</p>

  <svg class="figure" width="1660" height="520" viewBox="0 0 1660 520" fill="none">
    <!-- 起点 2013 -->
    <text x="0" y="34" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">2013 · START</text>
    <rect x="0" y="70" width="500" height="200" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="46" y="130" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">没有图纸，没有资料，没有外援</text>
    <text x="46" y="188" font-family="Noto Sans SC" font-size="23" fill="#55534E">前十大集装箱港口中国占七席，</text>
    <text x="46" y="228" font-family="Noto Sans SC" font-size="23" fill="#55534E">七席里没有一座自动化码头。</text>

    <!-- 箭头 -->
    <line x1="530" y1="170" x2="650" y2="170" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M662 170 L 644 160 L 644 180 Z" fill="#B9B7AF"/>
    <text x="596" y="140" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">十余年</text>

    <!-- 成绩单 -->
    <text x="700" y="34" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">TODAY · ANSWER</text>
    <g>
      <!-- 13次 -->
      <text x="700" y="200" font-family="JetBrains Mono" font-size="118" font-weight="500" fill="#1F4E79">13</text>
      <text x="862" y="152" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">次刷新</text>
      <text x="862" y="196" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">世界纪录</text>

      <!-- 62.62 -->
      <text x="1010" y="200" font-family="JetBrains Mono" font-size="118" font-weight="500" fill="#141414">62.62</text>
      <text x="1400" y="152" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">自然箱/小时</text>
      <text x="1400" y="196" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">桥吊单机效率</text>

      <!-- 七成 -->
      <text x="700" y="380" font-family="JetBrains Mono" font-size="118" font-weight="500" fill="#141414">70<tspan font-size="64">%</tspan></text>
      <text x="900" y="332" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">人力节省</text>
      <text x="900" y="376" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#141414">堆场不再有人声</text>

      <!-- 场景句 -->
      <text x="1230" y="330" font-family="Noto Sans SC" font-size="24" fill="#55534E">自动化设备的轻微嗡鸣，</text>
      <text x="1230" y="372" font-family="Noto Sans SC" font-size="24" fill="#55534E">和海浪拍岸的声音。</text>
    </g>
  </svg>

  <p class="foot">十几年里，<b>变的不是设备，是问题本身</b>——这，就是今天的起点。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
