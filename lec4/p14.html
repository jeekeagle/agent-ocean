<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鱼探仪案例解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>鱼探仪案例解析</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <line x1="564" y1="40" x2="564" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <line x1="1156" y1="40" x2="1156" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <!-- col 1 -->
      <text x="0" y="60" class="m" font-size="24" fill="#AAA">M2</text>
      <text x="0" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">约束定位</text>
      <text x="0" y="220" font-size="26" fill="#555">传统网箱：鱼在水下</text>
      <text x="0" y="270" font-size="26" fill="#555">有多少 · 多大 · 长势如何</text>
      <text x="0" y="320" font-size="26" fill="#555">全靠经验估算</text>
      <line x1="0" y1="380" x2="500" y2="380" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="460" font-size="28" font-weight="700" fill="#1F4E79">生物资产不透明</text>
      <text x="0" y="520" font-size="26" fill="#777">看不见 → 没法管理</text>
      <text x="0" y="570" font-size="26" fill="#777">这是认知约束</text>
      <!-- col 2 -->
      <text x="620" y="60" class="m" font-size="24" fill="#AAA">M3</text>
      <text x="620" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">秩的变化</text>
      <text x="620" y="220" font-size="26" fill="#555">感知</text>
      <line x1="740" y1="200" x2="740" y2="270" stroke="#1F4E79" stroke-width="4"/>
      <polygon points="733,270 747,270 740,284" fill="#1F4E79"/>
      <text x="790" y="240" font-size="28" font-weight="700" fill="#1F4E79">已降</text>
      <text x="620" y="350" font-size="26" fill="#555">判断</text>
      <text x="740" y="350" font-size="28" fill="#888">＝ 未变</text>
      <text x="620" y="440" font-size="26" fill="#555">执行</text>
      <text x="740" y="440" font-size="28" fill="#888">＝ 未变</text>
      <line x1="620" y1="500" x2="1120" y2="500" stroke="#E5E5E5" stroke-width="2"/>
      <text x="620" y="570" font-size="26" fill="#555">投饵 · 捕捞 · 分箱</text>
      <text x="620" y="616" font-size="26" fill="#555">仍由人决定</text>
      <text x="620" y="700" font-size="24" fill="#999">判断权没有交出去</text>
      <!-- col 3 -->
      <text x="1212" y="60" class="m" font-size="24" fill="#AAA">M1</text>
      <text x="1212" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">范式判定</text>
      <text x="1212" y="220" font-size="26" fill="#777">数字化：采上数据给人看</text>
      <line x1="1212" y1="280" x2="1728" y2="280" stroke="#E5E5E5" stroke-width="2"/>
      <text x="1212" y="360" font-size="26" fill="#555">智能化：模型直接给</text>
      <text x="1212" y="406" font-size="26" fill="#555">结构化判断结果</text>
      <text x="1212" y="490" font-size="28" font-weight="700" fill="#1F4E79">差别在于谁在算</text>
      <line x1="1212" y1="560" x2="1728" y2="560" stroke="#E5E5E5" stroke-width="2"/>
      <text x="1212" y="640" font-size="26" fill="#777">市场 · 资金 · 风险偏好</text>
      <text x="1212" y="686" font-size="26" fill="#777">不在水里，在人的脑子里</text>
      <text x="1212" y="740" font-size="24" fill="#999">这些变量模型够不着</text>
    </svg>
  </div>
</div>
</body>
</html>
