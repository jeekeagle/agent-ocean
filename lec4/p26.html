<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开放问题</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>开放问题</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- ladder: ascending left to right -->
      <rect x="0" y="520" width="520" height="220" fill="#F1F3F5"/>
      <text x="40" y="600" font-size="30" font-weight="700" fill="#555" font-family="Noto Serif SC,SimSun,serif">迁移尚未开始</text>
      <text x="40" y="660" font-size="28" fill="#777">人还得下水</text>
      <rect x="604" y="360" width="520" height="220" fill="#C9D6E4"/>
      <text x="644" y="440" font-size="30" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">迁移走到一半</text>
      <text x="644" y="500" font-size="28" fill="#33506B">人还守在现场</text>
      <rect x="1208" y="200" width="520" height="220" fill="#1F4E79"/>
      <text x="1248" y="280" font-size="30" font-weight="700" fill="#fff" font-family="Noto Serif SC,SimSun,serif">迁移已经完成</text>
      <text x="1248" y="340" font-size="28" fill="#CBD8E6">人退到了后方</text>
      <!-- ascending guide -->
      <line x1="0" y1="500" x2="1180" y2="190" stroke="#EDEDED" stroke-width="2" stroke-dasharray="8 8"/>
      <!-- question -->
      <text x="0" y="80" font-size="40" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">你的岗位在哪一档？</text>
      <text x="0" y="140" font-size="28" fill="#555">下一步该迁走的，是感知、判断、还是执行环节的约束？</text>
    </svg>
  </div>
</div>
</body>
</html>
