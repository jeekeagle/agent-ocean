<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>清洗装备成绩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>清洗装备成绩</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- four stats -->
      <line x1="0" y1="40" x2="1728" y2="40" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="160" class="m" font-size="64" font-weight="700" fill="#1F4E79">5–8×</text>
      <text x="0" y="222" font-size="28" fill="#1A1A1A">对人工的清洗效率</text>
      <text x="440" y="160" class="m" font-size="64" font-weight="700" fill="#1F4E79">95%+</text>
      <text x="440" y="222" font-size="28" fill="#1A1A1A">深远海网箱清洗市场份额</text>
      <text x="950" y="160" font-size="56" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">唯一</text>
      <text x="950" y="222" font-size="28" fill="#1A1A1A">国内产业化应用的清洗机器人</text>
      <text x="1400" y="160" class="m" font-size="64" font-weight="700" fill="#1F4E79">&lt; ½</text>
      <text x="1400" y="222" font-size="28" fill="#1A1A1A">对比进口设备价格</text>
      <text x="1400" y="264" font-size="24" fill="#777">进口 300–400 万 / 台</text>
      <line x1="0" y1="330" x2="1728" y2="330" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="410" font-size="26" fill="#555">2026 年前 4 个月订单超 2025 年全年 · 成功打开新加坡市场 · 打破国外垄断</text>
      <!-- extension -->
      <line x1="0" y1="480" x2="1728" y2="480" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="570" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">延伸：从深海网箱到船舶船底</text>
      <text x="0" y="640" font-size="28" fill="#1A1A1A">「Updex 智洁星」水下除污机器人 · 中远海运（青岛）</text>
      <text x="0" y="700" font-size="26" fill="#555">水下视觉识别 · 惯性导航 · 自适应路径规划算法</text>
      <text x="0" y="748" font-size="26" fill="#555">强磁吸附 + 推进器浮游移动复合技术 · 复杂流场稳定贴附船体</text>
      <text x="0" y="810" class="m" font-size="28" font-weight="700" fill="#1F4E79">船体覆盖面积 &gt; 90%</text>
    </svg>
  </div>
</div>
</body>
</html>
