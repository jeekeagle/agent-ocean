<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>港口案例解析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>港口案例解析</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <line x1="564" y1="40" x2="564" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <line x1="1156" y1="40" x2="1156" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <!-- col 1 -->
      <text x="0" y="60" class="m" font-size="24" fill="#AAA">M1</text>
      <text x="0" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">范式转换</text>
      <rect x="0" y="180" width="500" height="110" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="250" y="246" font-size="26" fill="#777" text-anchor="middle">调度员经验排班 · 人脑算</text>
      <line x1="250" y1="300" x2="250" y2="370" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="243,370 257,370 250,384" fill="#1F4E79"/>
      <rect x="0" y="400" width="500" height="110" fill="none" stroke="#1F4E79" stroke-width="3"/>
      <text x="250" y="466" font-size="26" fill="#1F4E79" font-weight="700" text-anchor="middle">模型耦合 船 · 箱 · 车 · 场 · 人</text>
      <text x="0" y="590" font-size="26" fill="#777">不是把老办法做快了</text>
      <text x="0" y="634" font-size="26" fill="#777">是换了一套办法</text>
      <text x="0" y="720" font-size="24" fill="#999">信息化 — 数字化 — 智能化</text>
      <text x="0" y="760" font-size="24" fill="#999">三种异质范式</text>
      <!-- col 2 -->
      <text x="620" y="60" class="m" font-size="24" fill="#AAA">M2</text>
      <text x="620" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">约束可预测</text>
      <path d="M 620 260 Q 683 200 746 260 T 872 260 T 998 260 T 1124 260" fill="none" stroke="#1F4E79" stroke-width="4"/>
      <text x="620" y="200" font-size="26" fill="#555">潮汐有表 · 船期有预报</text>
      <line x1="872" y1="310" x2="872" y2="380" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="865,380 879,380 872,394" fill="#1F4E79"/>
      <text x="620" y="450" font-size="28" font-weight="700" fill="#1F4E79">可建模 · 可优化</text>
      <text x="620" y="590" font-size="26" fill="#777">约束可预测</text>
      <text x="620" y="634" font-size="26" fill="#777">迁移难度就低</text>
      <!-- col 3 -->
      <text x="1212" y="60" class="m" font-size="24" fill="#AAA">M3</text>
      <text x="1212" y="118" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">两条技术线</text>
      <text x="1212" y="220" font-size="26" fill="#555">AI 线 · 调度算法</text>
      <text x="1212" y="266" font-size="28" font-weight="700" fill="#1F4E79">降判断的秩</text>
      <text x="1212" y="370" font-size="26" fill="#555">具身线 · AGV / 轨道吊 / 自动系泊</text>
      <text x="1212" y="416" font-size="28" font-weight="700" fill="#1F4E79">降行动的秩</text>
      <line x1="1470" y1="450" x2="1470" y2="520" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="1463,520 1477,520 1470,534" fill="#1F4E79"/>
      <rect x="1212" y="556" width="516" height="90" fill="none" stroke="#1F4E79" stroke-width="3"/>
      <text x="1470" y="612" font-size="28" font-weight="700" fill="#1F4E79" text-anchor="middle">合起来才是替代</text>
      <text x="1212" y="720" font-size="24" fill="#999">单有 AI 是参谋 · 单有具身是工具</text>
      <text x="1212" y="760" font-size="24" fill="#999">两条线都到位 · 完整回路</text>
    </svg>
  </div>
</div>
</body>
</html>
