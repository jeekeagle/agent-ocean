<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>渔业双案例</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>渔业双案例</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <text x="0" y="50" font-size="28" fill="#777">海洋产业的主体状态：不是没做，是做了一半</text>
      <!-- pipeline headers -->
      <text x="270" y="150" font-size="34" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">感知</text>
      <text x="864" y="150" font-size="34" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">判断</text>
      <text x="1458" y="150" font-size="34" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">执行</text>
      <!-- case A -->
      <text x="0" y="270" font-size="30" font-weight="700" fill="#1A1A1A" font-family="Noto Serif SC,SimSun,serif">知鱼 M3 鱼探仪</text>
      <rect x="0" y="300" width="540" height="96" fill="#1F4E79"/>
      <text x="270" y="360" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="594" y="300" width="540" height="96" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="864" y="360" font-size="28" fill="#888" text-anchor="middle">未交出 · 人定</text>
      <rect x="1188" y="300" width="540" height="96" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="1458" y="360" font-size="28" fill="#888" text-anchor="middle">未交出 · 人定</text>
      <!-- case B -->
      <text x="0" y="500" font-size="30" font-weight="700" fill="#1A1A1A" font-family="Noto Serif SC,SimSun,serif">叮咚渔医平台</text>
      <rect x="0" y="530" width="540" height="96" fill="#1F4E79"/>
      <text x="270" y="590" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="594" y="530" width="540" height="96" fill="#1F4E79"/>
      <text x="864" y="590" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="1188" y="530" width="540" height="96" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="1458" y="590" font-size="28" fill="#888" text-anchor="middle">未交出 · 人拍板</text>
      <!-- note -->
      <line x1="0" y1="700" x2="1728" y2="700" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="770" font-size="28" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">同一领域内部，环节迁移程度可以差很多</text>
      <text x="0" y="820" font-size="26" fill="#777">走了一半的两种形态：感知交了、判断没交 —— 判断交了、执行没交</text>
    </svg>
  </div>
</div>
</body>
</html>
