<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水下清洗机器人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>水下清洗机器人</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- cage mesh -->
      <g stroke="#DCE1E6" stroke-width="2">
        <line x1="60" y1="120" x2="820" y2="120"/><line x1="60" y1="230" x2="820" y2="230"/>
        <line x1="60" y1="340" x2="820" y2="340"/><line x1="60" y1="450" x2="820" y2="450"/>
        <line x1="60" y1="560" x2="820" y2="560"/><line x1="60" y1="670" x2="820" y2="670"/>
        <line x1="160" y1="120" x2="160" y2="670"/><line x1="260" y1="120" x2="260" y2="670"/>
        <line x1="360" y1="120" x2="360" y2="670"/><line x1="460" y1="120" x2="460" y2="670"/>
        <line x1="560" y1="120" x2="560" y2="670"/><line x1="660" y1="120" x2="660" y2="670"/>
        <line x1="760" y1="120" x2="760" y2="670"/>
      </g>
      <!-- fouling -->
      <g fill="#B9C2CC">
        <circle cx="160" cy="230" r="14"/><circle cx="260" cy="340" r="16"/><circle cx="120" cy="450" r="12"/>
        <circle cx="360" cy="120" r="13"/><circle cx="220" cy="560" r="15"/><circle cx="460" cy="230" r="12"/>
        <circle cx="80" cy="340" r="13"/><circle cx="300" cy="120" r="11"/><circle cx="400" cy="560" r="14"/>
        <circle cx="120" cy="670" r="12"/><circle cx="560" cy="120" r="12"/><circle cx="660" cy="230" r="13"/>
      </g>
      <text x="60" y="80" font-size="26" fill="#777">网衣附着：藻类 · 藤壶 — 如同血管长了「斑块」</text>
      <!-- robot -->
      <rect x="330" y="330" width="260" height="120" fill="#fff" stroke="#1F4E79" stroke-width="4"/>
      <rect x="300" y="360" width="30" height="60" fill="#1F4E79"/>
      <rect x="590" y="360" width="30" height="60" fill="#1F4E79"/>
      <circle cx="460" cy="530" r="72" fill="none" stroke="#1F4E79" stroke-width="5"/>
      <circle cx="460" cy="530" r="24" fill="#1F4E79"/>
      <path d="M 460 470 A 90 90 0 0 1 555 510" fill="none" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="555,502 566,516 548,520" fill="#1F4E79"/>
      <text x="640" y="360" font-size="26" fill="#555">清洗盘高速旋转</text>
      <text x="640" y="404" font-size="26" fill="#555">空化水射流剥离附着物</text>
      <text x="640" y="448" font-size="26" fill="#555">不伤网衣 · 不伤油漆</text>
      <text x="640" y="560" font-size="26" font-weight="700" fill="#1F4E79">ROV 全运动控制 · 一键贴网</text>
      <text x="60" y="760" font-size="26" fill="#777">第五代产品 · 形似扫地机器人 · 内外网均可清洗</text>
      <!-- right panel -->
      <line x1="900" y1="20" x2="900" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="100" font-size="34" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">青岛森科特智能仪器</text>
      <text x="960" y="152" font-size="26" fill="#777">2019 年从海洋牧场观测网起步 · 五年攻克核心技术</text>
      <line x1="960" y1="210" x2="1728" y2="210" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="290" font-size="28" fill="#1A1A1A">传统方式：人工潜水清洗</text>
      <text x="960" y="340" font-size="26" fill="#777">效率低 · 作业危险 · 深海网箱清洗卡脖子</text>
      <line x1="960" y1="400" x2="1728" y2="400" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="480" font-size="28" fill="#1A1A1A">约束清单：高压 · 浑浊 · 有流 · 看不见</text>
      <line x1="960" y1="540" x2="1728" y2="540" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="630" font-size="30" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">约束没有被消除</text>
      <text x="960" y="686" font-size="30" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">只是换了承受者</text>
    </svg>
  </div>
</div>
</body>
</html>
