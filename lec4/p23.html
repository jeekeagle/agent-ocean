<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>问海大模型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>问海大模型</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <text x="0" y="50" font-size="26" fill="#777">崂山实验室 · 中国海洋大学 · 中国科学技术大学 · 青岛国实科技集团 联合研发</text>
      <!-- left: paradigm -->
      <text x="0" y="150" font-size="26" fill="#777">传统数值预报</text>
      <text x="0" y="200" font-size="28" fill="#555">求解物理方程 · 算一次要数天</text>
      <line x1="60" y1="240" x2="60" y2="320" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="53,320 67,320 60,334" fill="#1F4E79"/>
      <text x="0" y="400" font-size="26" fill="#1F4E79" font-weight="700">「问海」路径</text>
      <text x="0" y="452" font-size="28" fill="#1A1A1A">块体公式显式嵌入神经网络</text>
      <text x="0" y="500" font-size="28" fill="#1A1A1A">海陆分布掩码 · 地形岸界感知</text>
      <text x="0" y="560" font-size="26" fill="#777">表征海气相互作用 · 温度 / 盐度 / 流速 / 海平面高度</text>
      <text x="0" y="650" font-size="30" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">换了一套办法，不是算得更快</text>
      <!-- right: stats -->
      <line x1="880" y1="20" x2="880" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="120" class="m" font-size="64" font-weight="700" fill="#1F4E79">90 秒</text>
      <text x="1260" y="100" font-size="28" fill="#1A1A1A">完成未来 15 天</text>
      <text x="1260" y="140" font-size="28" fill="#1A1A1A">全球海洋环境预测</text>
      <line x1="960" y1="200" x2="1728" y2="200" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="310" class="m" font-size="64" font-weight="700" fill="#1F4E79">×3000</text>
      <text x="1290" y="290" font-size="28" fill="#1A1A1A">计算效率较传统</text>
      <text x="1290" y="330" font-size="28" fill="#1A1A1A">数值预报提升</text>
      <line x1="960" y1="390" x2="1728" y2="390" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="500" class="m" font-size="64" font-weight="700" fill="#1F4E79">数千倍</text>
      <text x="1330" y="480" font-size="28" fill="#1A1A1A">运算成本降低</text>
      <line x1="960" y1="560" x2="1728" y2="560" stroke="#E5E5E5" stroke-width="2"/>
      <text x="960" y="650" font-size="30" font-weight="700" fill="#1F4E79">多项指标优于 GLO12v4</text>
      <text x="960" y="700" font-size="24" fill="#777">法国麦卡托海洋国际中心数值预报系统</text>
      <text x="960" y="790" font-size="26" fill="#555">已在线实时服务：防灾减灾 · 航行安全 · 应急救援</text>
    </svg>
  </div>
</div>
</body>
</html>
