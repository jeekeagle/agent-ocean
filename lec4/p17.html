<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>渔业进度对照</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>渔业进度对照</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- column headers -->
      <text x="660" y="80" font-size="32" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">感知</text>
      <text x="1100" y="80" font-size="32" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">判断</text>
      <text x="1520" y="80" font-size="32" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">执行</text>
      <line x1="0" y1="120" x2="1728" y2="120" stroke="#E5E5E5" stroke-width="2"/>
      <!-- row A -->
      <text x="0" y="230" font-size="30" font-weight="700" fill="#1A1A1A" font-family="Noto Serif SC,SimSun,serif">知鱼 M3 鱼探仪</text>
      <rect x="440" y="180" width="400" height="120" fill="#1F4E79"/>
      <text x="640" y="250" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="900" y="180" width="400" height="120" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="1100" y="250" font-size="28" fill="#888" text-anchor="middle">未交出</text>
      <rect x="1320" y="180" width="400" height="120" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="1520" y="250" font-size="28" fill="#888" text-anchor="middle">未交出</text>
      <line x1="0" y1="360" x2="1728" y2="360" stroke="#E5E5E5" stroke-width="2"/>
      <!-- row B -->
      <text x="0" y="470" font-size="30" font-weight="700" fill="#1A1A1A" font-family="Noto Serif SC,SimSun,serif">叮咚渔医平台</text>
      <rect x="440" y="420" width="400" height="120" fill="#1F4E79"/>
      <text x="640" y="490" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="900" y="420" width="400" height="120" fill="#1F4E79"/>
      <text x="1100" y="490" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">已交出</text>
      <rect x="1320" y="420" width="400" height="120" fill="none" stroke="#C9C9C9" stroke-width="2"/>
      <text x="1520" y="490" font-size="28" fill="#888" text-anchor="middle">未交出</text>
      <line x1="0" y1="600" x2="1728" y2="600" stroke="#E5E5E5" stroke-width="2"/>
      <!-- bottom -->
      <text x="0" y="690" font-size="26" fill="#777">鱼探仪：降感知的秩，判断还在人手里</text>
      <text x="0" y="736" font-size="26" fill="#777">渔医：降判断的秩，执行还在人手里</text>
    </svg>
  </div>
</div>
</body>
</html>
