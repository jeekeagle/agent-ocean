<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>知鱼 M3 系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>知鱼 M3 系统</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- underwater scene -->
      <path d="M 0 110 Q 90 90 180 110 T 360 110 T 540 110 T 720 110 T 900 110" fill="none" stroke="#C9C9C9" stroke-width="3"/>
      <!-- cage -->
      <g stroke="#AEB8C2" stroke-width="2">
        <rect x="140" y="200" width="600" height="440" fill="none"/>
        <line x1="240" y1="200" x2="240" y2="640"/><line x1="340" y1="200" x2="340" y2="640"/>
        <line x1="440" y1="200" x2="440" y2="640"/><line x1="540" y1="200" x2="540" y2="640"/>
        <line x1="640" y1="200" x2="640" y2="640"/>
        <line x1="140" y1="310" x2="740" y2="310"/><line x1="140" y1="420" x2="740" y2="420"/>
        <line x1="140" y1="530" x2="740" y2="530"/>
      </g>
      <!-- sonar cone -->
      <polygon points="440,150 200,620 680,620" fill="#1F4E79" opacity="0.08"/>
      <!-- device -->
      <rect x="390" y="96" width="100" height="40" fill="#1F4E79"/>
      <text x="520" y="122" font-size="26" fill="#555">水下声呐终端 · 边缘计算单元</text>
      <!-- fish dots -->
      <g fill="#1F4E79">
        <circle cx="300" cy="300" r="7"/><circle cx="380" cy="350" r="7"/><circle cx="460" cy="290" r="7"/>
        <circle cx="540" cy="360" r="7"/><circle cx="340" cy="430" r="7"/><circle cx="430" cy="470" r="7"/>
        <circle cx="520" cy="440" r="7"/><circle cx="600" cy="400" r="7"/><circle cx="390" cy="550" r="7"/>
        <circle cx="480" cy="570" r="7"/><circle cx="570" cy="520" r="7"/><circle cx="260" cy="380" r="7"/>
      </g>
      <text x="140" y="720" font-size="26" fill="#777">多波束声呐 + 5G + AI 算法 · 网箱生物资产实时监测</text>
      <!-- right stats -->
      <line x1="880" y1="20" x2="880" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="70" font-size="24" fill="#888">联通（广东）产业互联网 · 广东智能无人系统研究院</text>
      <text x="940" y="108" font-size="24" fill="#888">广州智研声海 联合研发</text>
      <line x1="940" y1="160" x2="1728" y2="160" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="250" class="m" font-size="52" font-weight="700" fill="#1F4E79">90%</text>
      <text x="1220" y="222" font-size="28" fill="#1A1A1A">计数准确率</text>
      <text x="1220" y="262" font-size="24" fill="#777">金鲳鱼 · 马面鲀 · 典型网箱环境</text>
      <line x1="940" y1="310" x2="1728" y2="310" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="400" class="m" font-size="52" font-weight="700" fill="#1F4E79">−10~15%</text>
      <text x="1330" y="372" font-size="28" fill="#1A1A1A">饲料浪费</text>
      <text x="1330" y="412" font-size="24" fill="#777">精准投喂依据</text>
      <line x1="940" y1="460" x2="1728" y2="460" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="550" class="m" font-size="52" font-weight="700" fill="#1F4E79">20%+</text>
      <text x="1220" y="522" font-size="28" fill="#1A1A1A">潜在损失减少</text>
      <text x="1220" y="562" font-size="24" fill="#777">早期病害预警</text>
      <line x1="940" y1="610" x2="1728" y2="610" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="700" class="m" font-size="44" font-weight="700" fill="#1F4E79">凭证</text>
      <text x="1130" y="672" font-size="28" fill="#1A1A1A">生物资产保险与抵押融资</text>
      <text x="1130" y="712" font-size="24" fill="#777">可信数据支撑</text>
    </svg>
  </div>
</div>
</body>
</html>
