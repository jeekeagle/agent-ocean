<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>渔医成效数据</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>渔医成效数据</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- row 1 -->
      <line x1="0" y1="40" x2="1728" y2="40" stroke="#E5E5E5" stroke-width="2"/>
      <text x="0" y="150" class="m" font-size="64" font-weight="700" fill="#1F4E79">1 分钟</text>
      <text x="0" y="210" font-size="28" fill="#1A1A1A">病害快速诊断</text>
      <text x="0" y="252" font-size="24" fill="#777">准确率 90% · 误诊率 −30%</text>
      <text x="592" y="150" class="m" font-size="64" font-weight="700" fill="#1F4E79">+85%</text>
      <text x="592" y="210" font-size="28" fill="#1A1A1A">诊断效率提升</text>
      <text x="592" y="252" font-size="24" fill="#777">对比传统人工诊断</text>
      <text x="1184" y="150" class="m" font-size="64" font-weight="700" fill="#1F4E79">5 天</text>
      <text x="1184" y="210" font-size="28" fill="#1A1A1A">风险预警提前量</text>
      <text x="1184" y="252" font-size="24" fill="#777">预警准确率 92%</text>
      <line x1="0" y1="320" x2="1728" y2="320" stroke="#E5E5E5" stroke-width="2"/>
      <!-- row 2 -->
      <text x="0" y="440" class="m" font-size="64" font-weight="700" fill="#1F4E79">−15~20%</text>
      <text x="0" y="500" font-size="28" fill="#1A1A1A">综合养殖成本</text>
      <text x="0" y="542" font-size="24" fill="#777">饲料 · 用药 · 人力全链路</text>
      <text x="592" y="440" class="m" font-size="64" font-weight="700" fill="#1F4E79">+18%</text>
      <text x="592" y="500" font-size="28" fill="#1A1A1A">养殖效率提高</text>
      <text x="592" y="542" font-size="24" fill="#777">全流程防控闭环</text>
      <text x="1184" y="440" class="m" font-size="64" font-weight="700" fill="#1F4E79">−20%</text>
      <text x="1184" y="500" font-size="28" fill="#1A1A1A">人工成本下降</text>
      <text x="1184" y="542" font-size="24" fill="#777">诊断环节人力投入</text>
      <line x1="0" y1="610" x2="1728" y2="610" stroke="#E5E5E5" stroke-width="2"/>
      <!-- bottom -->
      <text x="0" y="700" font-size="28" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">落地 20+ 省份</text>
      <text x="0" y="754" font-size="26" fill="#555">长海国家现代农业产业园 · 海水 / 淡水 / 深远海养殖</text>
      <text x="0" y="800" font-size="26" fill="#777">覆盖育苗 — 工厂化育种 — 规模化养殖</text>
    </svg>
  </div>
</div>
</body>
</html>
