<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全要素智能调度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>全要素智能调度</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- pentagon -->
      <g stroke="#C9C9C9" stroke-width="3">
        <line x1="430" y1="400" x2="430" y2="140"/>
        <line x1="430" y1="400" x2="682" y2="320"/>
        <line x1="430" y1="400" x2="586" y2="620"/>
        <line x1="430" y1="400" x2="274" y2="620"/>
        <line x1="430" y1="400" x2="178" y2="320"/>
      </g>
      <circle cx="430" cy="400" r="112" fill="#1F4E79"/>
      <text x="430" y="392" font-size="30" font-weight="700" fill="#fff" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">港口大模型</text>
      <text x="430" y="432" font-size="26" fill="#fff" text-anchor="middle">认知智能体</text>
      <g fill="#fff" stroke="#1F4E79" stroke-width="3">
        <circle cx="430" cy="140" r="62"/>
        <circle cx="682" cy="320" r="62"/>
        <circle cx="586" cy="620" r="62"/>
        <circle cx="274" cy="620" r="62"/>
        <circle cx="178" cy="320" r="62"/>
      </g>
      <g font-size="32" font-weight="700" fill="#1F4E79" text-anchor="middle" font-family="Noto Serif SC,SimSun,serif">
        <text x="430" y="152">船</text>
        <text x="682" y="332">箱</text>
        <text x="586" y="632">车</text>
        <text x="274" y="632">场</text>
        <text x="178" y="332">人</text>
      </g>
      <text x="430" y="770" font-size="26" fill="#777" text-anchor="middle">认知智能体动态耦合分析五类生产要素</text>
      <!-- right panel -->
      <line x1="860" y1="40" x2="860" y2="800" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="110" font-size="34" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">云港通智慧平台</text>
      <text x="940" y="162" font-size="26" fill="#777">服务 2 万余家企业</text>
      <text x="940" y="270" font-size="26" fill="#555">进口提箱业务办理</text>
      <rect x="940" y="296" width="720" height="84" fill="#D9D9D9"/>
      <text x="1628" y="352" class="m" font-size="34" fill="#555" text-anchor="end">4 小时</text>
      <rect x="940" y="420" width="60" height="84" fill="#1F4E79"/>
      <text x="1024" y="476" class="m" font-size="34" font-weight="700" fill="#1F4E79">20 分钟</text>
      <line x1="1710" y1="338" x2="1710" y2="462" stroke="#1F4E79" stroke-width="3"/>
      <polygon points="1703,462 1717,462 1710,476" fill="#1F4E79"/>
      <line x1="940" y1="580" x2="1660" y2="580" stroke="#E5E5E5" stroke-width="2"/>
      <text x="940" y="650" font-size="28" fill="#1A1A1A">全程无纸化提箱 <tspan class="m" font-weight="700" fill="#1F4E79">5 分钟</tspan></text>
      <text x="940" y="720" font-size="26" fill="#777">模型直接调度船、箱、车、场、人</text>
      <text x="940" y="766" font-size="26" fill="#777">替代调度员的经验排班</text>
    </svg>
  </div>
</div>
</body>
</html>
