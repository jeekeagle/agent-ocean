<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海上风电运维</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>海上风电运维</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <text x="0" y="50" font-size="28" fill="#777">国家电投山东 · 山东半岛南部海域 · 覆盖海陆空的 AI 智慧运维系统</text>
      <line x1="0" y1="100" x2="1728" y2="100" stroke="#E5E5E5" stroke-width="2"/>
      <!-- layer 1 -->
      <text x="0" y="200" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">通信</text>
      <text x="240" y="190" font-size="26" fill="#555">风机搭载式海上 5G 基站 · 山东省首个</text>
      <text x="240" y="234" font-size="24" fill="#777">多频段智能追焦天线 · 破解「通信孤岛」</text>
      <text x="1728" y="200" class="m" font-size="36" font-weight="700" fill="#1F4E79" text-anchor="end">30 km → 77 km</text>
      <text x="1728" y="244" font-size="24" fill="#777" text-anchor="end">离岸距离 → 信号延伸</text>
      <line x1="0" y1="300" x2="1728" y2="300" stroke="#E5E5E5" stroke-width="2"/>
      <!-- layer 2 -->
      <text x="0" y="400" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">识别</text>
      <text x="240" y="390" font-size="26" fill="#555">双光谱摄像机 · 上万张素材 · 半年训练大模型</text>
      <text x="240" y="434" font-size="24" fill="#777">全天候智能红外检测</text>
      <text x="1728" y="400" font-size="28" font-weight="700" fill="#1F4E79" text-anchor="end">安全规范识别 · 船只入侵预警</text>
      <text x="1728" y="444" font-size="24" fill="#777" text-anchor="end">安全帽 · 工作服穿戴识别</text>
      <line x1="0" y1="500" x2="1728" y2="500" stroke="#E5E5E5" stroke-width="2"/>
      <!-- layer 3 -->
      <text x="0" y="600" font-size="32" font-weight="700" fill="#1F4E79" font-family="Noto Serif SC,SimSun,serif">巡检</text>
      <text x="240" y="590" font-size="26" fill="#555">智能巡检机器人 · 进出危险区域故障排查</text>
      <text x="240" y="634" font-size="24" fill="#777">替代高危场景人工巡检</text>
      <text x="1728" y="600" class="m" font-size="36" font-weight="700" fill="#1F4E79" text-anchor="end">70%</text>
      <text x="1728" y="644" font-size="24" fill="#777" text-anchor="end">人工巡检工作量被替代</text>
      <line x1="0" y1="700" x2="1728" y2="700" stroke="#E5E5E5" stroke-width="2"/>
      <!-- cost bar -->
      <text x="0" y="770" font-size="26" fill="#777">成本背景：运维成本占项目建设成本</text>
      <rect x="560" y="748" width="900" height="26" fill="#EDEDED"/>
      <rect x="740" y="748" width="270" height="26" fill="#1F4E79"/>
      <text x="720" y="740" class="m" font-size="24" fill="#777" text-anchor="end">20%</text>
      <text x="1030" y="740" class="m" font-size="24" fill="#1F4E79">30%</text>
    </svg>
  </div>
</div>
</body>
</html>
