<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋产业智能应用进展 · 课件</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#222;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh}
iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(var(--s,1));width:1920px;height:1080px;border:0;display:none;background:#fff}
iframe.on{display:block}
#nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:#eee;font-size:14px;z-index:10}
#nav button{background:#1F4E79;color:#fff;border:0;padding:8px 18px;font-size:15px;cursor:pointer}
#hint{opacity:.6;margin-left:8px}
#wall{position:fixed;inset:0;background:#1a1a1a;overflow:auto;display:none;padding:30px;z-index:20}
#wall.on{display:block}
#wall .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
#wall .cell{cursor:pointer}
#wall iframe{position:static;transform:scale(0.24);transform-origin:top left;width:1920px;height:1080px;display:block;pointer-events:none}
#wall .clip{width:100%;aspect-ratio:16/9;overflow:hidden;background:#fff;position:relative}
#wall .lbl{color:#ccc;font-size:13px;margin-top:6px;text-align:center}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav">
  <button onclick="go(-1)">← 上一页</button>
  <span id="cnt"></span>
  <button onclick="go(1)">下一页 →</button>
  <button onclick="toggleWall()">概览 (O)</button>
  <span id="hint">← / → 翻页 · O 概览墙 · Esc 返回</span>
</div>
<div id="wall"><div class="grid" id="wallGrid"></div></div>
<script>
const N = 26, stage = document.getElementById('stage'), wallGrid = document.getElementById('wallGrid');
let cur = 0;
for (let i = 1; i <= N; i++) {
  const f = document.createElement('iframe');
  f.src = 'p' + String(i).padStart(2, '0') + '.html';
  f.dataset.i = i - 1; stage.appendChild(f);
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = '<div class="clip"></div><div class="lbl">' + i + '</div>';
  const wf = document.createElement('iframe'); wf.src = f.src; wf.tabIndex = -1;
  cell.querySelector('.clip').appendChild(wf);
  cell.onclick = () => { cur = i - 1; render(); toggleWall(false); };
  wallGrid.appendChild(cell);
}
const frames = [...stage.children];
function fit() { document.documentElement.style.setProperty('--s', Math.min(innerWidth / 1920, (innerHeight - 60) / 1080)); }
function render() { frames.forEach((f, i) => f.classList.toggle('on', i === cur)); document.getElementById('cnt').textContent = (cur + 1) + ' / ' + N; }
function go(d) { cur = Math.max(0, Math.min(N - 1, cur + d)); render(); }
function toggleWall(force) { const w = document.getElementById('wall'); w.classList.toggle('on', force); }
addEventListener('resize', fit); fit(); render();
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') go(1);
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(-1);
  else if (e.key === 'o' || e.key === 'O') toggleWall();
  else if (e.key === 'Escape') toggleWall(false);
});
</script>
</body>
</html>
