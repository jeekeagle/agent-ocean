<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>指标独立性检验</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:70px 96px 60px;display:flex;flex-direction:column}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:60px;color:#1F4E79;letter-spacing:4px;line-height:1.15}
.fig{flex:1;margin-top:36px}
.fig svg{display:block;width:100%;height:100%}
.m{font-family:'JetBrains Mono',Consolas,monospace}
</style>
</head>
<body>
<div class="page">
  <h1>指标独立性检验</h1>
  <div class="fig">
    <svg viewBox="0 0 1728 838">
      <!-- funnel -->
      <polygon points="0,40 760,40 660,170 100,170" fill="#F4F6F8" stroke="#C9C9C9" stroke-width="2"/>
      <text x="380" y="100" font-size="28" fill="#555" text-anchor="middle">候选指标 · 十余项</text>
      <polygon points="100,200 660,200 560,330 200,330" fill="#E9EDF1" stroke="#C9C9C9" stroke-width="2"/>
      <text x="380" y="258" font-size="28" fill="#555" text-anchor="middle">独立性检验</text>
      <text x="380" y="298" font-size="24" fill="#888" text-anchor="middle">「一根动，另一根必须能不动」</text>
      <polygon points="200,360 560,360 500,490 260,490" fill="#1F4E79"/>
      <text x="380" y="438" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">三根指标</text>
      <!-- triangle -->
      <line x1="1180" y1="140" x2="940" y2="560" stroke="#C9C9C9" stroke-width="3"/>
      <line x1="1180" y1="140" x2="1420" y2="560" stroke="#C9C9C9" stroke-width="3"/>
      <line x1="940" y1="560" x2="1420" y2="560" stroke="#C9C9C9" stroke-width="3"/>
      <circle cx="1180" cy="140" r="86" fill="#fff" stroke="#1F4E79" stroke-width="3"/>
      <text x="1180" y="132" font-size="26" fill="#1F4E79" text-anchor="middle">有效作业</text>
      <text x="1180" y="166" font-size="26" fill="#1F4E79" text-anchor="middle">时间窗口</text>
      <circle cx="940" cy="560" r="86" fill="#fff" stroke="#1F4E79" stroke-width="3"/>
      <text x="940" y="552" font-size="26" fill="#1F4E79" text-anchor="middle">判断依据</text>
      <text x="940" y="586" font-size="26" fill="#1F4E79" text-anchor="middle">来源</text>
      <circle cx="1420" cy="560" r="86" fill="#fff" stroke="#1F4E79" stroke-width="3"/>
      <text x="1420" y="552" font-size="26" fill="#1F4E79" text-anchor="middle">人员配置</text>
      <text x="1420" y="586" font-size="26" fill="#1F4E79" text-anchor="middle">位置</text>
      <!-- example on edge -->
      <text x="1180" y="495" font-size="24" fill="#777" text-anchor="middle">智慧港口：判断→模型</text>
      <text x="1180" y="529" font-size="24" fill="#777" text-anchor="middle">人员仍需现场盯守</text>
      <text x="1180" y="700" font-size="26" fill="#555" text-anchor="middle">判断与位置两根独立 —— 一根动了，另一根可以不动</text>
    </svg>
  </div>
</div>
</body>
</html>
