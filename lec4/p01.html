<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋产业智能应用进展</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
@page{size:1920px 1080px;margin:0}
@media print{html,body{width:1920px;height:1080px}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{width:1920px;height:1080px;overflow:hidden;display:flow-root;font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;color:#1A1A1A;-webkit-font-smoothing:antialiased}
.page{width:1920px;height:1080px;padding:110px 96px 80px;display:flex;flex-direction:column}
.kick{font-size:28px;color:#8A8A8A;letter-spacing:10px}
h1{font-family:'Noto Serif SC','Songti SC',SimSun,serif;font-weight:700;font-size:104px;color:#1F4E79;letter-spacing:6px;line-height:1.15;margin-top:26px}
.rule{width:150px;height:6px;background:#1F4E79;margin-top:38px}
.sub{font-size:32px;color:#666;margin-top:34px;letter-spacing:2px}
.fig{flex:1;margin-top:40px}
.fig svg{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div class="page">
  <div class="kick">海洋智能技术 · 第五讲</div>
  <h1>海洋产业智能应用进展</h1>
  <div class="rule"></div>
  <div class="sub">产业进展评估：五个领域，一把尺子</div>
  <div class="fig">
    <svg viewBox="0 0 1728 300">
      <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#C8C8C8"/></marker>
      </defs>
      <line x1="80" y1="150" x2="1648" y2="150" stroke="#C8C8C8" stroke-width="3" marker-end="url(#ar)"/>
      <polygon points="80,150 92,143 92,157" fill="#C8C8C8"/>
      <text x="80" y="228" font-size="28" fill="#888">人承担约束</text>
      <text x="1648" y="228" font-size="28" fill="#1F4E79" font-weight="700" text-anchor="end">系统承担约束</text>
      <g>
        <circle cx="468" cy="150" r="12" fill="#1F4E79"/>
        <text x="468" y="112" font-size="28" fill="#1A1A1A" text-anchor="middle">海上风电运维</text>
        <circle cx="774" cy="150" r="12" fill="#1F4E79"/>
        <text x="774" y="112" font-size="28" fill="#1A1A1A" text-anchor="middle">智慧渔业</text>
        <circle cx="1045" cy="150" r="12" fill="#1F4E79"/>
        <text x="1045" y="112" font-size="28" fill="#1A1A1A" text-anchor="middle">水下清洗装备</text>
        <circle cx="1349" cy="150" r="12" fill="#1F4E79"/>
        <text x="1349" y="112" font-size="28" fill="#1A1A1A" text-anchor="middle">海洋环境预报</text>
        <circle cx="1597" cy="150" r="12" fill="#1F4E79"/>
        <text x="1597" y="112" font-size="28" fill="#1A1A1A" text-anchor="middle">智慧港口</text>
      </g>
    </svg>
  </div>
</div>
</body>
</html>
