<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 三条硬标准</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 26px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 22px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">三条硬标准</p>

  <svg class="figure" width="1660" height="540" viewBox="0 0 1660 540" fill="none">
    <!-- 判断句 -->
    <text x="0" y="40" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WHAT MAKES A CONSTRAINT “HARD”</text>
    <text x="0" y="100" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">判断一个约束够不够硬，就看<tspan fill="#1F4E79">三条</tspan>：</text>

    <!-- 三列 -->
    <line x1="545" y1="150" x2="545" y2="470" stroke="#E8E6E1" stroke-width="1"/>
    <line x1="1085" y1="150" x2="1085" y2="470" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 列1 -->
    <text x="0" y="200" font-family="JetBrains Mono" font-size="21" fill="#1F4E79">01</text>
    <text x="0" y="250" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">能不能绕开？</text>
    <text x="0" y="320" font-family="Noto Sans SC" font-size="24" fill="#9B998F">陆地：缺电拉线、缺水调水</text>
    <text x="0" y="360" font-family="Noto Sans SC" font-size="24" fill="#9B998F">缺信号，建基站</text>
    <line x1="0" y1="392" x2="480" y2="392" stroke="#E8E6E1" stroke-width="1"/>
    <text x="0" y="440" font-family="Noto Sans SC" font-size="25" fill="#141414">海洋：不是成本高，</text>
    <text x="0" y="480" font-family="Noto Sans SC" font-size="25" fill="#141414"><tspan fill="#1F4E79" font-weight="500">原理上做不到</tspan></text>

    <!-- 列2 -->
    <text x="610" y="200" font-family="JetBrains Mono" font-size="21" fill="#1F4E79">02</text>
    <text x="610" y="250" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">由谁决定？</text>
    <text x="610" y="320" font-family="Noto Sans SC" font-size="24" fill="#9B998F">陆地：生产计划自己排</text>
    <text x="610" y="360" font-family="Noto Sans SC" font-size="24" fill="#9B998F">窗口期由人掌握</text>
    <line x1="610" y1="392" x2="1020" y2="392" stroke="#E8E6E1" stroke-width="1"/>
    <text x="610" y="440" font-family="Noto Sans SC" font-size="25" fill="#141414">海洋：<tspan font-weight="500" fill="#1F4E79">天气和海况</tspan>说了算</text>
    <text x="610" y="480" font-family="Noto Sans SC" font-size="25" fill="#141414">台风来，人必须上岸</text>

    <!-- 列3 -->
    <text x="1150" y="200" font-family="JetBrains Mono" font-size="21" fill="#1F4E79">03</text>
    <text x="1150" y="250" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">能不能靠努力化解？</text>
    <text x="1150" y="320" font-family="Noto Sans SC" font-size="24" fill="#9B998F">陆地：加班能解决</text>
    <text x="1150" y="360" font-family="Noto Sans SC" font-size="24" fill="#9B998F">产能问题</text>
    <line x1="1150" y1="392" x2="1560" y2="392" stroke="#E8E6E1" stroke-width="1"/>
    <text x="1150" y="440" font-family="Noto Sans SC" font-size="25" fill="#141414">海洋：加班解决不了</text>
    <text x="1150" y="480" font-family="Noto Sans SC" font-size="25" fill="#141414"><tspan fill="#1F4E79" font-weight="500">台风</tspan></text>
  </svg>

  <p class="foot">三条标准，海洋产业<b>三条全中</b>——这就是「高约束」的含义。</p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
