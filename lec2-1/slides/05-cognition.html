  <p class="assertion">认知约束</p>

  <svg class="figure" width="1660" height="540" viewBox="0 0 1660 540" fill="none">
    <!-- 三个数字 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WHAT WE HAVE NEVER SEEN</text>

    <text x="0" y="170" font-family="JetBrains Mono" font-size="110" font-weight="500" fill="#141414">71<tspan font-size="52">%</tspan></text>
    <text x="0" y="230" font-family="Noto Sans SC" font-size="24" fill="#55534E">海洋占地球表面积</text>

    <text x="450" y="170" font-family="JetBrains Mono" font-size="110" font-weight="500" fill="#141414">93<tspan font-size="52">%</tspan></text>
    <text x="450" y="230" font-family="Noto Sans SC" font-size="24" fill="#55534E">200 米以下深海占海底</text>

    <text x="940" y="170" font-family="JetBrains Mono" font-size="110" font-weight="500" fill="#1F4E79">99.999<tspan font-size="52">%</tspan></text>
    <text x="940" y="230" font-family="Noto Sans SC" font-size="24" fill="#1F4E79">深海海底，从未被观测到</text>

    <line x1="0" y1="290" x2="1660" y2="290" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 类比 -->
    <text x="0" y="350" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE BIRDCAGE ANALOGY</text>
    <text x="0" y="415" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">好比开着一架飞机，吊着一个鸟笼，</text>
    <text x="0" y="468" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">从<tspan fill="#1F4E79">一万米</tspan>高度，飞过非洲大陆</text>

    <!-- 原因 -->
    <line x1="900" y1="320" x2="900" y2="520" stroke="#E8E6E1" stroke-width="1"/>
    <text x="970" y="365" font-family="Noto Sans SC" font-size="24" fill="#55534E">完全<tspan font-weight="500" fill="#141414">无光</tspan>的环境作业</text>
    <text x="970" y="412" font-family="Noto Sans SC" font-size="24" fill="#55534E">复杂的<tspan font-weight="500" fill="#141414">海底地形</tspan></text>
    <text x="970" y="459" font-family="Noto Sans SC" font-size="24" fill="#55534E">依赖<tspan font-weight="500" fill="#141414">直接观测</tspan>，手段长期跟不上</text>
    <text x="970" y="516" font-family="Noto Sans SC" font-size="24" fill="#1F4E79" font-weight="500">——而认知，是开发利用的前提</text>
  </svg>

  <p class="foot">你不了解这片海，就<b>没法在这片海上做决策</b>——看不见，就管不了。</p>
