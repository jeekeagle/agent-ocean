<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P06 · 约束迁移</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; position: relative; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 64px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
  .wave { position: absolute; left: 0; bottom: 20px; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">约束迁移</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <!-- 左：自我强化循环 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE SELF-REINFORCING LOOP</text>

    <g font-family="Noto Sans SC" font-size="23">
      <rect x="0" y="70" width="440" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="30" y="114" fill="#141414">介质约束 → 技术成本上升</text>

      <line x1="220" y1="140" x2="220" y2="185" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M220 197 L 210 179 L 230 179 Z" fill="#B9B7AF"/>

      <rect x="0" y="200" width="440" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="30" y="244" fill="#141414">资本却步 → 认知投入受限</text>

      <line x1="220" y1="270" x2="220" y2="315" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M220 327 L 210 309 L 230 309 Z" fill="#B9B7AF"/>

      <rect x="0" y="330" width="440" height="70" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="30" y="374" fill="#141414">认知不足 → 决策风险加大</text>

      <line x1="220" y1="400" x2="220" y2="445" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M220 457 L 210 439 L 230 439 Z" fill="#B9B7AF"/>

      <rect x="0" y="460" width="440" height="70" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="30" y="504" fill="#1F4E79">风险加大 → 融资成本推高</text>

      <!-- 回环箭头 -->
      <path d="M440 495 C 520 470, 530 160, 448 112" stroke="#1F4E79" stroke-width="2.5" fill="none" stroke-dasharray="7 7"/>
      <path d="M440 100 L 456 106 L 446 120" fill="#1F4E79"/>
      <text x="480" y="320" font-size="21" fill="#1F4E79" text-anchor="middle" transform="rotate(90 480 320)">自我强化</text>
    </g>

    <!-- 分隔 -->
    <line x1="620" y1="30" x2="620" y2="540" stroke="#E8E6E1" stroke-width="1"/>

    <!-- 右：迁移阶梯 -->
    <text x="700" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">MIGRATION · 迁移的四层</text>

    <g font-family="Noto Sans SC">
      <rect x="700" y="440" width="200" height="64" fill="#E4E2DC"/>
      <text x="920" y="480" font-size="24" fill="#55534E">人的生理极限</text>

      <rect x="700" y="340" width="330" height="64" fill="#B9B7AF"/>
      <text x="1050" y="380" font-size="24" fill="#55534E">装备的可靠性</text>

      <rect x="700" y="240" width="460" height="64" fill="#55534E"/>
      <text x="1180" y="280" font-size="24" fill="#55534E">作业的空间范围</text>

      <rect x="700" y="140" width="590" height="64" fill="#1F4E79"/>
      <text x="1310" y="180" font-size="24" fill="#1F4E79">决策的判断能力</text>
    </g>

    <text x="700" y="565" font-family="Noto Sans SC" font-size="23" fill="#9B998F">每迁移一层，产业就往前进一步</text>

    <!-- 右下：AI 之问 -->
    <line x1="700" y1="590" x2="1660" y2="590" stroke="#E8E6E1" stroke-width="1"/>
  </svg>

  <p class="foot">约束不能靠「更努力」解决，只能靠<b>技术突破来迁移</b>——人工智能来了，<b style="color:#1F4E79">它能迁移哪几层？</b></p>

  <svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none">
    <path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/>
  </svg>
</body>
</html>
