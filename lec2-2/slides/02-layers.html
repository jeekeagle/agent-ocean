<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三层约束</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">三层约束</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THREE LAYERS · REVIEW</text>

    <line x1="545" y1="70" x2="545" y2="440" stroke="#E8E6E1" stroke-width="1.5"/>
    <line x1="1115" y1="70" x2="1115" y2="440" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 第一层 -->
    <g>
      <text x="30" y="120" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">01</text>
      <text x="30" y="186" font-family="Noto Serif SC" font-weight="700" font-size="38" fill="#141414">自然的约束</text>
      <line x1="30" y1="214" x2="515" y2="214" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="30" y="274" font-family="Noto Sans SC" font-size="27" fill="#55534E"><tspan font-weight="500" fill="#141414">通信</tspan> · <tspan font-weight="500" fill="#141414">供电</tspan> · <tspan font-weight="500" fill="#141414">定位</tspan></text>
      <text x="30" y="324" font-family="Noto Sans SC" font-size="27" fill="#55534E">在海水里失效</text>
      <text x="30" y="404" font-family="Noto Sans SC" font-size="24" fill="#9B998F">物理层面的硬约束</text>
    </g>

    <!-- 第二层 -->
    <g>
      <text x="600" y="120" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">02</text>
      <text x="600" y="186" font-family="Noto Serif SC" font-weight="700" font-size="38" fill="#141414">代价的约束</text>
      <line x1="600" y1="214" x2="1085" y2="214" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="600" y="274" font-family="Noto Sans SC" font-size="27" fill="#55534E">因为难，所以<tspan font-weight="500" fill="#141414">贵 · 慢 · 险</tspan></text>
      <text x="600" y="324" font-family="Noto Sans SC" font-size="27" fill="#55534E">作业成本被抬高</text>
      <text x="600" y="404" font-family="Noto Sans SC" font-size="24" fill="#9B998F">同一件事，代价数倍于陆地</text>
    </g>

    <!-- 第三层 -->
    <g>
      <text x="1170" y="120" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">03</text>
      <text x="1170" y="186" font-family="Noto Serif SC" font-weight="700" font-size="38" fill="#141414">认知的约束</text>
      <line x1="1170" y1="214" x2="1645" y2="214" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="1170" y="274" font-family="Noto Sans SC" font-size="27" fill="#55534E"><tspan font-weight="500" fill="#141414">看不见</tspan>，就管不了</text>
      <text x="1170" y="324" font-family="Noto Sans SC" font-size="27" fill="#55534E">观测跟不上</text>
      <text x="1170" y="404" font-family="Noto Sans SC" font-size="24" fill="#9B998F">信息层面的缺口</text>
    </g>

    <line x1="0" y1="470" x2="1660" y2="470" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="525" font-family="Noto Sans SC" font-size="27" fill="#55534E">三层摆开，问题只剩一个——<tspan font-weight="500" fill="#1F4E79">人工智能来了，它动的是哪一层？</tspan></text>
  </svg>

  <p class="foot">上一块摆开了三层约束——这一块回答<b>AI 动哪一层</b>。</p>
</body>
</html>
