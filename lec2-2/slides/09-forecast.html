<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋预报</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">海洋预报</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">LAYER 2 · SLOPE OF THE COST CURVE</text>

    <!-- 左：传统 -->
    <rect x="0" y="70" width="700" height="330" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">传统数值模式</text>
    <line x1="40" y1="158" x2="660" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="216">依赖<tspan font-weight="500" fill="#141414">超级计算机</tspan></text>
      <text x="40" y="264">一次区域预报 <tspan font-weight="500" fill="#141414">数小时</tspan></text>
      <text x="40" y="312">台风、赤潮突发时</text>
      <text x="40" y="356">预报时效跟不上应急预警</text>
    </g>

    <!-- 中间 -->
    <text x="770" y="250" text-anchor="middle" font-family="JetBrains Mono" font-size="26" fill="#9B998F">EMBED AI</text>
    <line x1="730" y1="290" x2="800" y2="290" stroke="#1F4E79" stroke-width="3"/>
    <path d="M814 290 L 792 279 L 792 301 Z" fill="#1F4E79"/>

    <!-- 右：3D-EST -->
    <rect x="860" y="70" width="800" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="900" y="132" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">深圳 × 华为云 · 海洋智能预报大模型</text>
    <line x1="900" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="900" y="216">盘古气象大模型框架 · <tspan font-weight="500" fill="#141414">3D-EST 架构</tspan></text>
      <text x="900" y="264">全国首个深度融合 AI · <tspan font-weight="500" fill="#141414">全栈国产算力</tspan></text>
      <text x="900" y="348">深圳市海洋发展促进中心 × 华为云</text>
    </g>
    <text x="900" y="452" font-family="JetBrains Mono" font-size="58" font-weight="500" fill="#1F4E79">天级 <tspan font-size="40">→</tspan> 分钟级</text>
    <text x="1330" y="452" font-family="Noto Sans SC" font-size="26" fill="#55534E">预报推理时间</text>

    <!-- 底部 -->
    <line x1="0" y1="500" x2="1660" y2="500" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="27" fill="#55534E">量级一变，过去不成立的事成立了——<tspan font-weight="500" fill="#1F4E79">台风路径高频滚动更新，赤潮边漂边追</tspan>。</text>
  </svg>

  <p class="foot">从几小时到几分钟，不是快一点，是<b>量级</b>的变化。</p>
</body>
</html>
