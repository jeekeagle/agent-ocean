<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>约束位移</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">约束位移</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SUMMARY · WHAT CHANGED AT EACH LAYER</text>

    <!-- 四行收口 -->
    <line x1="0" y1="66" x2="1660" y2="66" stroke="#E8E6E1" stroke-width="1.5"/>
    <g>
      <text x="0" y="126" font-family="JetBrains Mono" font-size="22" font-weight="500" fill="#1F4E79">L1</text>
      <text x="90" y="126" font-family="Noto Sans SC" font-size="27" fill="#141414">不改海，改<tspan font-weight="500" fill="#1F4E79">「人在场」</tspan></text>
      <text x="700" y="126" font-family="Noto Sans SC" font-size="25" fill="#55534E">判断从现场搬到岸上</text>

      <line x1="0" y1="156" x2="1660" y2="156" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="0" y="216" font-family="JetBrains Mono" font-size="22" font-weight="500" fill="#1F4E79">L2</text>
      <text x="90" y="216" font-family="Noto Sans SC" font-size="27" fill="#141414">压<tspan font-weight="500" fill="#1F4E79">成本曲线的斜率</tspan></text>
      <text x="700" y="216" font-family="Noto Sans SC" font-size="25" fill="#55534E">几小时 → 几分钟 · 20 年 → 3 年</text>

      <line x1="0" y1="246" x2="1660" y2="246" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="0" y="306" font-family="JetBrains Mono" font-size="22" font-weight="500" fill="#1F4E79">L3</text>
      <text x="90" y="306" font-family="Noto Sans SC" font-size="27" fill="#141414">干的是<tspan font-weight="500" fill="#1F4E79">补盲</tspan></text>
      <text x="700" y="306" font-family="Noto Sans SC" font-size="25" fill="#55534E">看不见 → 看得见 → 算得出</text>

      <line x1="0" y1="336" x2="1660" y2="336" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="0" y="396" font-family="JetBrains Mono" font-size="22" font-weight="500" fill="#9B998F">L4</text>
      <text x="90" y="396" font-family="Noto Sans SC" font-size="27" fill="#9B998F">制度约束 · <tspan font-weight="500" fill="#141414">拆不动</tspan></text>
      <text x="700" y="396" font-family="Noto Sans SC" font-size="25" fill="#9B998F">只提供协同的数据底座</text>

      <line x1="0" y1="426" x2="1660" y2="426" stroke="#E8E6E1" stroke-width="1.5"/>
    </g>

    <!-- 结论 -->
    <text x="0" y="500" font-family="Noto Serif SC" font-weight="700" font-size="36" fill="#141414">约束没有被消除，只是被换了位置</text>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="26" fill="#55534E">过去压在<tspan font-weight="500" fill="#141414">人的生理极限</tspan>上，现在开始压在<tspan font-weight="500" fill="#1F4E79">装备的可靠性</tspan>与<tspan font-weight="500" fill="#1F4E79">模型的判断能力</tspan>上</text>
  </svg>

  <p class="foot">人退出了现场，但约束没有消失——<b>它换了地方</b>。</p>
</body>
</html>
