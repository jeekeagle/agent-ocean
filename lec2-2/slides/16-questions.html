<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开放问题</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 76px 130px 0; }
  .foot { margin: 42px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">开放问题</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">QUESTIONS TO TAKE AWAY</text>

    <!-- Q1 已回答 -->
    <rect x="0" y="70" width="1660" height="130" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="50" y="148" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#9B998F">Q1</text>
    <text x="170" y="136" font-family="Noto Sans SC" font-size="30" fill="#141414">人工智能来了，<tspan font-weight="500" fill="#1F4E79">它动的是哪一层</tspan>？</text>
    <text x="170" y="176" font-family="Noto Sans SC" font-size="23" fill="#55534E">答案已有——不是提效，是迁移约束；制度那层，它拆不动</text>

    <!-- Q2 下一块的钩子 -->
    <rect x="0" y="230" width="1660" height="130" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="50" y="308" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#1F4E79">Q2</text>
    <text x="170" y="296" font-family="Noto Sans SC" font-size="30" fill="#141414">约束一路迁移下去，<tspan font-weight="500" fill="#1F4E79">产业的路往哪个方向走</tspan>？</text>
    <text x="170" y="336" font-family="Noto Sans SC" font-size="23" fill="#55534E">这是我们下一块要讲的</text>

    <!-- Q3 留给学生 -->
    <rect x="0" y="390" width="1660" height="130" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="50" y="468" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#9B998F">Q3</text>
    <text x="170" y="456" font-family="Noto Sans SC" font-size="30" fill="#141414">你的海域里，<tspan font-weight="500" fill="#1F4E79">哪一层约束</tspan>最先被推动？</text>
    <text x="170" y="496" font-family="Noto Sans SC" font-size="23" fill="#55534E">对照三层约束与今天的案例，给出你的排序和理由</text>
  </svg>

  <p class="foot">约束换位之后，路往哪走——<b>下一块揭晓</b>，先带走你的排序。</p>
</body>
</html>
