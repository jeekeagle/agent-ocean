<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网衣清洗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">网衣清洗</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <!-- 问题条 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">CAGE NET · BIOFOULING</text>
    <rect x="0" y="60" width="1660" height="80" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="110" font-family="Noto Sans SC" font-size="26" fill="#55534E">网衣附着<tspan font-weight="500" fill="#141414">贝类 · 藤壶 · 藻类</tspan> → 阻碍水体交换 · 增加重量 · 甚至破坏结构</text>

    <!-- 左：传统 -->
    <rect x="0" y="180" width="700" height="250" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="242" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">传统 · 潜水员人工清洗</text>
    <line x1="40" y1="268" x2="660" y2="268" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="26" fill="#55534E">
      <text x="40" y="324">效率低 · <tspan font-weight="500" fill="#141414">危险性高</tspan></text>
      <text x="40" y="378">潜水员老龄化严重</text>
      <text x="40" y="422" fill="#9B998F">年轻人鲜少入行</text>
    </g>

    <!-- 中间箭头 -->
    <line x1="740" y1="305" x2="800" y2="305" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M814 305 L 792 294 L 792 316 Z" fill="#1F4E79"/>

    <!-- 右：森科特 -->
    <rect x="840" y="180" width="820" height="250" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="880" y="242" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">森科特（青岛）· 水下网衣清洗机器人</text>
    <line x1="880" y1="268" x2="1620" y2="268" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="880" y="360" font-family="JetBrains Mono" font-size="72" font-weight="500" fill="#1F4E79">5–8<tspan font-size="34"> 倍</tspan></text>
    <text x="1180" y="360" font-family="Noto Sans SC" font-size="26" fill="#55534E">效率 vs 人工</text>
    <text x="880" y="412" font-family="Noto Sans SC" font-size="24" fill="#55534E">深远海网箱清洗份额 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">&gt;95%</tspan> · 核心部件国产化 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">90%+</tspan></text>

    <!-- 底部 -->
    <line x1="0" y1="480" x2="1660" y2="480" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="536" font-family="Noto Sans SC" font-size="27" fill="#55534E">从海洋牧场观测网起步，五年攻克——<tspan font-weight="500" fill="#141414">打破国外垄断</tspan>。</text>
    <text x="0" y="590" font-family="Noto Sans SC" font-size="27" fill="#55534E">第一例：判断和动作，都<tspan font-weight="500" fill="#1F4E79">不再依赖潜水员下水</tspan>。</text>
  </svg>

  <p class="foot">关键的不是倍数，是这件事从此<b>不依赖潜水员</b>。</p>
</body>
</html>
