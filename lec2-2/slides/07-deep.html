<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深海装备</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">深海装备</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">HEAVY WORK-CLASS ROV · TWO SIGNALS</text>

    <!-- 左：09.28 -->
    <rect x="0" y="70" width="790" height="330" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#141414">09.28</text>
    <text x="180" y="132" font-family="Noto Sans SC" font-size="25" fill="#55534E">山东威海港 · 吊装登船</text>
    <line x1="40" y1="158" x2="750" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="230" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">2 × 4500 米级深海作业机器人</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="292">国内首批<tspan font-weight="500" fill="#141414">量产</tspan>重型工作级深海机器人</text>
      <text x="40" y="340">150 马力 / 250 马力 · 上万种零部件<tspan font-weight="500" fill="#141414">全部国产化</tspan></text>
      <text x="40" y="384" fill="#9B998F">山东未来机器人 × 哈尔滨工业大学（威海）</text>
    </g>

    <!-- 右：10.08 -->
    <rect x="870" y="70" width="790" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="910" y="132" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#1F4E79">10.08</text>
    <text x="1050" y="132" font-family="Noto Sans SC" font-size="25" fill="#55534E">同一天 · 两条消息</text>
    <line x1="910" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="910" y="220">深海智人（广州）：新签 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">8 台</tspan> 工作级 ROV</text>
      <text x="910" y="264">合同总额 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">3 亿元</tspan>（南美 · 东南亚）</text>
      <text x="910" y="330">卫澜深海：新一轮融资 · 深创投等进入</text>
      <text x="910" y="374">过去 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">9 个月</tspan> 已完成 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">5 轮</tspan> 融资</text>
    </g>

    <!-- 底部：两道门槛 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="522" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">造得出来</text>
    <text x="220" y="522" font-family="JetBrains Mono" font-size="28" fill="#1F4E79">×</text>
    <text x="290" y="522" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">真实有用</text>
    <text x="0" y="580" font-family="Noto Sans SC" font-size="26" fill="#55534E">资本在加码，装备在接真实的活儿——深海机器人<tspan font-weight="500" fill="#141414">同时跨过两道门槛</tspan>。</text>
  </svg>

  <p class="foot">资本加码与真实订单，<b>出现在同一周</b>。</p>
</body>
</html>
