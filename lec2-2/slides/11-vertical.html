<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>垂直模型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">垂直模型</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">ONE BASE · MULTIPLE VERTICALS</text>

    <!-- 左：琅琊 -->
    <rect x="0" y="70" width="800" height="380" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#141414">「琅琊」海洋大模型 · 中科院海洋所</text>
    <line x1="40" y1="158" x2="760" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>

    <text x="40" y="216" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#55534E">1.0 · 2024.12</text>
    <text x="40" y="260" font-family="Noto Sans SC" font-size="25" fill="#55534E">未来 1–7 天全球海洋状态变量 · 国家海洋环境预报中心部署</text>

    <line x1="70" y1="290" x2="70" y2="330" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M70 344 L 60 326 L 80 326 Z" fill="#B9B7AF"/>

    <text x="40" y="396" font-family="JetBrains Mono" font-size="24" font-weight="500" fill="#1F4E79">2.0 · 2026.06 青岛</text>
    <text x="40" y="436" font-family="Noto Sans SC" font-size="25" fill="#55534E"><tspan font-weight="500" fill="#1F4E79">6 类关键现象 × 6 个垂直模型</tspan>（台风 · 降水 · 风暴潮 · 海冰…）</text>

    <!-- 中间注 -->
    <text x="850" y="240" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">一个变量</text>
    <text x="850" y="300" font-family="JetBrains Mono" font-size="26" fill="#1F4E79">→</text>
    <text x="850" y="360" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">六类现象</text>

    <!-- 右：范蠡 -->
    <rect x="1080" y="70" width="580" height="380" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1120" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">范蠡大模型 4.0</text>
    <text x="1120" y="172" font-family="JetBrains Mono" font-size="20" fill="#9B998F">2025.08.17 · 智慧渔业大会</text>
    <line x1="1120" y1="196" x2="1620" y2="196" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="1120" y="268" font-family="JetBrains Mono" font-size="52" font-weight="500" fill="#1F4E79">3970<tspan font-size="28"> 亿参数</tspan></text>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <text x="1120" y="330">覆盖 <tspan font-weight="500" fill="#141414">8 个养殖维度</tspan></text>
      <text x="1120" y="374">整合 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">101</tspan> 个养殖品种知识</text>
      <text x="1120" y="418">公开数据集：11.6 万帧图像 · 69.8 万条任务</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="500" x2="1660" y2="500" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="27" fill="#55534E">一个模型管八个维度——搁几年前，这是<tspan font-weight="500" fill="#141414">八个团队、八套系统</tspan>。</text>
  </svg>

  <p class="foot">同一套底座，往上长不同的<b>垂直模型</b>——这就是能力可迁移。</p>
</body>
</html>
