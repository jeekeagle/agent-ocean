<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>在场约束</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">在场约束</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">LAYER 1 · THE SEA STAYS, PRESENCE LEAVES</text>

    <!-- 左：过去 -->
    <rect x="0" y="70" width="770" height="330" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">过去 · 判断必须在现场</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="26" fill="#55534E">
      <text x="40" y="216">设备出问题 → <tspan font-weight="500" fill="#141414">有人下去看</tspan></text>
      <text x="40" y="272">网衣破了 → <tspan font-weight="500" fill="#141414">有人潜下去摸</tspan></text>
      <text x="40" y="328">数据异常 → <tspan font-weight="500" fill="#141414">有人在船上判断</tspan></text>
    </g>
    <text x="40" y="378" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">判断在哪，人就得在哪</text>

    <!-- 中间箭头 -->
    <line x1="810" y1="235" x2="870" y2="235" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M884 235 L 862 224 L 862 246 Z" fill="#1F4E79"/>

    <!-- 右：现在 -->
    <rect x="910" y="70" width="750" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="950" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">现在 · 判断搬到岸上</text>
    <line x1="950" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="26" fill="#55534E">
      <text x="950" y="216">装备自己带<tspan font-weight="500" fill="#141414">感知</tspan></text>
      <text x="950" y="272">装备自己带<tspan font-weight="500" fill="#141414">判断</tspan></text>
      <text x="950" y="328">人，退到岸上就行</text>
    </g>
    <text x="950" y="378" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">判断不必在现场做了</text>

    <!-- 底部 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Sans SC" font-size="27" fill="#55534E">海水里的通信、供电、定位，AI 改不了——它改的是<tspan font-weight="500" fill="#1F4E79">「人必须在场」这件事</tspan>。</text>
    <text x="0" y="576" font-family="Noto Sans SC" font-size="27" fill="#55534E">这正是<tspan font-weight="500" fill="#141414">具身智能在海洋领域的入口</tspan>。</text>
  </svg>

  <p class="foot">第一层 AI 改不了海，但它能改<b>「人必须在场」</b>。</p>
</body>
</html>
