<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>赛道格局</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">赛道格局</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">UNDERWATER ROV · MARKET LANDSCAPE</text>

    <!-- 四小龙 -->
    <g font-family="Noto Sans SC" font-size="24" fill="#141414">
      <rect x="0" y="70" width="390" height="64" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="30" y="111">潜行创新</text>
      <rect x="420" y="70" width="390" height="64" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="450" y="111">深之蓝</text>
      <rect x="840" y="70" width="390" height="64" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="870" y="111">世航智能</text>
      <rect x="1260" y="70" width="400" height="64" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="1290" y="111" fill="#1F4E79">山东未来机器人</text>
    </g>
    <text x="0" y="178" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">「水下机器人四小龙」</text>

    <line x1="0" y1="210" x2="1660" y2="210" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 左：潜行创新 -->
    <text x="0" y="268" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">潜行创新</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="0" y="324">2016 年 · 深圳南山</text>
      <text x="0" y="372">便携式水下机器人 · <tspan font-weight="500" fill="#141414">2026 年广东省制造业单项冠军</tspan></text>
      <text x="0" y="420">进入全球 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">130+</tspan> 个国家和地区</text>
      <text x="0" y="468">海外业务占比长期 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">85%+</tspan></text>
    </g>

    <line x1="830" y1="240" x2="830" y2="500" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 右：卫澜深海 -->
    <text x="890" y="268" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">卫澜深海 ·「超级蛙人号」</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="890" y="324">水下通用平台 + 水下原位供电基站</text>
      <text x="890" y="372">声光磁跨尺度感知融合 · 像海豚一样处理声呐</text>
      <text x="890" y="420">已交付：海底能源设施<tspan font-weight="500" fill="#1F4E79">全自主</tspan>巡检作业服务</text>
      <text x="890" y="468" fill="#9B998F">过去是人操作机器，现在是机器自己判断</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="520" x2="1660" y2="520" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="575" font-family="Noto Sans SC" font-size="27" fill="#55534E">赛道已经<tspan font-weight="500" fill="#141414">卷起来了</tspan>——出海、夺冠、全自主，三家各有打法。</text>
  </svg>

  <p class="foot">听清「全自主」三个字——<b>机器自己判断</b>。</p>
</body>
</html>
