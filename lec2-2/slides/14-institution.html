<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>制度约束</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">制度约束</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE ONE AI CANNOT REMOVE</text>

    <!-- 左：海的属性 -->
    <rect x="0" y="70" width="770" height="330" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">海不是一块能圈起来的地</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="26" fill="#55534E">
      <text x="40" y="216"><tspan font-weight="500" fill="#141414">整体性</tspan> · <tspan font-weight="500" fill="#141414">连通性</tspan> · <tspan font-weight="500" fill="#141414">国际性</tspan></text>
      <text x="40" y="270">边界不由单个主体划定</text>
      <text x="40" y="330">跨部门协作不畅 · 资源分散</text>
      <text x="40" y="376">治理碎片化，是普遍问题</text>
    </g>

    <!-- 中间：断开的箭头 -->
    <line x1="810" y1="235" x2="870" y2="235" stroke="#B9B7AF" stroke-width="2.5"/>
    <line x1="830" y1="215" x2="850" y2="255" stroke="#B9B7AF" stroke-width="2.5"/>

    <!-- 右：AI 的边界 -->
    <rect x="910" y="70" width="750" height="150" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="950" y="128" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">AI 能给的</text>
    <text x="950" y="180" font-family="Noto Sans SC" font-size="25" fill="#55534E">跨部门协同的数据底座：同一份数据 · 同一套口径</text>

    <rect x="910" y="250" width="750" height="150" rx="4" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <text x="950" y="308" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">AI 给不了的</text>
    <text x="950" y="360" font-family="Noto Sans SC" font-size="25" fill="#55534E">协调本身 · 权益分配——治理的事，人的事</text>

    <!-- 底部 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Sans SC" font-size="27" fill="#55534E">三层约束里，有一层 AI 动不了——<tspan font-weight="500" fill="#141414">制度约束</tspan>。</text>
    <text x="0" y="576" font-family="Noto Sans SC" font-size="27" fill="#55534E">它给答案，但不给判断权。</text>
  </svg>

  <p class="foot">把 AI 说成万能，比说清它不能干什么<b>更危险</b>。</p>
</body>
</html>
