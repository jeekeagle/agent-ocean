<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>训练门槛</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">训练门槛</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">FLYFISH-1.0 · SOUTH CHINA SEA</text>

    <!-- 档案行 -->
    <rect x="0" y="60" width="1660" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="113" font-family="Noto Sans SC" font-size="26" fill="#55534E">「飞鱼-1.0」· <tspan font-weight="500" fill="#141414">全球首个</tspan>南海区域海-气双向耦合智能大模型 · 中科院南海海洋研究所 × 中国石油大学（华东）</text>

    <!-- 对比条 -->
    <text x="0" y="216" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">TRAINING DATA · YEARS</text>

    <!-- 传统 20 年 -->
    <rect x="0" y="250" width="1400" height="86" fill="#D8D6D0"/>
    <text x="1370" y="305" text-anchor="end" font-family="JetBrains Mono" font-size="44" font-weight="500" fill="#55534E">20+ 年</text>
    <text x="30" y="305" font-family="Noto Sans SC" font-size="27" fill="#55534E">传统 AI 模型</text>

    <!-- 飞鱼 3 年 -->
    <rect x="0" y="370" width="210" height="86" fill="#1F4E79"/>
    <text x="250" y="425" font-family="JetBrains Mono" font-size="44" font-weight="500" fill="#1F4E79">3 年</text>
    <text x="420" y="425" font-family="Noto Sans SC" font-size="27" fill="#55534E">「飞鱼-1.0」</text>

    <!-- 右侧注 -->
    <line x1="1080" y1="350" x2="1080" y2="530" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="1130" y="400" font-family="Noto Sans SC" font-size="25" fill="#55534E">核心数据<tspan font-weight="500" fill="#141414">自主可控</tspan></text>
    <text x="1130" y="448" font-family="Noto Sans SC" font-size="25" fill="#55534E">摆脱对欧美再分析数据的依赖</text>
    <text x="1130" y="496" font-family="Noto Sans SC" font-size="25" fill="#55534E">攒够二十年数据，<tspan font-weight="500" fill="#1F4E79">不再是前置条件</tspan></text>

    <!-- 底部 -->
    <line x1="0" y1="510" x2="1040" y2="510" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="566" font-family="Noto Sans SC" font-size="27" fill="#55534E">数据门槛降下来——<tspan font-weight="500" fill="#141414">3 年对 20 年</tspan>，起跑线变了。</text>
  </svg>

  <p class="foot">数据门槛塌了——<b>三年就能起步</b>，不必等二十年。</p>
</body>
</html>
