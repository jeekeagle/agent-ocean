<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>核心判断</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">核心判断</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">EFFICIENCY VS CONSTRAINT</text>

    <!-- 左：陆地 -->
    <rect x="0" y="70" width="770" height="300" rx="4" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">陆地上的智能化</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="252" font-family="Noto Serif SC" font-weight="700" font-size="60" fill="#55534E">效率</text>
    <text x="40" y="326" font-family="Noto Sans SC" font-size="26" fill="#9B998F">更快 · 更省 · 更准</text>
    <text x="430" y="252" font-family="Noto Sans SC" font-size="26" fill="#55534E">解决的是</text>
    <text x="430" y="300" font-family="Noto Sans SC" font-size="26" fill="#55534E">「怎么干得更好」</text>

    <!-- 中间 -->
    <text x="830" y="230" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#9B998F">VS</text>

    <!-- 右：海洋 -->
    <rect x="890" y="70" width="770" height="300" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">海洋产业的智能化</text>
    <line x1="930" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="252" font-family="Noto Serif SC" font-weight="700" font-size="60" fill="#1F4E79">约束</text>
    <text x="930" y="326" font-family="Noto Sans SC" font-size="26" fill="#55534E">能不能<tspan font-weight="500" fill="#141414">通信</tspan> · 能不能<tspan font-weight="500" fill="#141414">感知</tspan> · 能不能<tspan font-weight="500" fill="#141414">判断</tspan></text>
    <text x="1360" y="252" font-family="Noto Sans SC" font-size="26" fill="#55534E">解决的是</text>
    <text x="1360" y="300" font-family="Noto Sans SC" font-size="26" fill="#55534E">「能不能做」</text>

    <!-- 结论条 -->
    <rect x="0" y="430" width="1660" height="120" rx="4" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="60" y="505" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">AI 在海洋领域的第一个落点：不是<tspan fill="#1F4E79">「提效」</tspan>，是<tspan fill="#1F4E79">「补盲」</tspan></text>
  </svg>

  <p class="foot">AI 不是来给海洋产业提效的，它是来<b>迁移约束</b>的。</p>
</body>
</html>
