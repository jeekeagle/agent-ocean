<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>水下作业</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">水下作业</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SUBSEA OPERATION · KEKAN OCEAN</text>

    <!-- 左：四类场景 -->
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <rect x="0" y="70" width="330" height="70" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="30" y="114">跨海大桥桩基排查</text>
      <rect x="360" y="70" width="330" height="70" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="390" y="114">海上风电基础巡检</text>
      <rect x="0" y="160" width="330" height="70" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="30" y="204">水库堤坝病害探测</text>
      <rect x="360" y="160" width="330" height="70" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="390" y="204">海洋牧场网箱运维</text>
    </g>
    <text x="0" y="290" font-family="Noto Sans SC" font-size="25" fill="#55534E">旧范式：靠人 · 靠经验 · <tspan font-weight="500" fill="#141414">靠运气</tspan></text>
    <text x="0" y="336" font-family="Noto Sans SC" font-size="24" fill="#9B998F">窗口期短 · 海流与能见度限制 · 狭窄空间与强紊流是高危禁区</text>
    <text x="0" y="382" font-family="Noto Sans SC" font-size="24" fill="#9B998F">人工检测数据主观性强</text>

    <!-- 中间箭头 -->
    <line x1="760" y1="205" x2="820" y2="205" stroke="#1F4E79" stroke-width="3.5"/>
    <path d="M834 205 L 812 194 L 812 216 Z" fill="#1F4E79"/>

    <!-- 右：渤海文鳐 -->
    <rect x="870" y="70" width="790" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="910" y="134" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">「渤海文鳐」</text>
    <text x="910" y="184" font-family="Noto Sans SC" font-size="26" fill="#55534E">八推进器 · 工业级水下机器人 · 国产自研</text>
    <line x1="910" y1="210" x2="1620" y2="210" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="910" y="290" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">人下水</text>
    <text x="1090" y="290" font-family="JetBrains Mono" font-size="30" fill="#1F4E79">→</text>
    <text x="1170" y="290" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">机下水</text>
    <text x="910" y="360" font-family="Noto Sans SC" font-size="26" fill="#55534E">烟台科勘海洋，打开<tspan font-weight="500" fill="#1F4E79">水下全场景无人作业</tspan></text>

    <!-- 底部 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Sans SC" font-size="27" fill="#55534E">第二例：高危禁区不再靠人顶——<tspan font-weight="500" fill="#141414">机器下水，数据回岸上</tspan>。</text>
  </svg>

  <p class="foot">「人下水」改成<b>「机下水」</b>——高危禁区交给机器。</p>
</body>
</html>
