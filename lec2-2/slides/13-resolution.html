<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>预报精度</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">预报精度</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SHENZHEN-HANG · RESOLUTION SCALE</text>

    <!-- 尺度条 -->
    <rect x="0" y="80" width="1560" height="86" fill="#D8D6D0"/>
    <text x="40" y="135" font-family="Noto Sans SC" font-size="27" fill="#55534E">现有海洋大模型 · 中尺度<tspan font-weight="500" fill="#141414">（十公里级）</tspan></text>

    <rect x="0" y="210" width="340" height="86" fill="#1F4E79"/>
    <text x="380" y="265" font-family="Noto Sans SC" font-size="27" fill="#1F4E79">「神针·海航」· <tspan font-weight="500" fill="#141414">米级 · 小时级</tspan></text>

    <!-- 说明 -->
    <text x="0" y="360" font-family="Noto Sans SC" font-size="25" fill="#55534E">中科院海洋所 · 依托<tspan font-weight="500" fill="#141414">南海立体观测台站</tspan>：现有 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">100+</tspan> 台套，五年内 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">300+</tspan> 台套</text>

    <line x1="0" y1="396" x2="1660" y2="396" stroke="#E8E6E1" stroke-width="1.5"/>

    <!-- 目标三格 -->
    <g>
      <text x="0" y="452" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">TARGET</text>
      <text x="0" y="512" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">全域<tspan font-family="JetBrains Mono" fill="#1F4E79"> 公里级</tspan></text>

      <line x1="540" y1="430" x2="540" y2="540" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="600" y="512" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">关键海域<tspan font-family="JetBrains Mono" fill="#1F4E79"> 百米级</tspan></text>

      <line x1="1180" y1="430" x2="1180" y2="540" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="1240" y="512" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414"><tspan font-family="JetBrains Mono" fill="#1F4E79">14 天+</tspan> 系列预报</text>
    </g>
  </svg>

  <p class="foot">从十公里级到百米级——<b>「看得见」这件事本身在升级</b>。</p>
</body>
</html>
