<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>两条技术线</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">两条技术线</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">AI VS EMBODIED AI · THE DIVISION</text>

    <!-- 左：人工智能 -->
    <rect x="0" y="70" width="770" height="330" rx="4" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">人工智能 · 屏幕里的参谋</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="252" font-family="Noto Serif SC" font-weight="700" font-size="52" fill="#55534E">把海看清楚</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="320">告诉你台风往哪走</text>
      <text x="40" y="364">告诉你网衣哪里破了</text>
    </g>
    <text x="560" y="252" font-family="Noto Sans SC" font-size="24" fill="#9B998F">始终在屏幕里</text>

    <!-- 中间 VS -->
    <text x="830" y="235" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#9B998F">VS</text>

    <!-- 右：具身智能 -->
    <rect x="890" y="70" width="770" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">具身智能 · 物理世界的行动者</text>
    <line x1="930" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="252" font-family="Noto Serif SC" font-weight="700" font-size="52" fill="#1F4E79">把活接过去</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="930" y="320">台风来了，它去避险</text>
      <text x="930" y="364">网衣破了，它去修补</text>
    </g>
    <text x="1450" y="252" font-family="Noto Sans SC" font-size="24" fill="#1F4E79">在物理世界里</text>

    <!-- 底部结论 -->
    <rect x="0" y="440" width="1660" height="120" rx="4" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="60" y="515" font-family="Noto Serif SC" font-weight="700" font-size="32" fill="#141414">看清楚 <tspan fill="#9B998F">≠</tspan> 把活干了——海洋产业需要的，是<tspan fill="#1F4E79">「有人把活接过去」</tspan></text>
  </svg>

  <p class="foot">看清楚不等于把活干了——这一讲讲第二条线：<b>把活接过去</b>。</p>
</body>
</html>
