<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>VLA 模型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">VLA 模型</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">VISION-LANGUAGE-ACTION · BASE 01</text>

    <!-- 全称条 -->
    <rect x="0" y="70" width="1660" height="110" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="830" y="140" text-anchor="middle" font-family="JetBrains Mono" font-size="34" font-weight="500" fill="#1F4E79">V <tspan fill="#9B998F">/</tspan> L <tspan fill="#9B998F">/</tspan> A</text>
    <text x="1370" y="140" font-family="Noto Sans SC" font-size="24" fill="#55534E">视觉 — 语言 — 动作</text>

    <!-- 过去预编程 -->
    <rect x="0" y="220" width="770" height="250" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="278" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">过去 · 预编程</text>
    <line x1="40" y1="304" x2="730" y2="304" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="358">抬多少厘米 · 转多少度</text>
      <text x="40" y="408">抓多大力，差一个参数都不行</text>
    </g>
    <text x="560" y="428" font-family="JetBrains Mono" font-size="20" fill="#9B998F">PRE-PROGRAMMED</text>

    <line x1="810" y1="345" x2="870" y2="345" stroke="#1F4E79" stroke-width="3"/>
    <path d="M884 345 L 862 334 L 862 356 Z" fill="#1F4E79"/>

    <!-- 现在自主 -->
    <rect x="910" y="220" width="750" height="250" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="950" y="278" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">现在 · 一句话指令</text>
    <line x1="950" y1="304" x2="1620" y2="304" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="950" y="352" font-family="Noto Sans SC" font-size="26" fill="#55534E">「把红色的零件放到装配台上」</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="950" y="408">自己看 · 自己找 · 自己抓 · 自己放</text>
      <text x="950" y="452" fill="#1F4E79">中间没有预设程序</text>
    </g>

    <!-- 底部结论 -->
    <line x1="0" y1="510" x2="1660" y2="510" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="566" font-family="Noto Sans SC" font-size="27" fill="#55534E">从「可编程执行」到「自主化思考」——解决的是<tspan font-weight="500" fill="#1F4E79">从理解到动作</tspan>这一步。</text>
  </svg>

  <p class="foot">机器人不再「照着做」，而是<b>自己判断着做</b>。</p>
</body>
</html>
