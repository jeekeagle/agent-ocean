<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海洋牧场</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">海洋牧场</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">APPLICATION 05 · ZHUHAI CHALLENGE &amp; ORDERS</text>

    <!-- 珠海挑战赛 -->
    <rect x="0" y="70" width="790" height="340" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#141414">大湾区水下机器人挑战赛</text>
    <line x1="40" y1="158" x2="750" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="216">国内首个以<tspan font-weight="500" fill="#141414">真实海洋牧场</tspan>为赛场</text>
      <text x="40" y="264">发布 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">1500 万元</tspan> 场景机会清单：</text>
      <text x="40" y="312" fill="#141414">网箱巡检 · 设施打捞 · 生态监测 · 渔获捕捞</text>
    </g>
    <text x="40" y="378" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">真题真做 · 场景引路</text>

    <!-- 订单牵引 -->
    <rect x="870" y="70" width="790" height="340" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="910" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">超 1 亿元潜在订单</text>
    <line x1="910" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="910" y="240" font-family="JetBrains Mono" font-size="72" font-weight="500" fill="#1F4E79">&gt;1<tspan font-size="34"> 亿元</tspan></text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="910" y="312">广东全省 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">17 个</tspan> 海洋牧场一级开发主体</text>
      <text x="910" y="360">倒推研发：不是实验室做完再找市场，</text>
      <text x="910" y="400">是拿着<tspan font-weight="500" fill="#1F4E79">真实刚需与订单</tspan>倒逼产品成型</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="470" x2="1660" y2="470" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="530" font-family="Noto Sans SC" font-size="27" fill="#55534E">真题真做，订单牵引——<tspan font-weight="500" fill="#1F4E79">海洋装备正在从「找场景」走向「被场景抢」</tspan>。</text>
  </svg>

  <p class="foot">拿着真实需求倒推研发——<b>真题真做，订单牵引</b>。</p>
</body>
</html>
