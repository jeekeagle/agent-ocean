<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>数据飞轮</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">数据飞轮</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">DATA FLYWHEEL · BASE 03</text>

    <!-- 三节点闭环 -->
    <rect x="640" y="60" width="380" height="100" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="830" y="120" text-anchor="middle" font-family="Noto Sans SC" font-size="28" fill="#141414">干活（会失败）</text>

    <rect x="150" y="320" width="380" height="100" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="340" y="380" text-anchor="middle" font-family="Noto Sans SC" font-size="28" fill="#141414">失败数据回流</text>

    <rect x="1130" y="320" width="380" height="100" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1320" y="380" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">下一轮更准</text>

    <!-- 环路箭头 -->
    <path d="M830 160 C 830 230, 560 250, 460 315" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M446 326 L 466 308 L 472 330 Z" fill="#B9B7AF"/>
    <line x1="530" y1="370" x2="1120" y2="370" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M1134 370 L 1110 360 L 1110 380 Z" fill="#B9B7AF"/>
    <path d="M1210 315 C 1110 250, 850 230, 836 168" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <path d="M832 154 L 828 178 L 812 162 Z" fill="#1F4E79"/>

    <!-- 反常识框 -->
    <rect x="0" y="470" width="1660" height="90" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="40" y="526" font-family="Noto Sans SC" font-size="27" fill="#55534E">反常识：最值钱的不是成功，是<tspan font-weight="500" fill="#1F4E79">失败</tspan>——失败才告诉你<tspan font-weight="500" fill="#141414">什么时候不确定、该怎么自救</tspan>。</text>
  </svg>

  <p class="foot">成功告诉你怎么做对，<b>失败才告诉你怎么自救</b>。</p>
</body>
</html>
