<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>具身定义</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">具身定义</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">EMBODIED AI · DEFINITION &amp; METAPHOR</text>

    <!-- 公式条 -->
    <rect x="0" y="70" width="1660" height="130" rx="4" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="830" y="152" text-anchor="middle" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">具身智能 = <tspan fill="#1F4E79">有了身体</tspan>的人工智能</text>

    <!-- 比喻对比 -->
    <rect x="0" y="240" width="770" height="230" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="296" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">传统大模型</text>
    <line x1="40" y1="320" x2="730" y2="320" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="376" font-family="Noto Sans SC" font-size="26" fill="#55534E">在屏幕里给你打一段话——</text>
    <text x="40" y="424" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">文字上的安慰</text>

    <line x1="810" y1="355" x2="850" y2="355" stroke="#B9B7AF" stroke-width="2"/>
    <text x="830" y="360" text-anchor="middle" font-family="JetBrains Mono" font-size="24" fill="#9B998F">VS</text>

    <rect x="890" y="240" width="770" height="230" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="296" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">具身智能产品</text>
    <line x1="930" y1="320" x2="1620" y2="320" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="376" font-family="Noto Sans SC" font-size="26" fill="#55534E">在现实世界里给你——</text>
    <text x="930" y="424" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">一个真实的拥抱</text>

    <!-- 底部动作 -->
    <line x1="0" y1="510" x2="1660" y2="510" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="566" font-family="Noto Sans SC" font-size="27" fill="#55534E">搬箱子 · 分拣货物 · <tspan font-weight="500" fill="#1F4E79">下水作业</tspan>——必须在物理世界里拥有作用力。</text>
  </svg>

  <p class="foot">大模型给你一段话，具身智能给你<b>一个真实的拥抱</b>。</p>
</body>
</html>
