<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>国家战略</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">国家战略</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">POLICY TIMELINE &amp; NATIONAL STRATEGY</text>

    <!-- 2025 -->
    <rect x="0" y="80" width="500" height="340" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="146" font-family="JetBrains Mono" font-size="38" font-weight="500" fill="#141414">2025</text>
    <text x="40" y="196" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">首次写入《政府工作报告》</text>
    <line x1="40" y1="222" x2="460" y2="222" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <text x="40" y="274">从学术概念 → <tspan font-weight="500" fill="#141414">国家战略</tspan></text>
      <text x="40" y="324">同年入选《咬文嚼字》</text>
      <text x="40" y="364">年度十大流行语 · <tspan font-weight="500" fill="#1F4E79">第 2 位</tspan></text>
      <text x="40" y="404" fill="#9B998F">技术词进入全社会语境</text>
    </g>

    <line x1="535" y1="250" x2="575" y2="250" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M589 250 L 567 239 L 567 261 Z" fill="#B9B7AF"/>

    <!-- 2026 -->
    <rect x="610" y="80" width="500" height="340" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="650" y="146" font-family="JetBrains Mono" font-size="38" font-weight="500" fill="#1F4E79">2026</text>
    <text x="650" y="196" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">再次重点强调 · 前瞻布局</text>
    <line x1="650" y1="222" x2="1070" y2="222" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <text x="650" y="274">与三大顶尖未来产业并列：</text>
      <text x="650" y="324"><tspan font-weight="500" fill="#141414">量子科技 · 脑机接口 · 6G</tspan></text>
      <text x="650" y="380">列入国家前瞻布局的</text>
      <text x="650" y="416" font-weight="500" fill="#1F4E79">未来产业核心矩阵</text>
    </g>

    <!-- 专项行动 -->
    <rect x="1150" y="80" width="510" height="340" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="1190" y="146" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#141414">ACTION PLAN</text>
    <text x="1190" y="196" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#141414">实景实训专项行动</text>
    <line x1="1190" y1="222" x2="1620" y2="222" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <text x="1190" y="274">工信部 × 国务院国资委启动</text>
      <text x="1190" y="324">聚焦<tspan font-weight="500" fill="#141414">工业 · 服务 · 特种</tspan>重点场景</text>
      <text x="1190" y="380">目标到 2026 年底</text>
      <text x="1190" y="416">凝练 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">100+</tspan> 高价值应用场景</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Sans SC" font-size="27" fill="#55534E">从顶层战略、流行语到部委专项行动——<tspan font-weight="500" fill="#1F4E79">具身智能已进入国家前瞻布局的核心阵地</tspan>。</text>
  </svg>

  <p class="foot">这不是某一家企业在押注，是<b>一个国家在布局</b>。</p>
</body>
</html>
