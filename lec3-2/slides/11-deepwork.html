<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>深海重装</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">深海重装</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">APPLICATION 02 · 4500M HEAVY WORK-CLASS ROV</text>

    <!-- 09.28 首批量产 -->
    <rect x="0" y="70" width="790" height="330" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#141414">09.28 · 威海</text>
    <text x="210" y="132" font-family="Noto Sans SC" font-size="24" fill="#55534E">吊装登船奔赴南海</text>
    <line x1="40" y1="158" x2="750" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="226" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">2 × 4500 米级深海机器人</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="286">国内首批<tspan font-weight="500" fill="#141414">量产</tspan>重型工作级深海机器人</text>
      <text x="40" y="334">150 马力 / 250 马力 · 上万种零部件国产化</text>
      <text x="40" y="378" fill="#9B998F">山东未来机器人 × 哈工大（威海）</text>
    </g>

    <!-- 10.08 订单与资本 -->
    <rect x="870" y="70" width="790" height="330" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="910" y="132" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#1F4E79">10.08 · 订单与资本</text>
    <text x="1170" y="132" font-family="Noto Sans SC" font-size="24" fill="#55534E">十天后传来两条消息</text>
    <line x1="910" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="910" y="226">深海智人：新签 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">8 台</tspan> 工作级 ROV</text>
      <text x="910" y="274">合同总金额 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">3 亿元</tspan>（南美 · 东南亚）</text>
      <text x="910" y="338">卫澜深海：深创投等进入新一轮股东</text>
      <text x="910" y="382">过去 <tspan font-family="JetBrains Mono" font-weight="500" fill="#141414">9 个月</tspan> 密集完成 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">5 轮</tspan> 融资</text>
    </g>

    <!-- 底部结论 -->
    <line x1="0" y1="460" x2="1660" y2="460" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="520" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">造得出来</text>
    <text x="220" y="520" font-family="JetBrains Mono" font-size="28" fill="#1F4E79">×</text>
    <text x="290" y="520" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">真实有用</text>
    <text x="0" y="576" font-family="Noto Sans SC" font-size="26" fill="#55534E">一边是资本在加码，一边是装备开始接真实的活儿。</text>
  </svg>

  <p class="foot">深海机器人同时跨过两道门槛：<b>造得出来，和真实有用</b>。</p>
</body>
</html>
