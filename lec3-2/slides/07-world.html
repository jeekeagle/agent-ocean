<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>世界模型</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">世界模型</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WORLD MODEL · BASE 02</text>

    <!-- 左右 -->
    <rect x="0" y="70" width="770" height="300" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">过去 · 干了再说</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="252" font-family="Noto Sans SC" font-size="26" fill="#55534E">直接执行动作</text>
    <text x="40" y="310" font-family="Noto Sans SC" font-size="26" fill="#55534E">撞了才知道会撞</text>
    <text x="40" y="368" font-family="Noto Sans SC" font-size="26" fill="#55534E">坏了才知道会坏</text>

    <text x="830" y="235" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#9B998F">VS</text>

    <rect x="890" y="70" width="770" height="300" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">现在 · 脑子里先过一遍</text>
    <line x1="930" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="26" fill="#55534E">
      <text x="930" y="216">动作之前，先模拟一遍：</text>
      <text x="930" y="272">这一步下去，会不会撞到东西？</text>
      <text x="930" y="328">会不会把东西弄坏？</text>
    </g>
    <text x="930" y="380" font-family="Noto Serif SC" font-weight="600" font-size="26" fill="#1F4E79">预判后果，再出手</text>

    <!-- 底部 -->
    <line x1="0" y1="430" x2="1660" y2="430" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="500" font-family="Noto Sans SC" font-size="27" fill="#55534E">人做事之前会在脑子里过一遍——<tspan font-weight="500" fill="#141414">世界模型，就是机器的这一遍</tspan>。</text>
  </svg>

  <p class="foot">行动之前先预判后果——世界模型解决的是<b>「干之前想清楚」</b>。</p>
</body>
</html>
