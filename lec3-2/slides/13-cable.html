<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>海底电缆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">海底电缆</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">APPLICATION 04 · SUBSEA CABLE BURIAL</text>

    <!-- 06.15 现场 -->
    <rect x="0" y="70" width="790" height="340" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="JetBrains Mono" font-size="26" font-weight="500" fill="#141414">06.15 · 渤海上风电海域</text>
    <line x1="40" y1="158" x2="750" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="226" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">找裸缆 → 稳稳埋入泥沙</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="286">大连交通大学科研团队作业现场</text>
      <text x="40" y="334">融合<tspan font-weight="500" fill="#141414">电磁探测 · 声呐感知 · 机器人控制</tspan></text>
      <text x="40" y="380">完全自主知识产权 · <tspan font-weight="500" fill="#1F4E79">打破国外垄断</tspan></text>
    </g>

    <!-- 右侧：工程清单 -->
    <rect x="870" y="70" width="790" height="340" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="910" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">国家重点工程落地</text>
    <line x1="910" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="910" y="226">海南文昌国际光缆</text>
      <text x="910" y="278">浙江南麂岛海缆</text>
      <text x="910" y="330">广东海上风电海缆敷设与保护</text>
      <text x="910" y="382" fill="#1F4E79">填补复杂海况下协同作业空白</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="470" x2="1660" y2="470" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="530" font-family="Noto Sans SC" font-size="27" fill="#55534E">高校自研核心算法 + 重大工程真实海试——<tspan font-weight="500" fill="#1F4E79">复杂海况下水下机器人的硬仗打通了</tspan>。</text>
  </svg>

  <p class="foot">填补复杂海况协同作业空白——<b>国际光缆用上国产机器人</b>。</p>
</body>
</html>
