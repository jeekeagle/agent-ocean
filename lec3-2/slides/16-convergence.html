<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>双线交汇</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">双线交汇</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">AI + EMBODIED AI · THE COMPLETE ANSWER</text>

    <!-- 两条线总结 -->
    <rect x="0" y="70" width="770" height="230" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#141414">人工智能 · 降感知的秩</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="240" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#141414">把海看清楚</text>
    <text x="40" y="280" font-family="Noto Sans SC" font-size="25" fill="#55534E">在岸上算</text>

    <!-- 加号 -->
    <text x="830" y="200" text-anchor="middle" font-family="JetBrains Mono" font-size="40" fill="#1F4E79">+</text>

    <rect x="890" y="70" width="770" height="230" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">具身智能 · 降行动的秩</text>
    <line x1="930" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="240" font-family="Noto Serif SC" font-weight="700" font-size="44" fill="#1F4E79">把活接过去</text>
    <text x="930" y="280" font-family="Noto Sans SC" font-size="25" fill="#55534E">在水里干</text>

    <!-- 等于 -->
    <rect x="0" y="340" width="1660" height="110" rx="4" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="60" y="410" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">= 约束，就是这么被<tspan fill="#1F4E79">迁移走的</tspan></text>

    <!-- 底部海洋产业朴素法则 -->
    <line x1="0" y1="490" x2="1660" y2="490" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="27" fill="#55534E">在陆地上，你可以先有聪明的大脑慢慢配身体；在海里，你得<tspan font-weight="500" fill="#141414">先活着，再谈聪明</tspan>。</text>
  </svg>

  <p class="foot">海洋产业最朴素的地方：<b>它不认概念，只认能不能干成</b>。</p>
</body>
</html>
