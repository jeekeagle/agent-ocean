<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>网箱清洗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">网箱清洗</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">APPLICATION 01 · SENKETE · CAGE NET CLEANING</text>

    <rect x="0" y="70" width="800" height="380" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">水下网衣清洗机器人</text>
    <line x1="40" y1="158" x2="760" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="250" font-family="JetBrains Mono" font-size="76" font-weight="500" fill="#1F4E79">&gt;95%</text>
    <text x="40" y="316" font-family="Noto Sans SC" font-size="26" fill="#141414">国内深远海养殖网箱清洗市场份额</text>
    <text x="40" y="364" font-family="Noto Sans SC" font-size="25" fill="#55534E">青岛森科特 ·「90 后」硕士团队 · 五年攻克打破国外垄断</text>
    <text x="40" y="412" font-family="Noto Sans SC" font-size="24" fill="#9B998F">贝类 · 藤壶 · 藻类附着，不再依赖潜水员人工清洗</text>

    <!-- 右侧数鱼器 -->
    <rect x="860" y="70" width="800" height="380" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="900" y="132" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#141414">水下「数鱼器」</text>
    <line x1="900" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <g>
      <text x="900" y="250" font-family="JetBrains Mono" font-size="64" font-weight="500" fill="#141414">98%–99%</text>
      <text x="900" y="300" font-family="Noto Sans SC" font-size="25" fill="#55534E">计数准确率</text>
      <text x="1280" y="250" font-family="JetBrains Mono" font-size="64" font-weight="500" fill="#1F4E79">30万<tspan font-size="30"> 尾</tspan></text>
      <text x="1280" y="300" font-family="Noto Sans SC" font-size="25" fill="#55534E">1 小时数鱼量</text>
    </g>
    <text x="900" y="380" font-family="Noto Sans SC" font-size="25" fill="#55534E">机器既做重体力的网衣清洗，</text>
    <text x="900" y="424" font-family="Noto Sans SC" font-size="25" fill="#55534E">也做精细的水下生物视觉计数。</text>

    <!-- 底部 -->
    <line x1="0" y1="500" x2="1660" y2="500" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="556" font-family="Noto Sans SC" font-size="27" fill="#55534E">不仅替代潜水员的危险重体力，<tspan font-weight="500" fill="#1F4E79">把整个深海养殖的作业标准做成了标品</tspan>。</text>
  </svg>

  <p class="foot">市场份额超过 95%——<b>清洗与数鱼，两样活都接了</b>。</p>
</body>
</html>
