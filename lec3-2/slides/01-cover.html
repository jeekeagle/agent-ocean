<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>把活接过去</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    row-gap: 28px;
  }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 21px; letter-spacing: 0.26em; color: #1F4E79; text-transform: uppercase; }
  h1 { font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 130px; line-height: 1.12; letter-spacing: 0.02em; color: #141414; }
  .title-en { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: 0.28em; color: #6E6E6E; text-transform: uppercase; }
  svg.figure { display: block; }
  .subtitle { font-size: 28px; font-weight: 300; color: #55534E; line-height: 1.7; text-align: center; }
  .rule { width: 120px; height: 3px; background: #1F4E79; }
</style>
</head>
<body>
  <div class="center">
    <div class="eyebrow">Embodied AI · Taking over the Work</div>
    <h1>把活接过去</h1>
    <div class="title-en">Module 3.2</div>

    <!-- 三段路线图：国势 → 技术 → 海洋现场 -->
    <svg class="figure" width="1620" height="320" viewBox="0 0 1620 320" fill="none">
      <!-- 01 国势 -->
      <rect x="0" y="20" width="480" height="280" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="40" y="82" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">01 · NATIONAL POSTURE</text>
      <text x="40" y="142" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">具身国势</text>
      <line x1="40" y1="166" x2="440" y2="166" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="40" y="218" font-family="Noto Sans SC" font-size="25" fill="#55534E">2025 入报告 · 2026 前瞻布局</text>
      <text x="40" y="264" font-family="Noto Sans SC" font-size="25" fill="#55534E">一个国家在布局</text>

      <!-- 箭头 -->
      <line x1="495" y1="160" x2="555" y2="160" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M567 160 L 549 150 L 549 170 Z" fill="#B9B7AF"/>

      <!-- 02 技术 -->
      <rect x="570" y="20" width="480" height="280" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="610" y="82" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">02 · THREE BASES</text>
      <text x="610" y="142" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#141414">技术底座</text>
      <line x1="610" y1="166" x2="1010" y2="166" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="610" y="218" font-family="Noto Sans SC" font-size="25" fill="#55534E">VLA 自主动作 · 世界模型预判</text>
      <text x="610" y="264" font-family="Noto Sans SC" font-size="25" fill="#55534E">数据飞轮，失败比成功更值钱</text>

      <!-- 箭头 -->
      <line x1="1065" y1="160" x2="1125" y2="160" stroke="#1F4E79" stroke-width="3"/>
      <path d="M1137 160 L 1119 150 L 1119 170 Z" fill="#1F4E79"/>

      <!-- 03 海洋 -->
      <rect x="1140" y="20" width="480" height="280" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="1180" y="82" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">03 · OCEAN FIRST</text>
      <text x="1180" y="142" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">海洋现场</text>
      <line x1="1180" y1="166" x2="1580" y2="166" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="1180" y="218" font-family="Noto Sans SC" font-size="25" fill="#55534E">先身后脑 · 五类场景</text>
      <text x="1180" y="264" font-family="Noto Sans SC" font-size="25" fill="#55534E">已经在接真实的活</text>
    </svg>

    <p class="subtitle">具身智能——从看清楚到把活干了，有了身体的人工智能，正在接管海洋现场。</p>
    <div class="rule"></div>
  </div>
</body>
</html>
