<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>路径反置</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">路径反置</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">LAND VS OCEAN · ORDER INVERTED</text>

    <!-- 陆地 -->
    <rect x="0" y="70" width="770" height="240" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="130" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#55534E">陆地具身智能</text>
    <line x1="40" y1="156" x2="730" y2="156" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="220" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#55534E">先有大脑</text>
    <line x1="220" y1="210" x2="280" y2="210" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M294 210 L 272 200 L 272 220 Z" fill="#B9B7AF"/>
    <text x="320" y="220" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#55534E">再配身体</text>
    <text x="40" y="278" font-family="Noto Sans SC" font-size="24" fill="#9B998F">首先解决「聪不聪明」· 还在争论能不能进家庭</text>

    <!-- 海洋 -->
    <rect x="890" y="70" width="770" height="240" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="130" font-family="Noto Serif SC" font-weight="700" font-size="30" fill="#1F4E79">海洋具身智能</text>
    <line x1="930" y1="156" x2="1620" y2="156" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="220" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">先做身体</text>
    <line x1="1110" y1="210" x2="1170" y2="210" stroke="#1F4E79" stroke-width="2.5"/>
    <path d="M1184 210 L 1162 200 L 1162 220 Z" fill="#1F4E79"/>
    <text x="1210" y="220" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">再配大脑</text>
    <text x="930" y="278" font-family="Noto Sans SC" font-size="24" fill="#55534E">首先解决「能不能活着待在下面」· 已经在接真实的活</text>

    <!-- 原因 -->
    <rect x="0" y="340" width="1660" height="110" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="405" font-family="Noto Sans SC" font-size="25" fill="#55534E">海里约束太硬：无卫星信号 · 通信衰减 · 能见度多变 · 障碍物密集 · 水流扰动 · 深海高压 · 设备密封</text>

    <!-- 结论 -->
    <rect x="0" y="480" width="1660" height="80" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="40" y="532" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">反过来的结果：海洋具身智能的落地，反而比陆地更实在。</text>
  </svg>

  <p class="foot">先做身体、再配大脑——海洋具身智能<b>反而比陆地更实在</b>。</p>
</body>
</html>
