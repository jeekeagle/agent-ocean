<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>资本逻辑</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">资本逻辑</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">VC LOGIC · SCENE ADAPTATION VS CONSTRAINT BREAK</text>

    <!-- 左：地面人形 -->
    <rect x="0" y="70" width="770" height="300" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="40" y="132" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#55534E">地面 · 人形机器人</text>
    <line x1="40" y1="158" x2="730" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="40" y="226" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#55534E">场景适配</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="40" y="286">在人类环境中替代人</text>
      <text x="40" y="334">跟别人<tspan font-weight="500" fill="#141414">抢同一块地</tspan></text>
      <text x="40" y="380" fill="#9B998F">200 家公司差异太小 · 竞争极其拥挤</text>
    </g>

    <!-- 中间 VS -->
    <text x="830" y="235" text-anchor="middle" font-family="JetBrains Mono" font-size="30" fill="#9B998F">VS</text>

    <!-- 右：水下 -->
    <rect x="890" y="70" width="770" height="300" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="930" y="132" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">水下 · 具身机器人</text>
    <line x1="930" y1="158" x2="1620" y2="158" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="930" y="226" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">约束突破</text>
    <g font-family="Noto Sans SC" font-size="25" fill="#55534E">
      <text x="930" y="286">在人类到不了的环境中替代人</text>
      <text x="930" y="334">开一块<tspan font-weight="500" fill="#1F4E79">没人到过的新地</tspan></text>
      <text x="930" y="380" fill="#1F4E79">朱啸虎重注世航智能：重新定义海洋</text>
    </g>

    <!-- 底部资本流向 -->
    <line x1="0" y1="430" x2="1660" y2="430" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="500" font-family="Noto Sans SC" font-size="27" fill="#55534E">资本的钱，正在从地面最拥挤的赛道，批量流向<tspan font-weight="500" fill="#1F4E79">人类根本到不了的地方</tspan>——水下、太空。</text>
  </svg>

  <p class="foot">场景适配是抢同一块地，<b>约束突破是开一片新地</b>。</p>
</body>
</html>
