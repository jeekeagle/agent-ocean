<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产业热度</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; padding-top: 96px; }
  .assertion { margin: 0 130px; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
</head>
<body>
  <p class="assertion">产业热度</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">2026 H1 · EMBODIED AI MARKET STATS</text>

    <!-- 四格数据卡片 -->
    <g>
      <rect x="0" y="70" width="390" height="260" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="40" y="170" font-family="JetBrains Mono" font-size="60" font-weight="500" fill="#1F4E79">4万+<tspan font-size="26"> 台</tspan></text>
      <text x="40" y="240" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">中国人形机器人出货</text>
      <text x="40" y="284" font-family="Noto Sans SC" font-size="24" fill="#55534E">全球占比 <tspan font-family="JetBrains Mono" font-weight="500" fill="#1F4E79">97%</tspan></text>

      <rect x="420" y="70" width="390" height="260" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="460" y="170" font-family="JetBrains Mono" font-size="60" font-weight="500" fill="#1F4E79">900+<tspan font-size="26"> 亿</tspan></text>
      <text x="460" y="240" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">上半年国内融资总额</text>
      <text x="460" y="284" font-family="Noto Sans SC" font-size="24" fill="#55534E">同比 2025 <tspan font-weight="500" fill="#141414">倍数级提升</tspan></text>

      <rect x="840" y="70" width="390" height="260" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="880" y="170" font-family="JetBrains Mono" font-size="60" font-weight="500" fill="#1F4E79">140+ / 330+</text>
      <text x="880" y="240" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">整机企业 / 发布产品</text>
      <text x="880" y="284" font-family="Noto Sans SC" font-size="24" fill="#55534E">产品发布超 330 款</text>

      <rect x="1260" y="70" width="400" height="260" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="1300" y="170" font-family="JetBrains Mono" font-size="60" font-weight="500" fill="#1F4E79">73%</text>
      <text x="1300" y="240" font-family="Noto Serif SC" font-weight="700" font-size="28" fill="#1F4E79">未来五年复合增长率</text>
      <text x="1300" y="284" font-family="Noto Sans SC" font-size="24" fill="#55534E">全球具身智能市场</text>
    </g>

    <!-- 底部 -->
    <line x1="0" y1="390" x2="1660" y2="390" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="456" font-family="Noto Sans SC" font-size="27" fill="#55534E">出货、融资、产品、增速——四个维度同时放量，赛道已成共识。</text>
  </svg>

  <p class="foot">四个维度同时放量——具身智能<b>已成产业共识</b>。</p>
</body>
</html>
