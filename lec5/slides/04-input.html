<div class="page">
<p class="title">输入的性质</p>

<svg class="figure" width="1660" height="450" viewBox="0 0 1660 450" fill="none" font-family="Noto Sans SC">
  <text x="0" y="40" font-size="24" fill="#9B998F">使用人工智能之前，先确认一件事</text>

  <!-- 两分支 -->
  <rect x="0" y="90" width="760" height="130" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="40" y="146" font-size="27" font-weight="500" fill="#1F4E79">有效信息 → 放大优势</text>
  <text x="40" y="192" font-size="23" fill="#55534E">你对行业有认知，它帮你把认知变成工具</text>

  <rect x="0" y="250" width="760" height="130" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="306" font-size="27" font-weight="500" fill="#141414">无效信息 → 放大错误</text>
  <text x="40" y="352" font-size="23" fill="#55534E">完整而空洞，反而更难察觉</text>

  <!-- 结论 -->
  <line x1="790" y1="90" x2="790" y2="380" stroke="#E8E6E1" stroke-width="1"/>
  <text x="860" y="150" font-size="30" font-weight="500" fill="#1F4E79">使用人工智能，本身构成一项能力</text>
  <text x="860" y="210" font-size="24" fill="#55534E">它不是一学即会的工具，</text>
  <text x="860" y="252" font-size="24" fill="#55534E">而是一项需要反复练习的能力。</text>
  <text x="860" y="310" font-size="24" fill="#55534E">这项能力的高低，决定放大器</text>
  <text x="860" y="352" font-size="24" fill="#55534E">放出的是<tspan fill="#1F4E79" font-weight="500">优势，还是劣势</tspan>。</text>
  <line x1="860" y1="396" x2="1420" y2="396" stroke="#1F4E79" stroke-width="2"/>
  <path d="M1432 396 L1412 385 L1412 407 Z" fill="#1F4E79"/>
  <text x="1452" y="404" font-size="23" font-weight="500" fill="#1F4E79">后四条方法</text>
</svg>

<p class="foot">先管住<b>输入</b>，再谈使用——这是第一个结论。</p>
