<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P10 · 演示四步</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:46px}
.foot{margin-top:26px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.course-badge{position:absolute;top:72px;right:130px;z-index:60;display:flex;align-items:center;gap:13px}
.course-badge .cb-text{font-size:22px;font-weight:500;color:#9B998F;letter-spacing:.06em;white-space:nowrap}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>

<div class="page">
<p class="title">演示四步</p>

<svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="24" fill="#9B998F">现场演示 · 一节课的课件怎么做出来（以本讲为例）</text>

  <!-- 第一步 -->
  <rect x="0" y="86" width="385" height="340" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="34" y="144" font-family="JetBrains Mono" font-size="22" fill="#9B998F">STEP 01</text>
  <text x="34" y="200" font-size="28" font-weight="500" fill="#141414">给素材</text>
  <text x="34" y="254" font-size="23" fill="#55534E">一段讲稿给 AI，</text>
  <text x="34" y="294" font-size="23" fill="#55534E">只要求提炼三个判断，</text>
  <text x="34" y="334" font-size="23" fill="#55534E">不扩写、不补充。</text>
  <text x="34" y="392" font-size="22" fill="#1F4E79">先做减法</text>

  <!-- 第二步 -->
  <rect x="425" y="86" width="385" height="340" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="459" y="144" font-family="JetBrains Mono" font-size="22" fill="#9B998F">STEP 02</text>
  <text x="459" y="200" font-size="28" font-weight="500" fill="#141414">要骨架</text>
  <text x="459" y="254" font-size="23" fill="#55534E">按页输出：标题、</text>
  <text x="459" y="294" font-size="23" fill="#55534E">三四条要点、配图方向，</text>
  <text x="459" y="334" font-size="23" fill="#55534E">先不管版式。</text>
  <text x="459" y="392" font-size="22" fill="#1F4E79">得到逐页清单</text>

  <!-- 第三步 -->
  <rect x="850" y="86" width="385" height="340" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="884" y="144" font-family="JetBrains Mono" font-size="22" fill="#9B998F">STEP 03</text>
  <text x="884" y="200" font-size="28" font-weight="500" fill="#141414">挑一页做细</text>
  <text x="884" y="254" font-size="23" fill="#55534E">标题压到 15 字内，</text>
  <text x="884" y="294" font-size="23" fill="#55534E">每页不超四行，</text>
  <text x="884" y="334" font-size="23" fill="#55534E">每行不超 20 字。</text>
  <text x="884" y="392" font-size="22" fill="#1F4E79">给硬约束</text>

  <!-- 第四步 -->
  <rect x="1275" y="86" width="385" height="340" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="1309" y="144" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">STEP 04</text>
  <text x="1309" y="200" font-size="28" font-weight="500" fill="#1F4E79">迭代</text>
  <text x="1309" y="254" font-size="23" fill="#55534E">指出问题：要点过长、</text>
  <text x="1309" y="294" font-size="23" fill="#55534E">配图不贴，要求改，</text>
  <text x="1309" y="334" font-size="23" fill="#55534E">通常两三轮可用。</text>
  <text x="1309" y="392" font-size="22" fill="#1F4E79">到可用状态</text>

  <line x1="385" y1="256" x2="425" y2="256" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M425 256 L407 246 L407 266 Z" fill="#B9B7AF"/>
  <line x1="810" y1="256" x2="850" y2="256" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M850 256 L832 246 L832 266 Z" fill="#B9B7AF"/>
  <line x1="1235" y1="256" x2="1275" y2="256" stroke="#1F4E79" stroke-width="3"/>
  <path d="M1275 256 L1257 245 L1257 267 Z" fill="#1F4E79"/>

  <!-- 底部 -->
  <line x1="0" y1="476" x2="1660" y2="476" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="534" font-size="26" fill="#55534E">第一步让 AI 先做减法——很多人上来就「帮我写一段」，</text>
  <text x="0" y="580" font-size="26" fill="#141414">结果得到<tspan fill="#55534E">看似完整、实则空洞</tspan>的话；反过来先让它读、让它提炼，效果完全不同。</text>
</svg>

<p class="foot">四步走完，注意一件事：<b>人做了三次判断介入</b>。</p>
</div>

<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
</body>
</html>
