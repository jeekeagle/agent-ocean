<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P08 · 反向检验</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:46px}
.foot{margin-top:26px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.course-badge{position:absolute;top:72px;right:130px;z-index:60;display:flex;align-items:center;gap:13px}
.course-badge .cb-text{font-size:22px;font-weight:500;color:#9B998F;letter-spacing:.06em;white-space:nowrap}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>

<div class="page">
<p class="title">反向检验</p>

<svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="24" fill="#9B998F">前三条让 AI 承担工作 · 这一条让它帮你找问题</text>

  <!-- 三用法 -->
  <rect x="0" y="80" width="510" height="300" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="140" font-family="JetBrains Mono" font-size="22" fill="#9B998F">用法 01</text>
  <text x="40" y="196" font-size="30" font-weight="500" fill="#141414">请它反驳</text>
  <text x="40" y="250" font-size="23" fill="#55534E">「我这个判断，</text>
  <text x="40" y="290" font-size="23" fill="#55534E">最可能错在哪里？」</text>
  <text x="40" y="344" font-size="23" fill="#1F4E79">让它给相反观点</text>

  <rect x="575" y="80" width="510" height="300" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="615" y="140" font-family="JetBrains Mono" font-size="22" fill="#9B998F">用法 02</text>
  <text x="615" y="196" font-size="30" font-weight="500" fill="#141414">换它立场</text>
  <text x="615" y="250" font-size="23" fill="#55534E">做养殖，让它扮收购方；</text>
  <text x="615" y="290" font-size="23" fill="#55534E">做技术，让它扮船长。</text>
  <text x="615" y="344" font-size="23" fill="#1F4E79">盲区就显出来了</text>

  <rect x="1150" y="80" width="510" height="300" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="1190" y="140" font-family="JetBrains Mono" font-size="22" fill="#9B998F">用法 03</text>
  <text x="1190" y="196" font-size="30" font-weight="500" fill="#141414">请它评分</text>
  <text x="1190" y="250" font-size="23" fill="#55534E">你出方案，</text>
  <text x="1190" y="290" font-size="23" fill="#55534E">它给分与扣分点。</text>
  <text x="1190" y="344" font-size="23" fill="#1F4E79">自评方法反着用</text>

  <line x1="510" y1="230" x2="575" y2="230" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M575 230 L557 220 L557 240 Z" fill="#B9B7AF"/>
  <line x1="1085" y1="230" x2="1150" y2="230" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M1150 230 L1132 220 L1132 240 Z" fill="#B9B7AF"/>

  <!-- 底部：为什么单独一条 -->
  <line x1="0" y1="430" x2="1660" y2="430" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="490" font-size="26" fill="#55534E">单独列出这一条，是因为最大的风险不在于<tspan fill="#141414" font-weight="500">它出错</tspan>，</text>
  <text x="0" y="536" font-size="26" fill="#141414">而在于<tspan fill="#1F4E79" font-weight="500">使用者不再独立思考</tspan>——判断、决策、拍板，必须自己来。</text>
  <text x="0" y="584" font-size="24" fill="#9B998F">以 AI 为对手，而不以它为答案。</text>
</svg>

<p class="foot">AI 越强，越要<b>留一部分工作给自己做</b>。</p>
</div>

<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
</body>
</html>
