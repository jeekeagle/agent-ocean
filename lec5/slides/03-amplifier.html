<div class="page">
<p class="title">能力放大器</p>

<svg class="figure" width="1660" height="500" viewBox="0 0 1660 500" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="26" fill="#55534E">「不是说工具强，我们就越强；<tspan fill="#1F4E79" font-weight="500">工具越强，对我们的要求就越高</tspan>。」—— 罗振宇跨年演讲</text>

  <!-- 有效输入 -->
  <rect x="0" y="90" width="430" height="120" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="142" font-size="25" font-weight="500" fill="#141414">输入 · 有效信息</text>
  <text x="40" y="184" font-size="22" fill="#9B998F">有认知的人，像输入音乐</text>
  <line x1="442" y1="150" x2="508" y2="150" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M518 150 L500 140 L500 160 Z" fill="#B9B7AF"/>
  <path d="M530 100 L700 150 L530 200 Z" stroke="#1F4E79" stroke-width="3" fill="#1F4E79" fill-opacity="0.07" stroke-linejoin="round"/>
  <line x1="710" y1="150" x2="778" y2="150" stroke="#1F4E79" stroke-width="3"/>
  <path d="M790 150 L770 139 L770 161 Z" fill="#1F4E79"/>
  <rect x="800" y="90" width="860" height="120" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="840" y="142" font-size="25" font-weight="500" fill="#1F4E79">输出 · 更响的音乐</text>
  <text x="840" y="184" font-size="22" fill="#55534E">优势被放大——认知变成可用的工具</text>

  <!-- 无效输入 -->
  <rect x="0" y="250" width="430" height="120" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="302" font-size="25" font-weight="500" fill="#141414">输入 · 无效信息</text>
  <text x="40" y="344" font-size="22" fill="#9B998F">缺认知的人，像输入噪音</text>
  <line x1="442" y1="310" x2="508" y2="310" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M518 310 L500 300 L500 320 Z" fill="#B9B7AF"/>
  <path d="M530 260 L700 310 L530 360 Z" stroke="#1F4E79" stroke-width="3" fill="#1F4E79" fill-opacity="0.07" stroke-linejoin="round"/>
  <line x1="710" y1="310" x2="778" y2="310" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M790 310 L770 300 L770 320 Z" fill="#B9B7AF"/>
  <rect x="800" y="250" width="860" height="120" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="840" y="302" font-size="25" font-weight="500" fill="#141414">输出 · 更响的噪音</text>
  <text x="840" y="344" font-size="22" fill="#55534E">问题被放大——逻辑通顺、格式规范，很难分辨</text>

  <text x="615" y="234" text-anchor="middle" font-size="19" fill="#1F4E79">放大器</text>

  <line x1="0" y1="416" x2="1660" y2="416" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="468" font-size="25" fill="#141414">放大器只增大输入的幅度，<tspan fill="#1F4E79" font-weight="500">不改变信号的性质</tspan>——噪音不会因为放大，变成音乐。</text>
</svg>

<p class="foot">第二层更隐蔽：<b>它放大问题时，输出依然完美</b>。</p>
</div>
