<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P07 · 海洋封装示例</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:46px}
.foot{margin-top:26px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.course-badge{position:absolute;top:72px;right:130px;z-index:60;display:flex;align-items:center;gap:13px}
.course-badge .cb-text{font-size:22px;font-weight:500;color:#9B998F;letter-spacing:.06em;white-space:nowrap}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>

<div class="page">
<p class="title">海洋封装示例</p>

<svg class="figure" width="1660" height="590" viewBox="0 0 1660 590" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="24" fill="#9B998F">三个今天就能着手的方向</text>

  <!-- 巡检记录 -->
  <rect x="0" y="80" width="510" height="330" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="140" font-family="JetBrains Mono" font-size="22" fill="#9B998F">示例 01</text>
  <text x="40" y="196" font-size="30" font-weight="500" fill="#141414">巡检记录</text>
  <text x="40" y="250" font-size="23" fill="#55534E">每周都写 · 格式固定</text>
  <text x="40" y="294" font-size="23" fill="#55534E">把格式和要点整理成册。</text>
  <text x="40" y="350" font-size="23" fill="#1F4E79">口述现场情况 →</text>
  <text x="40" y="390" font-size="23" fill="#55534E">按格式生成记录</text>

  <!-- 情况汇报 -->
  <rect x="575" y="80" width="510" height="330" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="615" y="140" font-family="JetBrains Mono" font-size="22" fill="#9B998F">示例 02</text>
  <text x="615" y="196" font-size="30" font-weight="500" fill="#141414">情况汇报</text>
  <text x="615" y="250" font-size="23" fill="#55534E">固定口径 · 固定体例</text>
  <text x="615" y="294" font-size="23" fill="#55534E">把体例整理下来。</text>
  <text x="615" y="350" font-size="23" fill="#1F4E79">提供要点 →</text>
  <text x="615" y="390" font-size="23" fill="#55534E">按本单位规范成文</text>

  <!-- 判断规则 -->
  <rect x="1150" y="80" width="510" height="330" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="1190" y="140" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">示例 03 · 层次最深</text>
  <text x="1190" y="196" font-size="30" font-weight="500" fill="#1F4E79">判断规则</text>
  <text x="1190" y="250" font-size="23" fill="#55534E">什么条件必须停机、</text>
  <text x="1190" y="290" font-size="23" fill="#55534E">什么数据异常要上报、</text>
  <text x="1190" y="330" font-size="23" fill="#55534E">什么标准方可出塘。</text>
  <text x="1190" y="384" font-size="23" fill="#1F4E79">人不在现场，判断仍运转</text>

  <line x1="510" y1="245" x2="575" y2="245" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M575 245 L557 235 L557 255 Z" fill="#B9B7AF"/>
  <line x1="1085" y1="245" x2="1150" y2="245" stroke="#B9B7AF" stroke-width="2.5"/>
  <path d="M1150 245 L1132 235 L1132 255 Z" fill="#B9B7AF"/>

  <!-- 底部 -->
  <line x1="0" y1="470" x2="1660" y2="470" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="528" font-size="26" fill="#55534E">把多年积累的判断标准，转成<tspan fill="#141414" font-weight="500"> AI 能执行的规则</tspan>——</text>
  <text x="0" y="574" font-size="26" fill="#141414">个人经验就从<tspan fill="#55534E">只供自己用</tspan>，变成<tspan fill="#1F4E79" font-weight="500">可反复用、可供他人用</tspan>。</text>
</svg>

<p class="foot">这是四条方法里，<b>杠杆效应最明显</b>的一条。</p>
</div>

<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
</body>
</html>
