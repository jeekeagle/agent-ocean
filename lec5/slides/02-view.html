<div class="page">
<p class="title">视角的转换</p>

<svg class="figure" width="1660" height="500" viewBox="0 0 1660 500" fill="none" font-family="Noto Sans SC">
  <!-- 向外 -->
  <rect x="0" y="40" width="620" height="260" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="100" font-size="26" font-weight="500" fill="#141414">前四讲 · 视角向外</text>
  <text x="40" y="152" font-size="24" fill="#55534E">看时代如何变化</text>
  <text x="40" y="196" font-size="24" fill="#55534E">看产业受什么约束</text>
  <text x="40" y="240" font-size="24" fill="#55534E">看技术能够做什么</text>
  <text x="40" y="284" font-size="24" fill="#55534E">看他人走到哪一步</text>

  <!-- 箭头 -->
  <line x1="652" y1="170" x2="772" y2="170" stroke="#1F4E79" stroke-width="3"/>
  <path d="M784 170 L764 158 L764 182 Z" fill="#1F4E79"/>

  <!-- 向内 -->
  <rect x="816" y="40" width="844" height="260" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="856" y="100" font-size="26" font-weight="500" fill="#1F4E79">本讲 · 视角向内</text>
  <text x="856" y="158" font-size="27" fill="#141414">看在场每一位，明天走进岗位</text>

  <text x="856" y="258" font-size="22" fill="#9B998F">不讨论产业格局 · 技术原理 · 个人无法影响的事</text>

  <!-- 结构 -->
  <line x1="0" y1="352" x2="1660" y2="352" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="404" font-size="20" fill="#9B998F">第一条 · 认知</text>
  <text x="0" y="450" font-size="26" font-weight="500" fill="#141414">人工智能是能力的放大器</text>
  <line x1="545" y1="378" x2="545" y2="470" stroke="#E8E6E1" stroke-width="1"/>
  <text x="595" y="404" font-size="20" fill="#9B998F">后四条 · 方法</text>
  <text x="595" y="450" font-size="26" font-weight="500" fill="#141414">条条都能明天上手</text>
  <line x1="1115" y1="378" x2="1115" y2="470" stroke="#E8E6E1" stroke-width="1"/>
  <text x="1165" y="404" font-size="20" fill="#9B998F">结语之前</text>
  <text x="1165" y="450" font-size="26" font-weight="500" fill="#1F4E79">一次现场演示</text>
</svg>

<p class="foot">不讨论格局与原理，只讨论<b>自己能够动手</b>的部分。</p>
