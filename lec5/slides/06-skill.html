<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P06 · 经验封装</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:46px}
.foot{margin-top:26px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.course-badge{position:absolute;top:72px;right:130px;z-index:60;display:flex;align-items:center;gap:13px}
.course-badge .cb-text{font-size:22px;font-weight:500;color:#9B998F;letter-spacing:.06em;white-space:nowrap}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>

<div class="page">
<p class="title">经验封装</p>

<svg class="figure" width="1660" height="580" viewBox="0 0 1660 580" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="24" fill="#9B998F">海洋领域：从业者的经验，比 AI 的通用能力更有价值</text>

  <!-- 你的经验 -->
  <rect x="0" y="80" width="430" height="330" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="40" y="140" font-size="27" font-weight="500" fill="#141414">你的经验</text>
  <text x="40" y="196" font-size="23" fill="#55534E">本单位厂区的潮汐规律</text>
  <text x="40" y="240" font-size="23" fill="#55534E">某台设备的运行特点</text>
  <text x="40" y="284" font-size="23" fill="#55534E">哪批养殖对象怕哪种水温</text>
  <text x="40" y="350" font-size="22" fill="#9B998F">—— 通用大模型都不知道</text>

  <line x1="442" y1="245" x2="530" y2="245" stroke="#1F4E79" stroke-width="3"/>
  <path d="M542 245 L522 234 L522 256 Z" fill="#1F4E79"/>
  <text x="452" y="222" font-size="20" fill="#1F4E79">交出去</text>

  <!-- Skill 手册 -->
  <rect x="560" y="80" width="540" height="330" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="600" y="140" font-size="27" font-weight="500" fill="#1F4E79">Skill · 操作手册</text>
  <text x="600" y="196" font-size="23" fill="#55534E">① 目标是什么</text>
  <text x="600" y="240" font-size="23" fill="#55534E">② 分几步</text>
  <text x="600" y="284" font-size="23" fill="#55534E">③ 每步注意什么</text>
  <text x="600" y="328" font-size="23" fill="#55534E">④ 输出什么格式</text>
  <text x="600" y="380" font-size="22" font-weight="500" fill="#1F4E79">制作一次 · 长期使用</text>

  <line x1="1112" y1="245" x2="1200" y2="245" stroke="#1F4E79" stroke-width="3"/>
  <path d="M1212 245 L1192 234 L1192 256 Z" fill="#1F4E79"/>
  <text x="1122" y="222" font-size="20" fill="#1F4E79">同类任务</text>

  <!-- 结果 -->
  <rect x="1230" y="80" width="430" height="330" stroke="#141414" stroke-width="2" fill="none"/>
  <text x="1270" y="140" font-size="27" font-weight="500" fill="#141414">开箱即用</text>
  <text x="1270" y="196" font-size="23" fill="#55534E">遇同类任务，</text>
  <text x="1270" y="240" font-size="23" fill="#55534E">AI 按手册执行，</text>
  <text x="1270" y="284" font-size="23" fill="#55534E">稳定交付。</text>
  <text x="1270" y="350" font-size="22" fill="#9B998F">不是堆砌工具，</text>
  <text x="1270" y="384" font-size="22" fill="#9B998F">而是打包经验</text>

  <!-- 底部判断 -->
  <line x1="0" y1="466" x2="1660" y2="466" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="524" font-size="26" fill="#55534E">能力边界，不再由<tspan fill="#141414" font-weight="500">工具数量</tspan>决定，</text>
  <text x="0" y="570" font-size="26" fill="#141414">而由<tspan fill="#1F4E79" font-weight="500">经验的封装程度</tspan>决定。</text>
</svg>

<p class="foot">关系反过来了：<b>不是 AI 教人，是人把经验交给 AI</b>。</p>
</div>

<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
