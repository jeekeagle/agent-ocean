<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P11 · 三次判断介入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#FFFFFF;font-family:"Noto Sans SC",sans-serif;color:#1A1A1A;overflow:hidden;display:flow-root;position:relative}
.page{padding:92px 130px 0}
.title{font-family:"Noto Serif SC",serif;font-weight:700;font-size:56px;color:#141414}
.figure{margin-top:46px}
.foot{margin-top:26px;font-size:25px;font-weight:300;color:#55534E}
.foot b{font-weight:500;color:#1F4E79}
.course-badge{position:absolute;top:72px;right:130px;z-index:60;display:flex;align-items:center;gap:13px}
.course-badge .cb-text{font-size:22px;font-weight:500;color:#9B998F;letter-spacing:.06em;white-space:nowrap}
.wave{position:absolute;left:0;bottom:20px}
</style>
</head>
<body>
<div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>

<div class="page">
<p class="title">三次判断介入</p>

<svg class="figure" width="1660" height="590" viewBox="0 0 1660 590" fill="none" font-family="Noto Sans SC">
  <text x="0" y="34" font-size="24" fill="#9B998F">AI 负责画页面 · 人负责三次判断</text>

  <!-- 介入一 -->
  <rect x="0" y="84" width="510" height="250" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="40" y="142" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">介入 01</text>
  <text x="40" y="198" font-size="30" font-weight="500" fill="#141414">内容取舍</text>
  <text x="40" y="252" font-size="23" fill="#55534E">从材料里挑哪些上讲、</text>
  <text x="40" y="292" font-size="23" fill="#55534E">哪些不讲。</text>

  <!-- 介入二 -->
  <rect x="575" y="84" width="510" height="250" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="615" y="142" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">介入 02</text>
  <text x="615" y="198" font-size="30" font-weight="500" fill="#141414">优先级判断</text>
  <text x="615" y="252" font-size="23" fill="#55534E">从十几页清单里挑</text>
  <text x="615" y="292" font-size="23" fill="#55534E">哪一页先做细。</text>

  <!-- 介入三 -->
  <rect x="1150" y="84" width="510" height="250" stroke="#1F4E79" stroke-width="3" fill="none"/>
  <text x="1190" y="142" font-family="JetBrains Mono" font-size="22" fill="#1F4E79">介入 03</text>
  <text x="1190" y="198" font-size="30" font-weight="500" fill="#141414">质量判定</text>
  <text x="1190" y="252" font-size="23" fill="#55534E">从两三版稿子里</text>
  <text x="1190" y="292" font-size="23" fill="#55534E">决定留哪一版。</text>

  <line x1="510" y1="209" x2="575" y2="209" stroke="#1F4E79" stroke-width="3"/>
  <path d="M575 209 L557 199 L557 219 Z" fill="#1F4E79"/>
  <line x1="1085" y1="209" x2="1150" y2="209" stroke="#1F4E79" stroke-width="3"/>
  <path d="M1150 209 L1132 199 L1132 219 Z" fill="#1F4E79"/>

  <!-- 呼应 -->
  <line x1="0" y1="392" x2="1660" y2="392" stroke="#E8E6E1" stroke-width="1"/>
  <text x="0" y="452" font-size="27" fill="#141414">三次介入，<tspan fill="#1F4E79" font-weight="500">全部由人完成</tspan>，人工智能没有参与。</text>
  <text x="0" y="512" font-size="26" fill="#55534E">呼应前面的判断：约束没有被消除，只是换了位置——</text>
  <text x="0" y="558" font-size="26" fill="#141414">画页面的<tspan fill="#55534E">体力活</tspan>交出去了，讲什么、先讲什么、讲到什么程度，<tspan fill="#1F4E79" font-weight="500">仍在人手里</tspan>。</text>
</svg>

<p class="foot">最后一步是收口：把流程写成手册，<b>一次摸索，长期可用</b>。</p>
</div>

<svg class="wave" width="1920" height="40" viewBox="0 0 1920 40" fill="none"><path d="M0 20 Q 60 6 120 20 T 240 20 T 360 20 T 480 20 T 600 20 T 720 20 T 840 20 T 960 20 T 1080 20 T 1200 20 T 1320 20 T 1440 20 T 1560 20 T 1680 20 T 1800 20 T 1920 20" stroke="#E8E6E1" stroke-width="2" fill="none"/></svg>
</body>
</html>
