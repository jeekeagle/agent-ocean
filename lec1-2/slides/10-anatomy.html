<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能体全貌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">智能体全貌</p>

  <svg class="figure" width="1660" height="640" viewBox="0 0 1660 640" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE COMPLETE AGENT</text>

    <!-- 连接线（先画，节点压在其上） -->
    <g stroke="#B9B7AF" stroke-width="2" fill="none">
      <path d="M470 150 L 700 270"/>
      <path d="M1190 150 L 960 270"/>
      <path d="M470 490 L 700 370"/>
      <path d="M1190 490 L 960 370"/>
      <path d="M830 180 L 830 270"/>
    </g>

    <!-- 中心 -->
    <rect x="700" y="270" width="260" height="120" rx="4" stroke="#1F4E79" stroke-width="3" fill="#FFFFFF"/>
    <text x="830" y="330" text-anchor="middle" font-family="Noto Serif SC" font-weight="700" font-size="36" fill="#1F4E79">智能体</text>
    <text x="830" y="368" text-anchor="middle" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">AGENT</text>

    <!-- 灵魂 -->
    <rect x="680" y="60" width="300" height="120" rx="4" stroke="#101010" stroke-width="2" fill="#FFFFFF"/>
    <text x="830" y="115" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">编排</text>
    <text x="830" y="153" text-anchor="middle" font-family="Noto Sans SC" font-size="23" fill="#55534E">智能体的灵魂</text>

    <!-- 左上：大脑 -->
    <rect x="160" y="80" width="310" height="140" rx="4" stroke="#101010" stroke-width="2" fill="#FFFFFF"/>
    <text x="200" y="140" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">大脑</text>
    <text x="200" y="182" font-family="Noto Sans SC" font-size="23" fill="#55534E">大模型 · 提示词</text>
    <text x="345" y="140" font-family="JetBrains Mono" font-size="18" fill="#9B998F">LLM</text>

    <!-- 右上：知识 -->
    <rect x="1190" y="80" width="310" height="140" rx="4" stroke="#101010" stroke-width="2" fill="#FFFFFF"/>
    <text x="1230" y="140" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">知识</text>
    <text x="1230" y="182" font-family="Noto Sans SC" font-size="23" fill="#55534E">RAG · 外挂硬盘</text>
    <text x="1375" y="140" font-family="JetBrains Mono" font-size="18" fill="#9B998F">RAG</text>

    <!-- 左下：手脚 -->
    <rect x="160" y="450" width="310" height="140" rx="4" stroke="#101010" stroke-width="2" fill="#FFFFFF"/>
    <text x="200" y="510" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">手和脚</text>
    <text x="200" y="552" font-family="Noto Sans SC" font-size="23" fill="#55534E">工具 · Function Calling</text>

    <!-- 右下：记忆 -->
    <rect x="1190" y="450" width="310" height="140" rx="4" stroke="#101010" stroke-width="2" fill="#FFFFFF"/>
    <text x="1230" y="510" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">记忆</text>
    <text x="1230" y="552" font-family="Noto Sans SC" font-size="23" fill="#55534E">上下文 · 长短时</text>
    <text x="1375" y="510" font-family="JetBrains Mono" font-size="18" fill="#9B998F">MEM</text>

    <!-- 底部：输入到输出 -->
    <line x1="0" y1="618" x2="1660" y2="618" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="0" y="610" font-family="JetBrains Mono" font-size="19" letter-spacing="2" fill="#9B998F">INPUT: USER INTENT → OUTPUT: TASK DONE</text>
  </svg>

  <p class="foot">理解意图 · 翻阅资料 · 具备记忆 · 一步步执行——组装在一起，才是<b>真正的智能体</b>。</p>
</body>
</html>
