<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>开放问题</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 76px 130px 0; }
  .foot { margin: 42px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">开放问题</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">QUESTIONS TO TAKE AWAY</text>

    <!-- Q1 -->
    <rect x="0" y="70" width="1660" height="130" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="50" y="148" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#1F4E79">Q1</text>
    <text x="170" y="136" font-family="Noto Sans SC" font-size="30" fill="#141414">模型越来越强，<tspan font-weight="500" fill="#1F4E79">编排</tspan>还重要吗？</text>
    <text x="170" y="176" font-family="Noto Sans SC" font-size="23" fill="#9B998F">如果一切交给模型自己规划，这套编排设计是不是白做了</text>

    <!-- Q2 -->
    <rect x="0" y="230" width="1660" height="130" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="50" y="308" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#1F4E79">Q2</text>
    <text x="170" y="296" font-family="Noto Sans SC" font-size="30" fill="#141414">数字员工办错了事，<tspan font-weight="500" fill="#1F4E79">责任归谁</tspan>？</text>
    <text x="170" y="336" font-family="Noto Sans SC" font-size="23" fill="#9B998F">模型幻觉、知识库过期、提示词失当——三者如何区分</text>

    <!-- Q3 -->
    <rect x="0" y="390" width="1660" height="130" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="50" y="468" font-family="JetBrains Mono" font-size="30" font-weight="500" fill="#1F4E79">Q3</text>
    <text x="170" y="456" font-family="Noto Sans SC" font-size="30" fill="#141414">记忆越来越懂你，<tspan font-weight="500" fill="#1F4E79">边界</tspan>在哪里？</text>
    <text x="170" y="496" font-family="Noto Sans SC" font-size="23" fill="#9B998F">个性化与隐私之间，那条线该由谁来划</text>
  </svg>

  <p class="foot">三个问题都没有标准答案——<b>答案在你们将来设计的系统里</b>。</p>

</html>
