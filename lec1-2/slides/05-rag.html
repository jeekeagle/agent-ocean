<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>检索增强生成</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">检索增强生成</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">RETRIEVAL-AUGMENTED GENERATION</text>

    <!-- 检索 → 生成 流水线 -->
    <rect x="20" y="70" width="280" height="90" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="160" y="125" text-anchor="middle" font-family="Noto Sans SC" font-size="28" fill="#141414">客户提问</text>

    <line x1="300" y1="115" x2="370" y2="115" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M382 115 L 364 105 L 364 125 Z" fill="#B9B7AF"/>

    <rect x="380" y="70" width="400" height="90" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="580" y="125" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">检索知识库</text>

    <line x1="780" y1="115" x2="850" y2="115" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M862 115 L 844 105 L 844 125 Z" fill="#B9B7AF"/>

    <rect x="860" y="70" width="280" height="90" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="1000" y="125" text-anchor="middle" font-family="Noto Sans SC" font-size="28" fill="#141414">生成回答</text>

    <text x="1220" y="108" font-family="Noto Sans SC" font-size="25" fill="#55534E">回答基于检索到的材料，</text>
    <text x="1220" y="150" font-family="Noto Sans SC" font-size="25" fill="#55534E">不再靠模型自己「回忆」。</text>

    <!-- 知识库内容 -->
    <line x1="580" y1="160" x2="580" y2="200" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="6 6"/>
    <g font-family="Noto Sans SC" font-size="24" fill="#55534E">
      <rect x="380" y="200" width="400" height="52" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="410" y="234">产品说明书</text>
      <rect x="380" y="264" width="400" height="52" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="410" y="298">退换货政策</text>
      <rect x="380" y="328" width="400" height="52" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="410" y="362">常见问题 QA</text>
    </g>
    <text x="860" y="234" font-family="JetBrains Mono" font-size="19" fill="#9B998F">KNOWLEDGE BASE</text>
    <text x="860" y="272" font-family="Noto Sans SC" font-size="24" fill="#55534E">全部业务资料扔进一处，</text>
    <text x="860" y="310" font-family="Noto Sans SC" font-size="24" fill="#55534E">提问时先查，再答。</text>

    <!-- 三个变化 -->
    <line x1="20" y1="420" x2="1640" y2="420" stroke="#E8E6E1" stroke-width="1.5"/>
    <g>
      <text x="20" y="478" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">UPDATE</text>
      <text x="20" y="530" font-family="Noto Sans SC" font-size="27" fill="#141414">业务知识随时可更新</text>
      <text x="20" y="572" font-family="Noto Sans SC" font-size="23" fill="#9B998F">不用每天去改提示词</text>

      <line x1="560" y1="450" x2="560" y2="580" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="610" y="478" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">CAPACITY</text>
      <text x="610" y="530" font-family="Noto Sans SC" font-size="27" fill="#141414">知识容量可以无限扩大</text>
      <text x="610" y="572" font-family="Noto Sans SC" font-size="23" fill="#9B998F">产品成千上万也装得下</text>

      <line x1="1120" y1="450" x2="1120" y2="580" stroke="#E8E6E1" stroke-width="1.5"/>
      <text x="1170" y="478" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">HALLUCINATION</text>
      <text x="1170" y="530" font-family="Noto Sans SC" font-size="27" fill="#141414">幻觉被有效抑制</text>
      <text x="1170" y="572" font-family="Noto Sans SC" font-size="23" fill="#9B998F">不编造，照材料说话</text>
    </g>
  </svg>

  <p class="foot">RAG 就是给大模型挂一块<b>外挂硬盘</b>——客服从此答得对问题。</p>
</body>
</html>
