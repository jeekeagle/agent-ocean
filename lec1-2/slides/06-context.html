<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>上下文记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">上下文记忆</p>

  <svg class="figure" width="1660" height="600" viewBox="0 0 1660 600" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">THE CHAT KEEPS LOSING THE THREAD</text>

    <!-- 断片对话 -->
    <rect x="20" y="66" width="560" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="56" y="119" font-family="Noto Sans SC" font-size="27" fill="#55534E">客户：iPhone 的保修政策是什么？</text>

    <rect x="20" y="176" width="420" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="56" y="229" font-family="Noto Sans SC" font-size="27" fill="#55534E">客户：最便宜多少钱？</text>

    <line x1="440" y1="219" x2="520" y2="219" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M532 219 L 514 209 L 514 229 Z" fill="#B9B7AF"/>

    <rect x="540" y="176" width="420" height="86" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="750" y="229" text-anchor="middle" font-family="Noto Sans SC" font-size="27" fill="#141414">模型：「您问的是哪一款？」</text>

    <text x="1020" y="110" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">聊着聊着，断片了</text>
    <text x="1020" y="156" font-family="Noto Sans SC" font-size="24" fill="#9B998F">上一句的产品，下一句就丢了</text>

    <!-- 根因 -->
    <line x1="20" y1="330" x2="1640" y2="330" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="20" y="386" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#1F4E79">ROOT CAUSE</text>
    <text x="20" y="440" font-family="Noto Sans SC" font-size="28" fill="#55534E">大模型本身<tspan font-weight="500" fill="#141414">没有记忆</tspan>——每一次对话对它都是独立的、从零开始的。</text>

    <!-- 解法 -->
    <g>
      <rect x="20" y="490" width="360" height="80" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="200" y="540" text-anchor="middle" font-family="Noto Sans SC" font-size="26" fill="#141414">历史对话</text>

      <line x1="380" y1="530" x2="450" y2="530" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M462 530 L 444 520 L 444 540 Z" fill="#B9B7AF"/>

      <rect x="470" y="490" width="440" height="80" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
      <text x="690" y="540" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">同步进上下文</text>

      <line x1="910" y1="530" x2="980" y2="530" stroke="#B9B7AF" stroke-width="2.5"/>
      <path d="M992 530 L 974 520 L 974 540 Z" fill="#B9B7AF"/>

      <rect x="1000" y="490" width="360" height="80" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
      <text x="1180" y="540" text-anchor="middle" font-family="Noto Sans SC" font-size="26" fill="#141414">连贯回答</text>

      <text x="1410" y="540" font-family="JetBrains Mono" font-size="19" fill="#9B998F">= memory</text>
    </g>
  </svg>

  <p class="foot">挂上历史，它才接得上话——但这时还只是<b>答题的智能体</b>，解决不了实际问题。</p>
</body>
</html>
