<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>P02 · 套壳现象</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">套壳现象</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <!-- 左：产品分层解剖 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WHAT THE MARKET CALLS IT</text>
    <!-- 外层：号称智能体 -->
    <rect x="20" y="70" width="560" height="420" rx="6" stroke="#1F4E79" stroke-width="2.5" stroke-dasharray="10 8" fill="none"/>
    <rect x="60" y="60" width="240" height="40" fill="#FFFFFF"/>
    <text x="70" y="90" font-family="Noto Serif SC" font-weight="600" font-size="26" fill="#1F4E79">号称：智能体</text>
    <!-- 中层：聊天机器人 -->
    <rect x="90" y="150" width="420" height="290" rx="6" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <rect x="130" y="140" width="220" height="38" fill="#FFFFFF"/>
    <text x="140" y="169" font-size="24" fill="#55534E">实际：聊天机器人</text>
    <!-- 核心：纯大模型 -->
    <rect x="170" y="230" width="260" height="140" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="300" y="292" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">纯大模型</text>
    <text x="300" y="332" text-anchor="middle" font-family="JetBrains Mono" font-size="19" fill="#9B998F">raw LLM</text>

    <!-- 右：三缺 -->
    <text x="760" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WHAT IT ACTUALLY LACKS</text>
    <g font-family="Noto Sans SC" font-size="28" fill="#55534E">
      <rect x="760" y="90" width="420" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="800" y="144">业务知识库</text>
      <line x1="1210" y1="102" x2="1290" y2="164" stroke="#B9B7AF" stroke-width="2.5"/>
      <line x1="1290" y1="102" x2="1210" y2="164" stroke="#B9B7AF" stroke-width="2.5"/>

      <rect x="760" y="230" width="420" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="800" y="284">工具与系统接口</text>
      <line x1="1210" y1="242" x2="1290" y2="304" stroke="#B9B7AF" stroke-width="2.5"/>
      <line x1="1290" y1="242" x2="1210" y2="304" stroke="#B9B7AF" stroke-width="2.5"/>

      <rect x="760" y="370" width="420" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
      <text x="800" y="424">记忆与编排</text>
      <line x1="1210" y1="382" x2="1290" y2="444" stroke="#B9B7AF" stroke-width="2.5"/>
      <line x1="1290" y1="382" x2="1210" y2="444" stroke="#B9B7AF" stroke-width="2.5"/>
    </g>

    <!-- 结论标注 -->
    <text x="1360" y="275" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">拆开一看，</text>
    <text x="1360" y="318" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">还是那个</text>
    <text x="1360" y="361" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#1F4E79">聊天框。</text>
  </svg>

  <p class="foot">市面上不少号称智能体的产品，本质是<b>套了壳的聊天机器人</b>——差距不在模型，在壳里少的那三样东西。</p>
</body>
</html>
