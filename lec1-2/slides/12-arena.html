<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产品战场</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">产品战场</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WHERE PRODUCT MANAGERS COMPETE</text>

    <!-- 上层：编排与设计 -->
    <rect x="20" y="80" width="1060" height="180" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="70" y="160" font-family="Noto Serif SC" font-weight="700" font-size="40" fill="#1F4E79">编排与设计</text>
    <text x="70" y="212" font-family="Noto Sans SC" font-size="26" fill="#55534E">什么时候调哪个模块、按什么顺序、给谁记忆</text>
    <text x="1040" y="120" text-anchor="end" font-family="JetBrains Mono" font-size="19" letter-spacing="2" fill="#1F4E79">THE REAL BATTLEFIELD</text>

    <!-- 向下箭头：价值落到底层 -->
    <line x1="550" y1="260" x2="550" y2="316" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M550 330 L 540 312 L 560 312 Z" fill="#B9B7AF"/>

    <!-- 下层：底层算法 -->
    <rect x="20" y="342" width="1060" height="150" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="10 8" fill="none"/>
    <text x="70" y="412" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#55534E">底层算法</text>
    <text x="70" y="458" font-family="Noto Sans SC" font-size="25" fill="#9B998F">模型能力持续变强，不必去卷</text>
    <text x="1040" y="382" text-anchor="end" font-family="JetBrains Mono" font-size="19" letter-spacing="2" fill="#9B998F">NOT YOUR RACE</text>

    <!-- 右侧结论 -->
    <line x1="1150" y1="80" x2="1150" y2="492" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="1220" y="180" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">定义出</text>
    <text x="1220" y="234" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#141414">「真正能工作的」</text>
    <text x="1220" y="288" font-family="Noto Serif SC" font-weight="600" font-size="32" fill="#1F4E79">智能体</text>
    <line x1="1220" y1="330" x2="1440" y2="330" stroke="#1F4E79" stroke-width="3"/>
    <text x="1220" y="392" font-family="Noto Sans SC" font-size="25" fill="#55534E">靠的是这套</text>
    <text x="1220" y="434" font-family="Noto Sans SC" font-size="25" fill="#55534E">编排逻辑。</text>
  </svg>

  <p class="foot">产品经理不需要卷底层算法——真正的战场在<b>编排与设计</b>。</p>
</body>
</html>
