<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>能力质变</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 72px 130px 0; }
  .foot { margin: 40px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">能力质变</p>

  <svg class="figure" width="1660" height="560" viewBox="0 0 1660 560" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">TOY → TOOL → PRODUCTIVITY</text>

    <!-- 三个台阶 -->
    <rect x="20" y="330" width="440" height="150" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <text x="70" y="400" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#55534E">玩具</text>
    <text x="70" y="445" font-family="Noto Sans SC" font-size="25" fill="#9B998F">只会说的聊天框</text>
    <text x="420" y="370" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#C9C7C0">01</text>

    <path d="M470 405 L 570 345" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M582 338 L 562 338 L 572 356 Z" fill="#B9B7AF"/>

    <rect x="600" y="220" width="440" height="150" stroke="#55534E" stroke-width="2" fill="none"/>
    <text x="650" y="290" font-family="Noto Serif SC" font-weight="600" font-size="34" fill="#141414">工具</text>
    <text x="650" y="335" font-family="Noto Sans SC" font-size="25" fill="#55534E">能做事的数字员工</text>
    <text x="1000" y="260" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#C9C7C0">02</text>

    <path d="M1050 295 L 1150 235" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <path d="M1162 228 L 1142 228 L 1152 246 Z" fill="#1F4E79"/>

    <rect x="1180" y="110" width="440" height="150" stroke="#1F4E79" stroke-width="3" fill="none"/>
    <text x="1230" y="180" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">生产力</text>
    <text x="1230" y="225" font-family="Noto Sans SC" font-size="25" fill="#55534E">进入真实业务流程</text>
    <text x="1580" y="150" text-anchor="end" font-family="JetBrains Mono" font-size="18" fill="#1F4E79">03</text>

    <!-- 底部基线 -->
    <line x1="20" y1="510" x2="1620" y2="510" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="20" y="552" font-family="Noto Sans SC" font-size="27" fill="#55534E">一次跨越：<tspan font-weight="500" fill="#141414">从「只会说」到「能做事」</tspan>。</text>
  </svg>

  <p class="foot">这不只是技术升级，而是从玩具到工具、进而成为<b>生产力</b>的能力质变。</p>
</body>
</html>
