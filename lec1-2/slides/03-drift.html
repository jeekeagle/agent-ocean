<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">人格漂移</p>

  <svg class="figure" width="1660" height="700" viewBox="0 0 1660 700" fill="none">
    <!-- 客户提问 -->
    <rect x="560" y="20" width="540" height="80" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="830" y="70" text-anchor="middle" font-family="Noto Sans SC" font-size="28" fill="#141414">客户：订单为什么还没发货？</text>

    <!-- 三条发散箭头 -->
    <path d="M700 100 C 560 180, 420 210, 300 268" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <path d="M292 278 L 298 260 L 312 270" fill="#B9B7AF"/>
    <line x1="830" y1="100" x2="830" y2="270" stroke="#B9B7AF" stroke-width="2"/>
    <path d="M822 282 L 838 282 L 830 266" fill="#B9B7AF"/>
    <path d="M960 100 C 1100 180, 1240 210, 1360 268" stroke="#B9B7AF" stroke-width="2" fill="none"/>
    <path d="M1348 270 L 1362 260 L 1368 278" fill="#B9B7AF"/>

    <!-- 三个漂移人格 -->
    <rect x="60" y="290" width="500" height="150" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="100" y="345" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">MODE A · 百科</text>
    <text x="100" y="398" font-family="Noto Sans SC" font-size="26" fill="#55534E">讲一段现代物流发展史</text>

    <rect x="600" y="290" width="460" height="150" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="640" y="345" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">MODE B · 陪聊</text>
    <text x="640" y="398" font-family="Noto Sans SC" font-size="26" fill="#55534E">识别到情绪，转去安抚</text>

    <rect x="1110" y="290" width="490" height="150" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="1150" y="345" font-family="JetBrains Mono" font-size="19" letter-spacing="3" fill="#9B998F">MODE C · 编造</text>
    <text x="1150" y="398" font-family="Noto Sans SC" font-size="26" fill="#55534E">随口编：是不是信号不好</text>

    <text x="830" y="505" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#141414">同一问题，每次回答都像开盲盒——像百科、像陪聊、像论文，就是不像客服</text>

    <!-- 根因 -->
    <line x1="130" y1="560" x2="1530" y2="560" stroke="#E8E6E1" stroke-width="1"/>
    <text x="130" y="615" font-family="JetBrains Mono" font-size="21" letter-spacing="3" fill="#1F4E79">ROOT CAUSE</text>
    <text x="130" y="670" font-family="Noto Sans SC" font-size="28" fill="#55534E">默认目标是「生成<tspan font-weight="500" fill="#141414">最通用合理</tspan>的语言」，而不是「输出<tspan font-weight="500" fill="#1F4E79">业务上最正确</tspan>的回答」——通用与正确之间，隔着整个业务场景。</text>
