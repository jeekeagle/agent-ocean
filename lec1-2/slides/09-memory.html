<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>长短时记忆</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color:#141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">长短时记忆</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SHORT-TERM × LONG-TERM MEMORY</text>

    <!-- 记忆闭环 -->
    <rect x="40" y="90" width="300" height="90" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="190" y="145" text-anchor="middle" font-family="Noto Sans SC" font-size="27" fill="#141414">交互历史</text>
    <text x="190" y="200" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">short-term</text>

    <path d="M340 135 C 430 135, 450 200, 450 260" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M450 274 L 440 256 L 460 256 Z" fill="#B9B7AF"/>

    <rect x="300" y="274" width="300" height="90" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="450" y="329" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="27" fill="#1F4E79">沉淀为长期记忆</text>

    <path d="M300 319 C 230 319, 210 380, 210 420" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M210 434 L 200 416 L 220 416 Z" fill="#B9B7AF"/>

    <rect x="60" y="434" width="300" height="90" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="210" y="489" text-anchor="middle" font-family="Noto Sans SC" font-size="27" fill="#141414">注入上下文</text>

    <path d="M360 479 C 450 479, 520 460, 560 420" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M572 408 L 566 428 L 550 418 Z" fill="#B9B7AF"/>

    <rect x="430" y="90" width="300" height="90" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="580" y="145" text-anchor="middle" font-family="Noto Sans SC" font-size="27" fill="#55534E">更懂你的服务</text>

    <path d="M670 180 C 690 240, 640 250, 610 262" stroke="#B9B7AF" stroke-width="2.5" fill="none"/>
    <path d="M598 268 L 618 270 L 610 252 Z" fill="#B9B7AF"/>

    <path d="M190 274 C 190 240, 170 210, 175 180" stroke="#B9B7AF" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <text x="105" y="240" font-family="JetBrains Mono" font-size="17" fill="#9B998F">loop</text>

    <!-- 右：同一个请求，两种服务 -->
    <line x1="850" y1="70" x2="850" y2="550" stroke="#E8E6E1" stroke-width="1.5"/>

    <text x="920" y="110" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">SAME REQUEST</text>
    <rect x="920" y="140" width="700" height="120" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="960" y="195" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">新客户：查一下订单</text>
    <text x="960" y="235" font-family="Noto Sans SC" font-size="24" fill="#9B998F">标准话术 · 通用处理路径</text>

    <line x1="1270" y1="260" x2="1270" y2="320" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M1270 334 L 1260 316 L 1280 316 Z" fill="#B9B7AF"/>

    <rect x="920" y="344" width="700" height="120" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="960" y="399" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#1F4E79">老客户：查一下订单</text>
    <text x="960" y="439" font-family="Noto Sans SC" font-size="24" fill="#55534E">记得偏好 · 个性化话术与推荐</text>

    <text x="920" y="530" font-family="Noto Sans SC" font-size="25" fill="#55534E">同样一句提问，拿到的<tspan font-weight="500" fill="#1F4E79">服务完全不同</tspan>。</text>
  </svg>

  <p class="foot">记忆，让智能体从<b>能干活</b>走到<b>懂你</b>。</p>
</body>
</html>
