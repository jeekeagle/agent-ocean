<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>工具调用</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1920px; height: 1080px; background: #FFFFFF; font-family: "Noto Sans SC", sans-serif; color: #1A1A1A; overflow: hidden; display: flow-root; }
  .assertion { margin: 96px 130px 0; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 56px; color: #141414; }
  .figure { margin: 70px 130px 0; }
  .foot { margin: 38px 130px 0; font-size: 25px; font-weight: 300; color: #55534E; }
  .foot b { font-weight: 500; color: #141414; }
</style>
<style>
  .course-badge { position: absolute; top: 72px; right: 130px; z-index: 60;
    display: flex; align-items: center; gap: 13px; }
  .course-badge .cb-text { font-family: "Noto Sans SC", sans-serif; font-size: 22px;
    font-weight: 500; color: #9B998F; letter-spacing: 0.06em; white-space: nowrap; }
</style></head>
<body><div class="course-badge"><svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg"><line x1="11" y1="11" x2="19" y2="7" stroke="#1F4E79" stroke-width="1.6"/><line x1="19" y1="7" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.6"/><line x1="11" y1="11" x2="27" y2="11" stroke="#1F4E79" stroke-width="1.4" stroke-dasharray="2 2.4"/><line x1="19" y1="7" x2="19" y2="20" stroke="#1F4E79" stroke-width="1.6"/><circle cx="11" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="7" r="2.7" fill="#1F4E79"/><circle cx="27" cy="11" r="2.7" fill="#1F4E79"/><circle cx="19" cy="20" r="2.7" fill="#1F4E79"/><path d="M5 29 Q9.5 25.5 14 29 T23 29 T33 29" stroke="#1F4E79" stroke-width="1.8" fill="none" stroke-linecap="round"/><path d="M5 34 Q9.5 31 14 34 T23 34 T33 34" stroke="#1F4E79" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/></svg><span class="cb-text">人工智能 × 具身智能 · 赋能海洋</span></div>
  <p class="assertion">工具调用</p>

  <svg class="figure" width="1660" height="620" viewBox="0 0 1660 620" fill="none">
    <!-- 左：只输出文本 -->
    <text x="0" y="30" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#9B998F">WITHOUT TOOLS</text>
    <rect x="0" y="70" width="440" height="86" rx="4" stroke="#E8E6E1" stroke-width="2" fill="none"/>
    <text x="36" y="123" font-family="Noto Sans SC" font-size="27" fill="#55534E">客户：帮我查一下订单状态</text>

    <rect x="20" y="240" width="240" height="110" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="140" y="292" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">大模型</text>
    <text x="140" y="330" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">text only</text>

    <line x1="340" y1="248" x2="430" y2="342" stroke="#B9B7AF" stroke-width="2.5"/>
    <line x1="430" y1="248" x2="340" y2="342" stroke="#B9B7AF" stroke-width="2.5"/>

    <rect x="450" y="240" width="250" height="110" rx="4" stroke="#B9B7AF" stroke-width="2" stroke-dasharray="8 6" fill="none"/>
    <text x="575" y="292" text-anchor="middle" font-family="Noto Sans SC" font-size="27" fill="#55534E">订单系统</text>
    <text x="575" y="330" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">unreachable</text>

    <text x="20" y="430" font-family="Noto Sans SC" font-size="25" fill="#55534E">它只会输出文本，<tspan font-weight="500" fill="#141414">碰不到</tspan>任何业务系统。</text>

    <!-- 分水岭 -->
    <line x1="770" y1="40" x2="770" y2="560" stroke="#E8E6E1" stroke-width="1.5"/>
    <text x="810" y="70" font-family="JetBrains Mono" font-size="20" letter-spacing="3" fill="#1F4E79">TURNING POINT</text>

    <!-- 右：Function Calling -->
    <rect x="810" y="120" width="260" height="96" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="940" y="177" text-anchor="middle" font-family="Noto Serif SC" font-weight="600" font-size="28" fill="#141414">大模型</text>

    <line x1="1070" y1="168" x2="1140" y2="168" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M1152 168 L 1134 158 L 1134 178 Z" fill="#B9B7AF"/>

    <rect x="1160" y="120" width="480" height="96" rx="4" stroke="#1F4E79" stroke-width="2.5" fill="none"/>
    <text x="1400" y="164" text-anchor="middle" font-family="JetBrains Mono" font-size="22" letter-spacing="2" fill="#1F4E79">FUNCTION CALLING</text>
    <text x="1400" y="198" text-anchor="middle" font-family="Noto Sans SC" font-size="24" fill="#55534E">选择并调用合适的工具</text>

    <line x1="1400" y1="216" x2="1400" y2="290" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M1400 302 L 1390 284 L 1410 284 Z" fill="#B9B7AF"/>

    <rect x="1160" y="312" width="480" height="96" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="1400" y="358" text-anchor="middle" font-family="Noto Sans SC" font-size="26" fill="#141414">订单系统 · 物流 API</text>
    <text x="1400" y="392" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">tools = hands &amp; feet</text>

    <line x1="1160" y1="360" x2="1090" y2="360" stroke="#B9B7AF" stroke-width="2.5"/>
    <path d="M1078 360 L 1096 350 L 1096 370 Z" fill="#B9B7AF"/>

    <rect x="810" y="312" width="260" height="96" rx="4" stroke="#101010" stroke-width="2" fill="none"/>
    <text x="940" y="358" text-anchor="middle" font-family="Noto Sans SC" font-size="26" fill="#141414">查到结果并回复</text>
    <text x="940" y="392" text-anchor="middle" font-family="JetBrains Mono" font-size="18" fill="#9B998F">result</text>

    <!-- 会说 → 能干 -->
    <text x="810" y="500" font-family="Noto Serif SC" font-weight="600" font-size="30" fill="#9B998F">「会说的」</text>
    <line x1="960" y1="490" x2="1080" y2="490" stroke="#1F4E79" stroke-width="3"/>
    <path d="M1094 490 L 1074 480 L 1074 500 Z" fill="#1F4E79"/>
    <text x="1120" y="500" font-family="Noto Serif SC" font-weight="700" font-size="34" fill="#1F4E79">「能干的」</text>
    <text x="810" y="556" font-family="Noto Sans SC" font-size="25" fill="#55534E">一个真正意义上<tspan font-weight="500" fill="#1F4E79">能干活的数字员工</tspan>。</text>
  </svg>

  <p class="foot">工具是给大模型安上的<b>手和脚</b>——这一步，是分水岭。</p>
</body>
</html>
